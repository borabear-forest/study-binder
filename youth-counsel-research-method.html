"② 현상학적 연구는 사람들에 대한 상세한 기술을 통하여 인간의 경험을 검토한다.", "③ 해석학적 연구는 문헌과 서면으로 전달된 의미를 해석하는 연구이다.", "④ 행위연구는 행위자들이 동일한 관점에서 상황을 이해하고 그 상황을 변화시켜야 하는지 여부를 판단할 수 있도록 한다.", "⑤ 사례연구는 특정 사례에 대한 종합적 기술과 분석을 중시한다."], "answer": 3, "expl": "행위연구(실행연구)는 참여자들이 서로 다른 관점을 공유하며 상황을 이해하고 변화를 모색하는 것으로, '동일한 관점'이라는 설명이 틀리다."}, {"no": "18-25", "year": 2019, "qno": 25, "text": "사례지향적(case-oriented) 연구의 특징으로 옳지 않은 것은?", "options": ["① 사례유형화를 중심으로 진행되는 연구이다.", "② 역사적 맥락을 검토하고 관련 자료를 다룬다.", "③ 종합적, 해석적 설명을 지향한다.", "④ 유형화된 다양성의 이해를 바탕으로 한다.", "⑤ 변수들 간의 관계를 설명하는 연구이다."], "answer": 4, "expl": "변수들 간 관계를 설명하는 것은 변수지향적(variable-oriented) 연구의 특징이다."}, {"no": "17-1", "year": 2018, "qno": 1, "text": "다음에 공통으로 해당하는 실험설계 방법은?\n○ 진실험설계 중 하나\n○ 사전검사 실시가 처치 효과를 왜곡시킬 가능성이 있을 때 적합한 설계\n○ 통제집단 사후검사설계와 통제집단 전후검사설계를 동시에 포함시킨 설계", "options": ["① 구획설계", "② 배속설계", "③ 요인설계", "④ 라틴 정방형 설계", "⑤ 솔로몬 4집단 설계"], "answer": 4, "expl": "사후검사 통제집단 설계와 전후검사 통제집단 설계를 합쳐 사전검사의 영향까지 확인하는 진실험설계는 솔로몬 4집단 설계이다."}, {"no": "17-2", "year": 2018, "qno": 2, "text": "다음 내용에서 공통적으로 위반가능성을 내포하는 연구윤리는?\n○ 수업을 듣는 학생이 연구에 참여해야만 학점을 받을 수 있어 연구에 참여한다.\n○ 동의서 작성 후 집단상담연구에 참여하였으나 구성원이 마음에 들지 않아 그만두고 싶은데 연구자의 암묵적 압력으로 그만두지 못한다.", "options": ["① 비밀유지와 사생활보호", "② 고지된 동의", "③ 속임수의 사용", "④ 자율성의 원칙", "⑤ 진실성의 원칙"], "answer": 3, "expl": "참여 강요와 중도 포기를 막는 암묵적 압력은 참여 여부를 스스로 결정할 자율성의 원칙을 위반할 수 있다."}, {"no": "17-3", "year": 2018, "qno": 3, "text": "통계적 결론 타당도를 저해하는 요인은?", "options": ["① 통계적 가정의 충족", "② 자료 중심의 투망질식 검정", "③ 측정도구의 높은 내적일치도", "④ 전집을 대표할 수 있는 표집방법의 사용", "⑤ 처치도구의 표준화"], "answer": 1, "expl": "자료를 이리저리 분석해 유의한 결과를 찾는 투망질식(fishing) 검정은 1종 오류를 키워 통계적 결론 타당도를 해친다."}, {"no": "17-4", "year": 2018, "qno": 4, "text": "다음 연구에서 독립변수와 종속변수의 척도를 옳게 짝지은 것은?\n○ 목적: 폭력적 게임이 공격적 행동에 미치는 영향 검증\n○ 설계: 비폭력적 게임 제공 집단을 통제집단으로 한 통제집단 전후검사 설계 - 폭력/비폭력적 게임 직후 옆방에 있는 경쟁자와 버튼 빨리 누르기 과제에 참여\n○ 공격적 행동의 측정: 버튼 빨리 누르기 과제에서 참가자가 경쟁자를 이겼을 때 경쟁자에게 소음충격을 가하는 시간으로 정의", "options": ["① 명명척도 - 등간척도", "② 서열척도 - 등간척도", "③ 명명척도 - 서열척도", "④ 등간척도 - 비율척도", "⑤ 명명척도 - 비율척도"], "answer": 4, "expl": "독립변수(폭력/비폭력 게임 집단)는 명명척도, 종속변수(소음충격 시간)는 절대영점이 있는 비율척도이다."}, {"no": "17-5", "year": 2018, "qno": 5, "text": "링컨과 구바(Y. Lincoln & E. Guba)가 제시한 질적연구의 진실성(trustworthiness) 요건에 해당되지 않는 것은?", "options": ["① 포화성", "② 전이가능성", "③ 안정성", "④ 확증가능성", "⑤ 신뢰성"], "answer": 0, "expl": "링컨과 구바의 진실성 요건은 신빙성, 전이가능성, 의존가능성(안정성), 확증가능성이다. 포화성은 해당하지 않는다."}, {"no": "17-6", "year": 2018, "qno": 6, "text": "다음에서 설명하고 있는 용어는?\n○ 코빈과 스트라우스(J. Corbin & A. Strauss)가 개발한 근거이론에서의 3가지 분석 단계 중 두 번째에 해당한다.\n○ 정보의 범주를 서로 연결시키는 단계이다.", "options": ["① 수평화", "② 괄호화", "③ 개방코딩", "④ 선택코딩", "⑤ 축코딩"], "answer": 4, "expl": "근거이론의 두 번째 단계로 범주들을 서로 연결하는 것은 축코딩이다."}, {"no": "17-7", "year": 2018, "qno": 7, "text": "과학적 방법에 관한 설명으로 옳지 않은 것은?", "options": ["① 과학적 방법은 증거를 중시한다.", "② 상식을 체계적으로 확대하여 발전시키면 과학이 될 수 있다.", "③ 과학적으로 검증된 이론은 행동을 안정적으로 예측하게 한다.", "④ 연역법을 활용한 과학적 방법에서는 특정한 자료에서 일반이론을 추론한다.", "⑤ 잘 확립된 이론이라도 조건과 환경의 변화로 반증될 수 있다."], "answer": 3, "expl": "특정 자료에서 일반이론을 추론하는 것은 귀납법이다. 연역법은 일반이론에서 특정 가설을 끌어낸다."}, {"no": "17-8", "year": 2018, "qno": 8, "text": "혼합연구방법에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 혼합연구방법의 설계 유형 중 하나인 삼각검증 설계에서는 양적자료와 질적자료를 동시에 수집한다.\nㄴ. 단일연구방법과 비교해서 시간과 비용이 적게 든다.\nㄷ. 질적자료와 양적자료의 가중치는 항상 동일하게 적용해야 한다.", "options": ["① ㄱ", "② ㄷ", "③ ㄱ, ㄴ", "④ ㄴ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ"], "answer": 0, "expl": "삼각검증 설계는 양적·질적 자료를 동시에 수집한다(ㄱ). 혼합연구는 시간·비용이 더 들고(ㄴ), 두 자료의 가중치는 설계에 따라 달라질 수 있다(ㄷ)."}, {"no": "17-9", "year": 2018, "qno": 9, "text": "종속변수의 정규성 검토를 위한 방법이 아닌 것은?", "options": ["① 샤피로윌크(Shapiro-Wilk)검정", "② Box의 M검정", "③ 콜모고로프-스미르노프(Kolmogorov-Smirnov)검정", "④ 첨도", "⑤ 왜도"], "answer": 1, "expl": "Box의 M검정은 공분산행렬의 동질성 검정이며 정규성 검토 방법이 아니다."}, {"no": "17-10", "year": 2018, "qno": 10, "text": "연구자 A는 청소년 인권감수성 척도를 개발하고자 한다. 이 연구를 수행하기 위한 순서로 옳은 것은?\nㄱ. 문항분석, 요인분석 등을 통해 부적합한 문항을 수정 또는 제거한다.\nㄴ. 청소년에게 예비문항을 이용한 조사를 실시한다.\nㄷ. 인권감수성과 유사한 척도를 개관하고, 인권감수성의 개념을 정의한다.\nㄹ. 인권감수성의 개념을 반영하는 예비문항을 제작한다.", "options": ["① ㄱ - ㄴ - ㄹ - ㄷ", "② ㄴ - ㄹ - ㄷ - ㄱ", "③ ㄷ - ㄹ - ㄴ - ㄱ", "④ ㄹ - ㄴ - ㄱ - ㄷ", "⑤ ㄹ - ㄷ - ㄴ - ㄱ"], "answer": 2, "expl": "척도 개발은 개념 정의 → 예비문항 제작 → 예비조사 → 문항분석·요인분석으로 수정·제거 순서로 진행된다."}, {"no": "17-11", "year": 2018, "qno": 11, "text": "연구문제 및 가설에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 연구문제는 연구의 주제를 함축하고 있다.\nㄴ. 가설은 연구문제에 대한 잠정적 결과이다.\nㄷ. 좋은 가설은 상호 대립하는 요소를 지닌 모순적 진술의 형태를 지닌다.\nㄹ. 가설은 검증할 수 있는 진술의 형태이어야 한다.", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄱ, ㄴ, ㄹ", "④ ㄱ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "연구문제는 주제를 함축하고(ㄱ), 가설은 잠정적 결과이며(ㄴ), 검증 가능한 진술이어야 한다(ㄹ). 좋은 가설은 모순적 진술이 아니다(ㄷ)."}, {"no": "17-12", "year": 2018, "qno": 12, "text": "중학교 1학년에서 1,000명의 학생을 표집하여 매년 초에 1년에 1번씩 3년 동안 행복감을 반복 측정하였다. 표는 잠재성장모형을 활용하여 얻은 분석결과 중 일부이다. 유의수준 1%에서 해석한 것 중 옳지 않은 것은?\n성장요인(Growth Factors) | 평균 | 분산\n초기값(π₀) | 3.2** | 0.9**\n기울기(π₁) | -0.4** | 0.1**\n초기값과 기울기 간 공분산[cov(π₀, π₁)] | -2.1**\n**p<.01", "options": ["① 중학교 1학년에서의 행복감은 개인에 따라 차이가 있다.", "② 행복감의 개인별 변화의 평균은 학년이 올라갈수록 떨어지는 경향이 있다.", "③ 행복감의 개인별 변화는 개인에 따라서 차이가 있다.", "④ 행복감의 개인별 변화의 개인 간 변산을 설명할 수 있는 독립변수를 추가적으로 탐색할 필요가 있다.", "⑤ 중학교 1학년에서 행복감이 낮은 학생일수록 행복감이 더 크게 떨어지는 경향이 있다."], "answer": 4, "expl": "초기값과 기울기의 공분산이 음수(-2.1)이므로 초기 행복감이 높은 학생일수록 더 크게 떨어진다. 낮은 학생일수록 더 크게 떨어진다는 설명은 틀리다."}, {"no": "17-13", "year": 2018, "qno": 13, "text": "연구논문의 서론 및 이론적 배경에 포함될 내용으로 옳은 것을 모두 고른 것은?\nㄱ. 선행연구 결과를 토대로 연구가설이 도출되는 과정\nㄴ. 연구의 주제가 중요한 이유\nㄷ. 연구 주제와 관련한 선행연구의 연구방법 및 결과\nㄹ. 연구 결과의 가설 지지 여부에 관한 의미 해석", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄷ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "서론·이론적 배경에는 가설 도출 과정, 주제의 중요성, 선행연구의 방법과 결과를 쓴다. 가설 지지 여부의 의미 해석(ㄹ)은 논의에 해당한다."}, {"no": "17-14", "year": 2018, "qno": 14, "text": "신뢰도에 관한 설명으로 옳지 않은 것은?", "options": ["① 신뢰도는 관찰점수분산에서 진점수분산이 차지하는 비율로 정의된다.", "② 동일한 자료라면 Cronbach α 계수, KR-21, Hoyt 신뢰도는 동일한 값이 산출된다.", "③ KR-20은 KR-21과 달리 이분(dichotomous)문항인 경우에만 활용할 수 있다.", "④ 신뢰도가 .80이라는 것은 100번을 측정했을 때 그 중 80번은 믿을 수 있는 값이 산출된다는 것을 의미한다.", "⑤ 반분신뢰도를 추정하는 과정에는 스피어만 브라운 공식으로 교정하는 절차가 포함된다."], "answer": [1, 3], "expl": "복수정답(②, ④) 처리된 문항이다. Cronbach α와 KR-20·Hoyt는 같은 값을 내지만 KR-21은 문항 난이도가 같다고 가정해 값이 다를 수 있다(②). 신뢰도 .80은 관찰점수 분산의 80%가 진점수 분산이라는 뜻이다(④)."}, {"no": "17-15", "year": 2018, "qno": 15, "text": "그림은 22명의 내담자를 상담자A집단과 상담자B집단에 각각 11명씩 무선배치한 다음, 프로그램 적용 후의 내담자 자존감 점수를 상담자별로 요약한 것이다. 이에 관한 설명으로 옳지 않은 것은?\n(원본은 자존감 점수별 빈도(명)를 나타낸 꺾은선 그래프)\nA집단: 1점 1명, 2점 5명, 3점 3명, 4점 1명, 5점 1명\nB집단: 1점 1명, 2점 2명, 3점 5명, 4점 2명, 5점 1명", "options": ["① A집단의 왜도는 0보다 크다.", "② A집단의 중앙값은 2이다.", "③ A집단에서는 중앙값이 평균보다 크다.", "④ B집단의 왜도는 0이다.", "⑤ B집단의 평균은 A집단의 평균보다 크다."], "answer": 2, "expl": "A집단의 중앙값(6번째 값)은 2, 평균은 29/11≈2.64로 평균이 중앙값보다 크다. 따라서 중앙값이 평균보다 크다는 설명은 틀리다."}, {"no": "17-16", "year": 2018, "qno": 16, "text": "상담자A는 전국에서 최근 1년 동안 상담 받은 경험이 있는 사람을 전집으로 설정하고 연구대상을 표집하였다. 다음에 해당하는 표집방법은?\n대도시, 중소도시, 읍면지역별로 전집의 수를 조사한 다음, 3개의 각 도시화 정도별로 5%를 무선표집하여 이들을 연구대상으로 활용하였다.", "options": ["① 체계적 표집", "② 의도적 표집", "③ 단계적 표집", "④ 할당표집", "⑤ 유층표집"], "answer": 4, "expl": "도시화 정도별 층으로 나눈 뒤 각 층에서 일정 비율을 무선표집하는 것은 유층(층화)표집이다."}, {"no": "17-17", "year": 2018, "qno": 17, "text": "상담자의 4가지 유형(A, B, C, D) 중 내담자가 가장 선호하는 유형이 내담자의 성(남, 여)에 따라서 차이가 있는지 보기 위해 200명의 내담자를 대상으로 조사하였다. 검정통계량 χ²값이 5.0이고 자유도에 따른 P(χ²≥5.0)의 값이 표와 같다고 할 때, χ²검정에서의 유의확률은?\n자유도 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8\nP(χ²≥5.0) | 0.03 | 0.08 | 0.17 | 0.29 | 0.42 | 0.54 | 0.66 | 0.76", "options": ["① 0.03", "② 0.17", "③ 0.66", "④ 0.83", "⑤ 0.97"], "answer": 1, "expl": "교차분석 자유도는 (4-1)×(2-1)=3이므로 유의확률은 0.17이다."}, {"no": "17-18", "year": 2018, "qno": 18, "text": "중2증후군 척도를 개발하는 과정에서 기존에 타당성이 입증된 척도와 상관을 통해 검증할 수 있는 것은?", "options": ["① 공인타당도", "② 동형검사 신뢰도", "③ 검사-재검사 신뢰도", "④ 안면타당도", "⑤ 내용타당도"], "answer": 0, "expl": "타당성이 입증된 기존 척도와의 상관으로 검증하는 것은 공인타당도이다."}, {"no": "17-19", "year": 2018, "qno": 19, "text": "자존감에 대한 두 프로그램 P₁, P₂의 효과를 비교하기 위해 두 집단에 각각 30명씩 배치한 후, 집단별로 P₁, P₂를 적용하면서 프로그램 실시 이전, 중간, 마무리의 세 시점에서 자존감을 반복 측정하였다. 표는 수집한 자료에 대해 이요인 반복측정 분산분석을 실시한 결과이다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?\nSource | SS | df | MS | F | p\n[피험자 간] 집단(A) | 1.48 | ( X ) | ( ) | .017 | .897\n[피험자 간] 오차 | 5032.94 | 58 | ( ) | |\n[피험자 내] 측정시점(B) | 1998.72 | ( Y ) | ( ) | 9.873 | .000\n[피험자 내] A×B | 861.08 | ( Z ) | ( ) | 4.253 | .016\n[피험자 내] 오차: 측정시점 | 11741.48 | 116 | ( ) | |\nㄱ. X+Y+Z=5이다.\nㄴ. p=.897은 마무리 시점에서 두 집단의 자존감 평균 차이가 유의미하지 않음을 의미한다.\nㄷ. 두 프로그램 P₁, P₂의 효과는 유의수준 5%에서 유의미한 차이가 있다.", "options": ["① ㄴ", "② ㄷ", "③ ㄱ, ㄴ", "④ ㄱ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ"], "answer": 3, "expl": "X=1, Y=2, Z=2이므로 합은 5이다(ㄱ). 상호작용(A×B)이 유의해 두 프로그램의 효과가 다르다(ㄷ). p=.897은 집단 주효과에 대한 것이지 마무리 시점의 차이가 아니다(ㄴ)."}, {"no": "17-20", "year": 2018, "qno": 20, "text": "그림은 행복감 관련변수 간의 이론적 인과관계에 대한 연구모형이다. 이에 관한 설명으로 옳지 않은 것은? (단, 직사각형: 측정변수, 화살표: 인과관계)\n(원본 그림의 경로)\n부모애착 → 친구애착, 부모애착 → 학교적응, 친구애착 → 학교적응, 학교적응 → 행복감\n오차항: d1 → 친구애착, d2 → 학교적응, d3 → 행복감 (각 경로계수 1로 고정)", "options": ["① 자유도는 3이다.", "② 간명(overidentified)모형에 해당한다.", "③ 3개의 내생변수를 가진다.", "④ 경로분석을 통해 이중매개효과를 검증할 수 있다.", "⑤ 부모애착과 친구애착 간의 화살표 방향을 반대로 하더라도 적합도는 변하지 않는다."], "answer": 0, "expl": "관측변수 4개로 정보는 10개, 추정모수는 경로 4개+분산 4개=8개라 자유도는 2이다. 자유도가 3이라는 설명은 틀리다."}, {"no": "17-21", "year": 2018, "qno": 21, "text": "분포에 관한 설명으로 옳은 것은?", "options": ["① 표준정규분포는 자유도에 따라 그 모양이 달라진다.", "② 표준정규분포와 t분포는 첨도가 1이다.", "③ 자유도가 3인 χ²분포는 정적인 편포이다.", "④ χ²값은 0보다 작은 값을 가질 수 있다.", "⑤ F분포는 1개의 자유도를 가진다."], "answer": 2, "expl": "χ²분포는 자유도가 작을 때 오른쪽 꼬리가 긴 정적 편포이다. χ²값은 음수가 될 수 없고, F분포는 자유도 2개를 가진다."}, {"no": "17-22", "year": 2018, "qno": 22, "text": "회귀식 Y′ = b₀ + b₁X₁ + b₂X₂ + b₃(X₁ − X̄₁)(X₂ − X̄₂)에 관한 설명으로 옳은 것을 모두 고른 것은? (단, X̄₁: X₁의 평균, X̄₂: X₂의 평균)\nㄱ. X₁ 또는 X₂가 이분(dichotomous)변수이면 중다회귀분석으로는 조절효과 분석이 불가능하다.\nㄴ. b₁과 b₂가 모두 통계적으로 유의미하지 않으면 b₃도 통계적으로 유의미하지 않게 된다.\nㄷ. b₁ > 0, b₂ < 0, b₃ < 0이면 Y에 대한 X₁의 긍정적인 효과는 X₂가 클수록 더 작아진다는 것을 의미한다.", "options": ["① ㄴ", "② ㄷ", "③ ㄱ, ㄴ", "④ ㄱ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ"], "answer": 1, "expl": "b₃<0이면 X₂가 클수록 X₁의 정적 효과가 줄어든다(ㄷ). 이분변수도 조절효과 분석이 가능하고(ㄱ), 상호작용항의 유의성은 주효과와 별개다(ㄴ)."}, {"no": "17-23", "year": 2018, "qno": 23, "text": "연구자가 연구 참여에 대한 동의를 받는 과정에서 연구 참여자에게 사전 동의를 구해야 하는 것으로 적합하지 않은 것은?", "options": ["① 연구의 목적, 예상되는 기간 및 절차", "② 연구에 참여하거나 중간에 그만둘 수 있는 권리", "③ 비밀 보장의 한계", "④ 참여에 대한 보상", "⑤ 연구가설 검증을 위한 구체적인 통계 분석방법"], "answer": 4, "expl": "구체적인 통계 분석방법은 참여자 동의서에 고지해야 할 사항이 아니다."}, {"no": "17-24", "year": 2018, "qno": 24, "text": "변수 X와 Y 간의 공분산 및 피어슨 적률상관계수에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. X의 분산이 0이면 X와 Y 간의 공분산은 항상 0이다.\nㄴ. X와 Y 간의 피어슨 적률상관계수가 0.5이면, X는 Y의 분산 중 25%를 설명할 수 있다.\nㄷ. X와 Y를 백분위로 변환하더라도 변환된 두 변수 간의 피어슨 적률상관계수는 변하지 않는다.", "options": ["① ㄱ", "② ㄷ", "③ ㄱ, ㄴ", "④ ㄴ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ"], "answer": 2, "expl": "X의 분산이 0이면 공분산은 0이고(ㄱ), r=.5이면 r²=.25로 25%를 설명한다(ㄴ). 백분위 변환은 비선형 변환이라 피어슨 상관이 달라질 수 있다(ㄷ)."}, {"no": "17-25", "year": 2018, "qno": 25, "text": "자살생각 예방프로그램이 자살생각에 효과가 있는지 검증하기 위해 10명의 내담자를 무선표집하여 이들을 대상으로 프로그램 실시 이전, 중간, 마무리의 세 시점에서 자살생각을 반복 측정하였다. 효과 검증에 활용할 수 있는 가장 적합한 비모수 통계방법은?", "options": ["① Mann-Whitney U 검정", "② Friedman 검정", "③ Wilcoxon 검정", "④ Kruskal-Wallis 검정", "⑤ 반복측정 분산분석"], "answer": 1, "expl": "한 집단을 세 시점 이상 반복 측정한 자료의 비모수 검정은 Friedman 검정이다."}, {"no": "16-1", "year": 2017, "qno": 1, "text": "비확률적 표집 방법에 해당하는 것은?", "options": ["① 할당(quota) 표집", "② 군집(cluster) 표집", "③ 층화(stratified) 표집", "④ 체계적(systematic) 표집", "⑤ 단순무작위(simple-random) 표집"], "answer": 0, "expl": "할당표집은 비확률표집이고, 군집·층화·체계적·단순무작위표집은 확률표집이다."}, {"no": "16-2", "year": 2017, "qno": 2, "text": "근거이론에 관한 설명으로 옳은 것은?", "options": ["① 연역적으로 이론을 구성하는 연구방법이다.", "② 개방코딩 단계에서는 패러다임 모형을 구축한다.", "③ 축코딩 단계에서는 하위범주들을 범주와 연결시킨다.", "④ 개방코딩, 선택코딩, 축코딩의 순서로 자료를 분석한다.", "⑤ 선택코딩 단계에서는 범주를 발견하고 이름을 붙이는 작업을 한다."], "answer": 2, "expl": "축코딩에서는 하위범주를 범주와 연결한다. 근거이론은 귀납적이고, 개방 → 축 → 선택코딩 순서이며, 패러다임 모형은 축코딩, 범주 명명은 개방코딩 단계이다."}, {"no": "16-3", "year": 2017, "qno": 3, "text": "일반적인 주장이나 기존 이론에 근거하여 새로운 가설을 세우고 이를 실증적으로 검증하는 방법은?", "options": ["① 귀납법", "② 연역법", "③ 사례연구법", "④ 내용분석법", "⑤ 문헌분석법"], "answer": 1, "expl": "기존 이론에서 가설을 세워 실증적으로 검증하는 방법은 연역법이다."}, {"no": "16-4", "year": 2017, "qno": 4, "text": "다음 내용에서 ( ㄱ )과 ( ㄴ )이 옳게 연결된 것은?\n박사과정생인 A는 심리검사를 개발하고자 측정 전문가에게 자문을 받았다. 측정 전문가는 이 심리검사 점수를 통해 피검사자의 현재 혹은 미래의 특정 행동의 수행 수준과 정도를 파악할 수 있어야 한다고 했다. 따라서 ( ㄱ ) 타당도가 무엇보다 중요하게 고려되어 검사 개발 시 반영되어야 한다고 하였다. 심리검사 개발에 오랜 시간을 투자할 수 없었던 A는 ( ㄱ ) 타당도 중 ( ㄴ ) 타당도를 분석의 틀로 사용하여 타당도계수를 산출하여 보고하였다.", "options": ["① ㄱ: 준거관련, ㄴ: 공인", "② ㄱ: 공인, ㄴ: 행동", "③ ㄱ: 행동, ㄴ: 내용", "④ ㄱ: 내용, ㄴ: 구인", "⑤ ㄱ: 구인, ㄴ: 준거관련"], "answer": 0, "expl": "현재나 미래의 행동 수행을 파악하는 것은 준거관련타당도이고, 오랜 시간을 들일 수 없어 같은 시점의 준거를 쓰는 것은 공인타당도이다."}, {"no": "16-5", "year": 2017, "qno": 5, "text": "상담 접근방법과 상담 회기 수에 따라 우울증 내담자 대상 집단상담 효과의 차이를 알아보기 위해서 연구자는 상담접근방법을 인지행동과 정신분석 접근법으로 구분하였다. 그리고 각 접근법마다 집단상담 회기 수를 5회기, 10회기, 15회기로 구분하고 각 실험조건 하에 연구 참여자들을 무선할당하여 집단상담 효과의 차이를 비교하였다. 이 연구자가 사용한 연구설계는?", "options": ["① 무선화 구획설계", "② 무선화 반복설계", "③ 완전무선화 요인설계", "④ 무선화 분할구획 요인설계", "⑤ 통제집단 사전사후검사설계"], "answer": 2, "expl": "두 요인(접근법 2수준×회기 3수준)의 모든 조합에 참여자를 무선할당했으므로 완전무선화 요인설계이다."}, {"no": "16-6", "year": 2017, "qno": 6, "text": "연구자는 측정도구의 내적일관성(internal consistency) 신뢰도에 영향을 미치는 요인을 미리 파악한 후 그 요인을 고려하여 연구에 필요한 측정도구를 선정하고자 한다. 다음 중 연구자가 고려해야 할 요인이 아닌 것은?", "options": ["① 문항의 수", "② 검사의 시간", "③ 집단의 동질성", "④ 문항의 변별도", "⑤ 문항의 자유도"], "answer": 4, "expl": "내적일관성 신뢰도에는 문항 수, 검사 시간, 집단의 동질성, 문항 변별도가 영향을 준다. '문항의 자유도'는 해당하지 않는다."}, {"no": "16-7", "year": 2017, "qno": 7, "text": "실험연구의 특징으로 옳은 것은?", "options": ["① 인과관계 파악이 용이하다.", "② 가외변수의 통제가 어렵다.", "③ 종속변수의 조작이 용이하다.", "④ 현장조사연구에 비해 연구결과의 일반화가 용이하다.", "⑤ 변수의 조작적 정의를 정확하게 내리기 쉽지 않다."], "answer": 0, "expl": "실험연구는 독립변수를 조작하고 가외변수를 통제하므로 인과관계 파악이 쉽다."}, {"no": "16-8", "year": 2017, "qno": 8, "text": "다음 중 양적연구 패러다임에 해당하는 내용은?", "options": ["① 연구결과의 제한된 일반화", "② 연구자와 연구대상이 서로 밀접한 관계 유지", "③ 특정 현상에 대한 해석이나 의미의 차이 이해", "④ 결과에 대해 시간적으로 선행하거나 동시에 일어나는 원인이 실재한다는 가정", "⑤ 객관적 실재로 일반화시킬 수 있는 인간의 속성은 없다는 가정"], "answer": 3, "expl": "원인이 결과에 시간적으로 앞서거나 동시에 실재한다는 인과 가정은 양적연구 패러다임이다. 나머지는 질적연구의 특징이다."}, {"no": "16-9", "year": 2017, "qno": 9, "text": "미국심리학회(APA) 최신 양식에 따라 학술지(journal)를 연구논문의 참고문헌목록에 기재할 때 반드시 포함되어야 할 내용을 모두 고른 것은?\nㄱ. 출판연도 ㄴ. 저자명 ㄷ. 학술지명 ㄹ. 논문제목 ㅁ. 출판사", "options": ["① ㄱ, ㄷ, ㅁ", "② ㄴ, ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄷ, ㄹ", "④ ㄴ, ㄷ, ㄹ, ㅁ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"], "answer": 2, "expl": "APA 양식의 학술지 논문 참고문헌에는 저자명, 출판연도, 논문제목, 학술지명이 반드시 들어간다. 출판사는 필요 없다."}, {"no": "16-10", "year": 2017, "qno": 10, "text": "500점 만점의 적성검사에서 평균이 300이고 표준편차가 50일 때 A가 350점을 얻었다면 A의 T점수는? (단, T점수는 평균이 50이고 표준편차는 10으로 하는 표준점수임)", "options": ["① 45", "② 50", "③ 55", "④ 60", "⑤ 65"], "answer": 3, "expl": "Z = (350-300)/50 = 1이고, T = 50 + 10×1 = 60이다."}, {"no": "16-11", "year": 2017, "qno": 11, "text": "구조방정식모형의 장점이 아닌 것은?", "options": ["① 측정의 오차를 통제할 수 있다.", "② 적합도 지수들을 사용하여 이론적 모형에 대한 통계적 평가가 가능하다.", "③ 여러 개의 독립변수, 매개변수, 종속변수간의 관계를 동시에 분석할 수 있다.", "④ 잠재변수를 사용하므로 측정변수로만 산출된 값에 비해 비교적 정확한 추정치를 얻을 수 있다.", "⑤ 외생잠재변수와 내생잠재변수간의 관계를 분석하므로 측정에서 발생하는 설명오차를 통제할 수 있다."], "answer": 4, "expl": "구조방정식은 측정오차를 통제하는 것이 장점이지 '설명오차를 통제한다'는 것은 장점으로 볼 수 없다."}, {"no": "16-12", "year": 2017, "qno": 12, "text": "다음 중 표절이 아닌 것은?", "options": ["① 타인의 아이디어를 출처를 밝히지 않고 마치 자신의 것처럼 활용하는 경우", "② 타인의 저작물을 인용부호(“ ”)를 사용하여 완벽하게 똑같이 직접 인용하고 출처를 밝히는 경우", "③ 타인의 저작물을 여러 곳에 많이 인용하면서도 그 중 일부에만 출처를 표시한 경우", "④ 연구자 자신이 직접 작성한 이전 저작물을 출처 표시 없이 후속연구에 인용하는 경우", "⑤ 국내의 다른 저자에 의해 이미 1차 인용된 내용을 활용하면서 재인용 표시를 하지 않고 원전만을 인용한 것으로 표시한 경우"], "answer": 1, "expl": "인용부호를 쓰고 출처를 밝혀 직접 인용하는 것은 정당한 인용으로 표절이 아니다."}, {"no": "16-13", "year": 2017, "qno": 13, "text": "판별분석을 위한 조건과 가정에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 이상점(outlier)이 없어야 한다.\nㄴ. 독립변수들이 상호 독립적이어야 한다.\nㄷ. 각 독립변수가 정규분포를 가정하여야 한다.\nㄹ. 독립변수와 종속변수가 서열 혹은 연속변수여야 한다.", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄱ, ㄴ, ㄷ", "④ ㄱ, ㄷ, ㄹ", "⑤ ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "판별분석은 이상점이 없고, 독립변수가 상호 독립적이며 정규분포를 가정한다. 종속변수는 범주형이어야 하므로 ㄹ은 틀리다."}, {"no": "16-14", "year": 2017, "qno": 14, "text": "상담연구 수행 시 고지된 동의(informed consent)에 반드시 포함해야 하는 사항을 모두 고른 것은?\nㄱ. 연구의 설계와 분석방법 ㄴ. 연구의 참여로 인한 보상\nㄷ. 연구의 기간과 절차 ㄹ. 연구의 비밀보장의 한계\nㅁ. 연구 참여 혹은 중단할 수 있는 권리", "options": ["① ㄱ, ㄴ, ㄷ", "② ㄴ, ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄷ, ㄹ", "④ ㄴ, ㄷ, ㄹ, ㅁ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"], "answer": 3, "expl": "고지된 동의에는 보상, 기간과 절차, 비밀보장의 한계, 참여·중단의 권리가 들어간다. 구체적인 설계와 분석방법은 반드시 포함할 사항이 아니다."}, {"no": "16-15", "year": 2017, "qno": 15, "text": "다음의 적합도 지수 중 표본크기에 가장 민감한 지수는?", "options": ["① Tucker-Lewis Index", "② Normed Fit Index", "③ Non-Normed Fit Index", "④ Comparative Fit Index", "⑤ Root Mean Square Error of Approximation"], "answer": 1, "expl": "NFI(Normed Fit Index)는 표본크기에 가장 민감한 적합도 지수이다."}, {"no": "16-16", "year": 2017, "qno": 16, "text": "연구논문 작성에 관한 설명으로 옳은 것은?", "options": ["① 서론에는 가설검증 결과를 기술한다.", "② 연구문제에는 표집절차에 대해 설명한다.", "③ 서론에서 선행연구를 인용할 때는 출처를 생략한다.", "④ 연구방법에는 측정도구의 신뢰도에 대해 기술한다.", "⑤ 연구결과에는 연구의 함의 및 제한점을 기술한다."], "answer": 3, "expl": "연구방법에는 측정도구와 그 신뢰도를 기술한다."}, {"no": "16-17", "year": 2017, "qno": 17, "text": "평균의 표준오차(standard error of the mean)에 관한 설명으로 옳은 것은?", "options": ["① 모집단을 대표하는 표본의 분포", "② 표본평균과 모집단 평균의 차이", "③ 오차점수 평균들의 표준편차", "④ 표본분포 평균들의 표준편차", "⑤ 각 데이터와 평균과의 차이"], "answer": 3, "expl": "평균의 표준오차는 표본평균들의 표집분포의 표준편차이다."}, {"no": "16-18", "year": 2017, "qno": 18, "text": "부모의 양육태도가 자녀의 정서조절능력 발달에 미치는 영향을 알아보기 위해 초등학교 5학년 100명, 중학교 1학년 100명을 무선표집하여 연간 두 차례 추적조사를 하였다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 단기종단연구라고도 한다.\nㄴ. 횡단-연속적 연구방법을 의미한다.\nㄷ. 연구대상이 손실될 경우 연구결과의 타당성에 대한 문제가 제기된다.\nㄹ. 자료의 수집 기간은 종단적 성격을 지니지만 횡단적으로 자료를 수집한 것이다.", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄷ", "③ ㄴ, ㄷ", "④ ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄹ"], "answer": 1, "expl": "짧은 기간의 추적조사이므로 단기종단연구이고(ㄱ), 대상 손실은 타당성 문제를 일으킨다(ㄷ)."}, {"no": "16-19", "year": 2017, "qno": 19, "text": "표본의 크기에 관한 설명으로 옳지 않은 것은?", "options": ["① 모집단이 동질적일수록 표본 크기는 작아도 된다.", "② 동일한 조건에서 표본의 크기가 클수록 통계적 검증력은 증가한다.", "③ 사례수가 작으면 표준오차가 커지므로 작은 크기의 효과를 탐지할 수 있다.", "④ 측정도구의 신뢰도가 낮을 경우 대규모 표본을 이용하는 것이 효과적이다.", "⑤ 중도탈락률이 높을 것으로 예상되는 경우 대규모 표본을 이용하는 것이 효과적이다."], "answer": 2, "expl": "사례수가 작으면 표준오차가 커져 작은 효과를 탐지하기 어렵다."}, {"no": "16-20", "year": 2017, "qno": 20, "text": "A는 상담 작업동맹을 연구하기 위해 상담자와 내담자가 각각 작성하는 자기보고식 척도를 제작하였다. 이 연구가 타당하게 진행되기 위해 고려할 점으로 옳은 것은?", "options": ["① 내용타당도를 알아보기 위해 요인분석을 실시한다.", "② 예측타당도를 알아보기 위해 상담 작업동맹의 하위요인을 규명한다.", "③ 내적일관성 신뢰도를 알아보기 위해 상담자와 내담자의 작업동맹 간 상관계수를 산출한다.", "④ 재검사 신뢰도를 알아보기 위해 Cronbach's alpha 계수를 산출한다.", "⑤ 수렴 및 변별타당도를 알아보기 위해 중다특성-중다방법을 사용한다."], "answer": 4, "expl": "상담자·내담자 보고처럼 여러 특성과 방법이 있을 때 중다특성-중다방법으로 수렴·변별타당도를 확인한다."}, {"no": "16-21", "year": 2017, "qno": 21, "text": "A는 부모교육 프로그램의 효과성을 알아보기 위해 최근 10년간 국내에서 발표된 부모교육 프로그램 효과성 논문 100편을 분석하려고 한다. 연구 진행 시 고려할 점으로 옳은 것은?", "options": ["① 출판편향(publication bias)은 1종 오류를 증가시킨다.", "② 피험자 한 명당 1의 자유도를 부여한다.", "③ 연구설계가 빈약한 논문은 분석에 포함시키지 않는다.", "④ 책상서랍(file drawer)의 문제를 해결하기 위해 동질성 통계량을 확인한다.", "⑤ 효과크기가 동질적이라면 무선효과(random effect) 모형을 적용한다."], "answer": 0, "expl": "유의한 결과만 출판되는 출판편향은 효과를 과대추정해 1종 오류를 늘린다."}, {"no": "16-22", "year": 2017, "qno": 22, "text": "다음 결과를 논문에 제시할 때 옳은 것은?\n분산원 | 제곱합(SS) | 자유도(df) | 평균제곱(MS) | p\n집단간 | 222 | 2 | 111.00 | .02\n집단내 | 86 | 6 | 14.33 |\n전체 | 308 | 8 | |", "options": ["① 두 집단 간 유의한 차이가 없다(F(2, 8) = 7.75, p = .02).", "② 세 집단 간 유의한 차이가 없다(F(2, 6) = 14.33, p = .02).", "③ 두 집단 간 유의한 차이가 있다(F(2, 6) = 7.75, p < .05).", "④ 세 집단 간 유의한 차이가 있다(F(2, 8) = 14.33, p < .05).", "⑤ 세 집단 간 유의한 차이가 있다(F(2, 6) = 7.75, p < .05)."], "answer": 4, "expl": "집단간 자유도 2이므로 세 집단이고, F = 111.00/14.33 = 7.75, 자유도 (2, 6), p = .02 < .05로 유의한 차이가 있다."}, {"no": "16-23", "year": 2017, "qno": 23, "text": "다음은 김교사와 이교사가 학생 30명의 수행평가 결과를 각각 상, 중, 하로 평정한 결과이다. 이에 관한 설명으로 옳은 것은?\n(행: 이교사 / 열: 김교사 상·중·하 / 소계)\n이교사 상: 10, 2, 0 / 소계 12\n이교사 중: 2, 8, 0 / 소계 10\n이교사 하: 0, 2, 6 / 소계 8\n소계: 12, 12, 6 / 전체 30", "options": ["① 상-상 셀의 기대빈도는 4.8이다.", "② 중-중 셀의 기대빈도는 4.2이다.", "③ 하-하 셀의 기대빈도는 3이다.", "④ 채점자간 일치율은 0.98이다.", "⑤ Kappa 계수는 약 0.347이다."], "answer": 0, "expl": "상-상 셀 기대빈도 = (12×12)/30 = 4.8이다."}, {"no": "16-24", "year": 2017, "qno": 24, "text": "다음 중 옳은 것을 모두 고른 것은?\nㄱ. r = -.75와 r = +.25 중 +.25가 더 강한 상관이다.\nㄴ. Pearson의 r과 Spearman의 ρ는 결과 해석을 동일하게 한다.\nㄷ. 비직선적 관계를 알아보고자 할 때는 상관비(η)를 산출한다.\nㄹ. 스마트폰 중독 여부와 사회성 간 상관은 사분상관계수로 산출한다.\nㅁ. 서열의 분포가 점수의 분포보다 훨씬 큰 경우 Spearman의 ρ를 산출하는 것이 바람직하다.", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄱ, ㄷ, ㄹ", "④ ㄴ, ㄹ, ㅁ", "⑤ ㄷ, ㄹ, ㅁ"], "answer": 1, "expl": "공식 정답은 ②(ㄴ, ㄷ)이다. 비선형 관계에는 상관비(η)를 쓴다(ㄷ). 상관의 강도는 절댓값으로 비교하므로 -.75가 더 강하다(ㄱ)."}, {"no": "16-25", "year": 2017, "qno": 25, "text": "A는 자신이 운영하는 집단상담 프로그램이 청소년의 인터넷 중독에 미치는 영향에 대해 알아보고자 실험집단과 통제집단을 모집하였다. 그런데 선행연구를 통해 부모자녀 관계가 인터넷 중독에 영향을 미친다는 것을 알게 되었다. 이 연구를 진행할 때 고려할 점으로 옳지 않은 것은?", "options": ["① 통제집단 사전사후검사설계를 사용한다.", "② 통계방법은 공분산 분석(ANCOVA)을 사용한다.", "③ 가변수(dummy variable)는 2개를 생성한다.", "④ 부모자녀 관계의 영향력을 통제함으로써 내적 타당도를 높일 수 있다.", "⑤ 연구참여자를 실험집단과 통제집단에 무선적으로 할당한다."], "answer": 2, "expl": "실험집단·통제집단 두 집단이면 가변수는 1개만 필요하다."}, {"no": "15-1", "year": 2016, "qno": 1, "text": "연구변인을 조작적으로 정의하는 이유로 볼 수 없는 것은?", "options": ["① 조사연구의 타당한 측정도구를 만들기 위해", "② 실험연구의 내적타당도를 높이기 위해", "③ 선행연구와의 차별성을 높이기 위해", "④ 후속연구의 발전가능성을 높이기 위해", "⑤ 연구참여자 간의 명확한 의사소통을 위해"], "answer": 2, "expl": "조작적 정의는 측정·소통·내적타당도·후속연구를 위해 필요하며, 선행연구와 차별화하려는 목적은 아니다."}, {"no": "15-2", "year": 2016, "qno": 2, "text": "두 상담방법을 비교하기 위해 두 집단을 대상으로 상이한 방법으로 상담을 실시하고, 상담효과를 세 차례 측정했을 때 사용가능한 ‘혼합 설계’에 관한 설명으로 옳은 것은?", "options": ["① 내담자들은 상담방법에 내재된 상태로서, 두 상담방법 모두를 경험한다.", "② 세 번의 측정결과들은 서로 무관하지 않기 때문에 종속된 상태로 간주된다.", "③ 피험자 집단은 측정수준에 교차되기 때문에 이들의 상호작용효과를 알 수는 없다.", "④ 피험자 간 효과와 피험자 내 효과를 계산할 때 오차항이 다르지 않다.", "⑤ 한 집단에 10명의 내담자만 있어도 된다면 이 연구에 필요한 내담자 수는 60명이다."], "answer": 1, "expl": "혼합설계에서 같은 대상을 세 번 측정한 결과는 서로 독립이 아니라 종속된 반복측정 자료로 간주한다."}, {"no": "15-3", "year": 2016, "qno": 3, "text": "상담연구가 필요한 상황을 모두 고른 것은?\nㄱ. 상담기법 효과에 대한 상충된 연구결과들이 많다.\nㄴ. 현행 주요 상담기법이 최근 연구동향과 동떨어져 있다.\nㄷ. 새롭게 고안한 상담기법의 효과를 확인하고 전파하고자 한다.\nㄹ. 상담이론과 일치하지 않는 상담효과 연구들이 자주 보고되고 있다.", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄱ, ㄴ, ㄷ", "④ ㄱ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 4, "expl": "상충되는 결과, 최신 동향과의 괴리, 새 기법 검증, 이론과 불일치하는 결과 모두 상담연구가 필요한 상황이다."}, {"no": "15-4", "year": 2016, "qno": 4, "text": "정규분포를 가정하며 평균 100, 표준편차 15, 신뢰도 0.84인 척도에 관한 설명으로 옳지 않은 것은?", "options": ["① 측정의 표준오차는 6이다.", "② 이 척도에서 100점을 얻은 사람의 진점수가 대략 94～106점 사이에 있을 가능성이 95%이다.", "③ 관찰점수 분산에 대한 오차점수의 분산비율은 0.16이다.", "④ 이 척도의 규준집단에서 약 95%는 70～130점을 받았다고 볼 수 있다.", "⑤ 관찰점수 분산에 대한 진점수의 분산비율은 0.84이다."], "answer": 1, "expl": "측정의 표준오차는 15×√(1-0.84)=6이며, 100±6 범위는 약 68% 신뢰구간이다. 95%가 되려면 약 ±12가 필요하다."}, {"no": "15-5", "year": 2016, "qno": 5, "text": "‘상담방법에 따른 내담자의 사회성 발달의 차이’를 연구하는데, 상담의 효과가 사회성에 직접적으로 나타나기보다는 자아개념을 통해 구현되고 상담방법의 효과는 성별과 상호작용을 일으킬 것으로 가정했으며, 내담자의 사회심리적 배경의 차이는 배제하고 싶을 때, 다음 중 적절히 규정되지 못한 변인은?", "options": ["① 상담방법: 결과변인", "② 사회성: 종속변인", "③ 자아개념: 매개변인", "④ 성: 조절변인", "⑤ 사회심리적 배경: 통제변인"], "answer": 0, "expl": "상담방법은 원인이 되는 독립(처치)변인이다. 결과변인으로 규정한 것은 잘못이다."}, {"no": "15-6", "year": 2016, "qno": 6, "text": "다음 중 연구 패러다임이 다른 하나는?", "options": ["① 사회적 실재는 객관적으로 존재한다고 가정한다.", "② 기계론적 인과론을 갖고 있다.", "③ 행위 또는 관찰가능한 현상을 주로 연구한다.", "④ 해석학 또는 현상학적 인식론의 입장에서 인간을 연구한다.", "⑤ 모집단 전체 또는 모집단을 대표하는 표본집단을 대상으로 연구한다."], "answer": 3, "expl": "해석학·현상학적 인식론은 질적연구 패러다임이고, 나머지는 양적연구 패러다임이다."}, {"no": "15-7", "year": 2016, "qno": 7, "text": "10명의 학생을 대상으로 3명의 교사가 7점 서열척도로 학생의 지도성을 평정한 결과, 세 측정값의 차이를 검정하는데 가장 적합한 것은?", "options": ["① 윌콕슨(Wilcoxon) 검정", "② 프리드만(Friedman) 이원분산분석", "③ 크루스칼-발리스(Kruskal-Wallis) 일원분산분석", "④ 맨-휘트니(Mann-Whitney) 검정", "⑤ 콜모고로프-스미르노프(Kolmogorov-Smirnov) 검정"], "answer": 1, "expl": "같은 학생들을 세 교사가 서열척도로 평정한 반복측정(관련 표본) 자료는 Friedman 이원분산분석으로 검정한다."}, {"no": "15-8", "year": 2016, "qno": 8, "text": "척도 A(평균 10.0, 표준편차 3.0)의 예측타당도를 추정하기 위해 준거척도 A′(평균 3.0, 표준편차 1.0)와의 상관을 계산한 결과 r_AA′ = 0.6으로 나타났다. 이에 관한 설명으로 옳은 것은?", "options": ["① 척도 A에서 타당하지 못한 점수의 분산비율은 0.4이다.", "② 척도 A에서 준거척도 A′와 공유하는 점수의 분산은 9.0이다.", "③ 척도 A에서 준거척도 A′와 공유하지 않는 점수의 분산은 0.6이다.", "④ 척도 A에서 준거척도 A′와 공유하는 점수의 분산비율은 0.36이다.", "⑤ 척도 A의 점수로 준거척도 A′의 점수를 예언할 때, 예언된 점수와 실제점수 간 차이의 표준편차는 1.0이다."], "answer": 3, "expl": "r=0.6이면 r²=0.36으로 준거와 공유하는 분산비율은 0.36이다."}, {"no": "15-9", "year": 2016, "qno": 9, "text": "‘자기존중감’과 ‘회복탄력성’이 서로 구분되는 독특한 구인인지 알아보기 위해 활용한 분석법으로 옳은 것은?", "options": ["① 종속변수와의 단순상관이 높은 변수를 먼저 투입하는 방식으로 회귀분석을 실시한다.", "② 두 변수의 분산이 동일하다고 볼 수 있는지를 카이자승으로 검정한다.", "③ 종속변수에 대한 두 변수의 주효과가 유의한지를 분산분석으로 검정한다.", "④ 두 변수를 모두 투입했을 때 나타나는 설명량 R² 값이 유의한지를 표준 회귀분석으로 검정한다.", "⑤ 두 번째 변수를 투입한 후 나타난 설명량의 증가(ΔR²)가 통계적으로 유의한지를 위계적 회귀분석으로 검정한다."], "answer": 4, "expl": "한 변수를 넣은 뒤 다른 변수를 추가했을 때 설명량 증가(ΔR²)가 유의한지를 위계적 회귀분석으로 보면 두 구인의 독특성을 확인할 수 있다."}, {"no": "15-10", "year": 2016, "qno": 10, "text": "네 개의 연구 가설(H1, H2, H3, H4)을 검정한 결과 두 개의 가설(H3, H4)만 지지되었는데, 지지된 두 가설과 함께 새로운 가설들(H5, H6)을 다시 검정한 결과 H4만 지지되었을 때, 연구자가 내릴 수 있는 타당한 결론은?", "options": ["① 가설 H1이 H2보다 더 타당하다.", "② 가설 H1이 H6보다 더 타당하다.", "③ 가설 H2가 H6보다 더 타당하다.", "④ 가설 H4가 H5보다 더 타당하다.", "⑤ 가설 H5가 H6보다 더 타당하다."], "answer": 3, "expl": "두 번째 검정에서 H4는 지지되고 H5는 지지되지 않았으므로 H4가 H5보다 더 타당하다."}, {"no": "15-11", "year": 2016, "qno": 11, "text": "집단 간 설계에 비해 집단 내 설계가 갖는 장점을 모두 고른 것은?\nㄱ. 피험자 특성의 차이에 따른 영향이 적다.\nㄴ. 상대적으로 적은 피험자로도 연구가 가능하다.\nㄷ. 반복 측정으로 인한 이월효과를 쉽게 통제할 수 있다.\nㄹ. 상호작용효과를 검정할 수 있다.", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄷ, ㄹ", "④ ㄱ, ㄴ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 0, "expl": "집단 내 설계는 같은 피험자가 모든 조건을 거치므로 피험자 특성 차이의 영향이 적고(ㄱ), 적은 인원으로도 연구할 수 있다(ㄴ). 반복 측정에 따른 이월효과는 오히려 약점이며(ㄷ), 상호작용효과 검정은 집단 간 설계에서도 가능해 집단 내 설계만의 장점이 아니다(ㄹ)."}, {"no": "15-12", "year": 2016, "qno": 12, "text": "실험연구의 내적타당도를 높이기 위해 사용 가능한 외래변수의 통제방법들을 모두 고른 것은?\nㄱ. 연구대상의 무선 배정(random assignment)\nㄴ. 외래변수의 상수화\nㄷ. 독립변수로 연구설계에 포함시킴\nㄹ. 연구대상의 짝짓기(matched sampling)", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄷ", "③ ㄴ, ㄷ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 4, "expl": "무선배정, 상수화, 독립변수로 포함, 짝짓기 모두 외래변수 통제방법이다."}, {"no": "15-13", "year": 2016, "qno": 13, "text": "학생의 ‘와해된 행동량’과 교사의 ‘실패 예측’ 간에 0.8 정도의 단순상관이 계산되었지만, 또 다른 변수인 ‘학급 능력 수준’과 두 변수 간의 단순상관들이 각각 -0.6 정도를 보였다면, 예상되는 두 변수(‘와해된 행동량’과 ‘실패 예측’) 간의 편상관(partial correlation)은?", "options": ["① 완벽한 정적상관", "② 완벽한 부적상관", "③ 단순상관 0.8보다 높지 않은 정적상관", "④ 단순상관 0.8보다 높은 정적상관", "⑤ 단순상관 0.8보다 높은 부적상관"], "answer": 2, "expl": "제3변수와 두 변수가 모두 상관되어 있으므로 이를 통제한 편상관은 (0.8-0.36)/0.64≈0.69로 단순상관보다 낮은 정적상관이다."}, {"no": "15-14", "year": 2016, "qno": 14, "text": "연구보고서 작성에 관한 설명으로 옳지 않은 것은?", "options": ["① 서론은 이론에서 연구문제를 도출하는 귀납적 방식으로 기술한다.", "② 연구가설은 탐색적 질문과 검정을 위한 질문으로 구성할 수 있다.", "③ 선행연구 결과를 인용할 경우 반드시 출처를 밝혀야 한다.", "④ 연구결과는 논문의 구성내용 중 가장 객관적이어야 한다.", "⑤ 결론 및 논의에는 자신이 수행한 연구결과의 요약이 포함된다."], "answer": 0, "expl": "서론은 이론에서 연구문제를 도출하는 연역적 방식으로 기술한다."}, {"no": "15-15", "year": 2016, "qno": 15, "text": "진실험설계와 비교하여 준실험설계가 갖는 특성을 모두 고른 것은?\nㄱ. 실제 상황에 적용하기 쉽다.\nㄴ. 내적타당도가 낮다.\nㄷ. 피험자를 무선할당할 수 있다.\nㄹ. 종속변인에 미치는 독립변인의 실질적인 효과를 확인할 수 있다.", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄱ, ㄴ, ㄷ", "④ ㄱ, ㄴ, ㄹ", "⑤ ㄴ, ㄷ, ㄹ"], "answer": 0, "expl": "준실험설계는 실제 상황에 적용하기 쉽지만(ㄱ) 무선할당이 없어 내적타당도가 낮다(ㄴ)."}, {"no": "15-16", "year": 2016, "qno": 16, "text": "연구주제와 연구방법 및 분석방법의 관계가 적절하지 않은 것은?", "options": ["① 심리치료 효과 검증 - 단일사례연구", "② 내담자의 변화를 이끄는 상담변인의 원인 규명 - 상관연구", "③ 특정 상담 주제에 대한 성과 연구 - 메타분석연구", "④ 상담효과 연구 - 실험연구", "⑤ 희귀 사례의 특성 연구 - 질적연구"], "answer": 1, "expl": "상관연구로는 원인을 규명할 수 없으므로 원인 규명과 상관연구의 연결은 적절하지 않다."}, {"no": "15-17", "year": 2016, "qno": 17, "text": "연구의 오차 및 오염변인의 효과를 통제하는 방법으로 옳은 것은?", "options": ["① 오염변인이 질적변수일 경우 공분산분석을 실시한다.", "② 무선구획설계를 하여 오염변인의 효과를 통제한다.", "③ 피험자간 설계로 개인차를 통제한다.", "④ 다양한 피험자를 연구대상으로 선발한다.", "⑤ 실험실 연구보다 현장연구를 실시한다."], "answer": 1, "expl": "무선구획설계는 오염변인을 구획으로 묶어 그 효과를 통제한다."}, {"no": "15-18", "year": 2016, "qno": 18, "text": "다음 중 성격이 다른 표집방법은?", "options": ["① 군집표집", "② 다단계표집", "③ 체계적 표집", "④ 층화표집", "⑤ 할당표집"], "answer": 4, "expl": "할당표집은 비확률표집이고, 나머지는 확률표집이다."}, {"no": "15-19", "year": 2016, "qno": 19, "text": "‘직면이 대학생의 발표불안 감소에 미치는 효과’를 연구하기 위해 대학 홈페이지에 공지하여 모집한 10명의 참가자를 대상으로 6회기의 상담프로그램을 진행하고, 심리학개론 수강생 10명을 통제집단으로 운영하였다. 매회기 종료 후 발표불안 검사를 하였으며, 일부 참가자가 중도에 그만두어, 연구집단 6명, 통제집단 8명의 자료를 분석에 사용하였다. 이 연구에서 내적타당도를 위협하는 요인을 모두 고른 것은?\nㄱ. 선택\nㄴ. 회귀\nㄷ. 측정도구의 변화\nㄹ. 탈락\nㅁ. 검사", "options": ["① ㄱ, ㄹ", "② ㄴ, ㄷ", "③ ㄹ, ㅁ", "④ ㄱ, ㄷ, ㄹ", "⑤ ㄱ, ㄹ, ㅁ"], "answer": 4, "expl": "자발적 지원과 다른 모집 경로(선택), 중도 탈락(탈락), 매 회기 반복 검사(검사)가 내적타당도를 위협한다."}, {"no": "15-20", "year": 2016, "qno": 20, "text": "다음에 해당하는 연구설계는?\nADHD 청소년의 주의력 향상을 위한 치료효과를 확인하기 위해 주의력 결핍 행동을 세 가지 행동으로 분류하였다. 세 가지 행동의 기저선 기간을 달리한 후 처치 개입하여 행동 각각의 기저선기간과 처치기간의 차이를 비교하였다.", "options": ["① 일회적 집단설계", "② AB 설계", "③ 가역 설계", "④ 다중-기저선 설계", "⑤ 교대-처치 설계"], "answer": 3, "expl": "행동마다 기저선 기간을 달리하고 순차적으로 개입하는 설계는 다중기저선 설계이다."}, {"no": "15-21", "year": 2016, "qno": 21, "text": "다음 질적연구방법 중 접근방법이 다른 것은?", "options": ["① 연구대상은 동질적인 표본으로 구성한다.", "② 범주 구분을 위해 개방코딩을 사용한다.", "③ 현장에서 나온 자료를 토대로 이론을 개발한다.", "④ 비전형적인 사례가 주요 대상이다.", "⑤ 시각적인 도형이나 모형을 사용한다."], "answer": 3, "expl": "①②③⑤는 근거이론의 특징이고, 비전형적 사례를 주요 대상으로 하는 ④는 접근방법이 다르다."}, {"no": "15-22", "year": 2016, "qno": 22, "text": "상담방법의 효과를 확인하기 위해 3집단에게 상담을 실시한 후 효과를 분석한 결과가 다음과 같다. 효과의 크기(η²)는?\n변량원 | 제곱합 | 자유도 | 제곱평균 | F\n집단간 | 48 | 2 | 24 | 6\n집단내 | 72 | 18 | 4 |", "options": ["① 0.4", "② 0.6", "③ 0.67", "④ 0.86", "⑤ 0.9"], "answer": 0, "expl": "η² = 집단간 제곱합/전체 제곱합 = 48/(48+72) = 0.4이다."}, {"no": "15-23", "year": 2016, "qno": 23, "text": "측정의 신뢰도와 타당도에 관한 설명으로 옳지 않은 것은?", "options": ["① Cronbach's α 계수로 신뢰도를 계산한다.", "② 타당도는 ‘무엇을 측정하는가’와 관련된다.", "③ 요인분석으로 내용타당도를 확인한다.", "④ 측정도구의 문항수가 신뢰도에 영향을 준다.", "⑤ 중다특성-중다방법으로 수렴-변별 타당도를 확인한다."], "answer": 2, "expl": "요인분석은 구인타당도를 확인하는 방법이며, 내용타당도는 전문가 판단으로 확인한다."}, {"no": "15-24", "year": 2016, "qno": 24, "text": "‘인지적 가족치료가 가족구성원의 의사소통에 미치는 효과’를 연구하기 위해 총 10가족에게 6회기 가족상담을 진행하고, 매회기 내담자들의 의사소통 패턴을 측정하였다. 이 연구에 가장 적절한 분석방법은?", "options": ["① 대응표본 t검정", "② 이원분산분석", "③ 단순회귀분석", "④ 반복측정 분산분석", "⑤ 공분산분석"], "answer": 3, "expl": "같은 가족을 여러 회기 반복 측정했으므로 반복측정 분산분석이 적절하다."}, {"no": "15-25", "year": 2016, "qno": 25, "text": "‘대학생의 데이트 성폭력 피해경험과 대처방식에 관한 연구’를 진행하기 위해 심리학개론을 수강하는 학생들을 대상으로 설문지를 이용한 연구를 진행하고자 할 때 옳은 것은?", "options": ["① 실험이 아닌 설문조사이므로, 기관윤리심의기구(IRB)의 동의를 얻지 않고 조사를 수행한다.", "② 동기부여를 위해 참가자에게만 추가점수를 부여한다.", "③ 연구주제를 사전 공지한 후, 참여 의사를 밝힌 학생들만을 대상으로 연구를 진행한다.", "④ 연구주제의 노출을 막기 위해 연구주제에 관한 정보를 제외하고 참가자에게 동의를 구한다.", "⑤ 대상자 선발을 위해 데이트 성폭력 피해경험 여부를 확인한 후, 해당 학생에게 연락하여 참여 동의를 구한다."], "answer": 2, "expl": "연구주제를 미리 알리고 자발적으로 참여 의사를 밝힌 학생만 대상으로 하는 것이 윤리적이다."}];

function isAns(q, i){ return Array.isArray(q.answer) ? q.answer.includes(i) : i === q.answer; }
function ansLabel(q){ return Array.isArray(q.answer) ? q.answer.map(a => a+1).join(', ') : (q.answer+1); }

function formatQText(text){
  const lines = String(text).split('\n');
  if(lines.length <= 1){
    return '<div class="qtext-line">' + text + '</div>';
  }
  const first = lines[0];
  const rest = lines.slice(1);
  let html = '<div class="qtext-line">' + first + '</div>';
  html += '<div class="stmt-box">' + rest.map(function(l){return '<div class="stmt-line">'+l+'</div>';}).join('') + '</div>';
  return html;
}

let currentYear = 'all';

let answeredMap = {};

function selectOption(qIdx, optIdx){
  if(answeredMap[qIdx] !== undefined) return;
  answeredMap[qIdx] = optIdx;
  renderQuestions();
}

function setYear(y){
  currentYear = y;
  renderPills();
  renderQuestions();
}

function renderPills(){
  const years = [...new Set(QUESTIONS.map(q => q.year))].sort((a,b) => b-a);
  const pillsEl = document.getElementById('yearPills');
  let html = `<button class="pill ${currentYear==='all'?'active':''}" onclick="setYear('all')">전체</button>`;
  years.forEach(y => {
    html += `<button class="pill ${currentYear===y?'active':''}" onclick="setYear(${y})">${y}</button>`;
  });
  pillsEl.innerHTML = html;
}

function renderQuestions(){
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  const list = currentYear === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.year === currentYear);
  list.forEach((q) => {
    const qIdx = QUESTIONS.indexOf(q);
    const picked = answeredMap[qIdx];
    const isAnswered = picked !== undefined;
    const isVoid = !Array.isArray(q.answer) && q.answer < 0;
    const isCorrect = isAnswered && !isVoid && isAns(q, picked);

    const card = document.createElement('div');
    card.className = 'card';
    let optsHtml = '';
    q.options.forEach((opt, i) => {
      let cls = 'opt-btn';
      if(isAnswered){
        if(isVoid && i === picked) cls += ' neutral-picked';
        if(!isVoid && isAns(q, i)) cls += ' correct-reveal';
        if(!isVoid && i === picked && !isAns(q, picked)) cls += ' wrong-picked';
      }
      const disabled = isAnswered ? 'disabled' : '';
      optsHtml += `<button class="${cls}" ${disabled} onclick="selectOption(${qIdx},${i})">${opt}</button>`;
    });
    const expl = q.expl ? `<div class="explain">${q.expl}</div>` : '';
    let markHtml = '';
    if(isAnswered){
      if(isVoid){
        markHtml = `<div class="feedback-mark">📌 전항 정답 처리된 문항입니다</div>`;
      } else if(isCorrect){
        markHtml = `<div class="feedback-mark">✅ 정답입니다!</div>`;
      } else {
        markHtml = `<div class="feedback-mark wrong">❌ 오답입니다. 정답은 ${ansLabel(q)}번입니다.</div>`;
      }
    }
    card.innerHTML = `
      <div class="qnum">문제${q.qno}</div>
      <div class="qtext">${formatQText(q.text)}</div>
      <div class="options">${optsHtml}</div>
      <div class="feedback${isAnswered ? ' open' : ''}">
        ${markHtml}
        ${expl}
      </div>
    `;
    area.appendChild(card);
  });
}

function render(){
  const years = [...new Set(QUESTIONS.map(q => q.year))];
  document.getElementById('metaLine').textContent =
    `${years.length}개년 · 총 ${QUESTIONS.length}문항`;
  renderPills();
  renderQuestions();
}

render();
</script>
