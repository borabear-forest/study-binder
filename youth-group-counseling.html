"② ㄴ, ㄷ", "③ ㄷ, ㄹ", "④ ㄱ, ㄴ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 3, "expl": "적극적·지시적(ㄱ), 더 나은 선택의 현실 적용(ㄴ), 질문·유머·역설 기법(ㄹ)은 현실치료 내용이다. 글래서의 기본욕구는 생존, 사랑과 소속, 힘(성취), 자유, 즐거움이며 '존중'은 포함되지 않는다."}, {"no": "18-29", "year": 2019, "exam": "2019", "qno": 4, "text": "참만남집단에 관한 설명으로 옳은 것은?\nㄱ. 개인경험에 중점을 두며, 체험집단이라고도 한다.\nㄴ. 로저스 모형에 의하면 집단은 구조적인 형태로 시작한다.\nㄷ. 집단원은 보통 환자라고 하며, 집단경험은 심리치료라고 한다.\nㄹ. 내담자의 과거나 무의식적 동기를 강조한다.", "options": ["① ㄱ", "② ㄱ, ㄴ", "③ ㄷ, ㄹ", "④ ㄱ, ㄴ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 0, "expl": "참만남 집단은 개인 경험에 중점을 둔 체험집단(ㄱ)이다. 로저스 모형은 비구조적으로 시작하고(ㄴ), 집단원을 환자로 보는 것은 치료집단이며(ㄷ), 과거·무의식 강조는 정신분석이다(ㄹ)."}, {"no": "18-30", "year": 2019, "exam": "2019", "qno": 5, "text": "행동주의 집단상담에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 긍정적 행동강화를 위해 토큰경제법을 활용한다.\nㄴ. 자기파괴적인 생각을 통제하도록 하기 위해 자기지시를 활용한다.\nㄷ. 체계적 둔감화는 긍정적 행동을 강화시킨다.\nㄹ. 현재의 행동에 대한 생애발달적 원인을 중요시하여 분석한다.", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄱ, ㄴ, ㄹ", "④ ㄱ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 0, "expl": "토큰경제(ㄱ)와 자기지시(ㄴ)는 행동주의(인지행동) 기법이다. 체계적 둔감화는 불안을 줄이는 기법이고(ㄷ), 행동주의는 생애발달적 원인보다 현재 행동과 환경 요인을 분석한다(ㄹ)."}, {"no": "18-31", "year": 2019, "exam": "2019", "qno": 6, "text": "정신분석 집단상담에 관한 설명으로 옳지 않은 것은?", "options": ["① 집단원의 문제행동과 관련된 역사적인 근거를 탐색한다.", "② 집단원의 무의식적 동기를 해석을 통해 의식화시킨다.", "③ 집단원의 고착된 의사소통 영역을 확장시킨다.", "④ 집단원의 자율성을 권장하기 위해 권유, 지적을 자제한다.", "⑤ 집단원의 즉각적인 문제해결보다는 장기간의 성격 재구성에 도움을 준다."], "answer": 3, "expl": "정신분석 집단상담자는 해석·지적·권유 등을 통해 무의식을 의식화하도록 적극 개입한다. 자율성을 위해 권유·지적을 자제한다는 ④는 맞지 않는다."}, {"no": "18-32", "year": 2019, "exam": "2019", "qno": 7, "text": "합리정서행동(REBT) 집단상담에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 정서적인 문제를 해결하기 위해서는 사고를 분석하는 데서 시작한다.\nㄴ. 감정적 반응에 대한 책임은 자신에게 있음을 깨닫도록 한다.\nㄷ. 목표설정을 위하여 집단지도자와 구성원은 협력하여야 한다.\nㄹ. 집단상담자는 집단원과의 친밀성을 중시하여 관계지향적이다.", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄷ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "사고 분석에서 출발(ㄱ), 감정 반응에 대한 자기 책임(ㄴ), 협력적 목표 설정(ㄷ)은 REBT 내용이다. REBT 상담자는 친밀성보다 교육적·지시적 태도로 논박을 이끌어 관계지향적이라는 ㄹ은 틀리다."}, {"no": "18-33", "year": 2019, "exam": "2019", "qno": 8, "text": "로저스(C. Rogers)의 인간중심 집단상담 과정에서의 경험을 모두 고른 것은?\nㄱ. 맴돌기\nㄴ. 가면 깨뜨리기\nㄷ. 피드백\nㄹ. 부정적 감정들의 표현\nㅁ. 사적인 표현 및 탐색에 대한 저항", "options": ["① ㄷ, ㄹ", "② ㄱ, ㄴ, ㄷ", "③ ㄴ, ㄹ, ㅁ", "④ ㄱ, ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"], "answer": 4, "expl": "맴돌기, 사적 표현에 대한 저항, 부정적 감정 표현, 가면 깨뜨리기, 피드백은 모두 로저스가 제시한 참만남 집단 과정에 포함된다."}, {"no": "18-34", "year": 2019, "exam": "2019", "qno": 9, "text": "아들러(A. Adler)의 개인심리 집단상담에 관한 설명으로 옳은 것은?", "options": ["① 집단원의 자기패배적 언어와 행동을 반박한다.", "② 집단원의 사회적 상황과 사회적 태도를 파악한다.", "③ 열등감의 근원 탐색이 아닌 우월성 추구를 목표로 한다.", "④ 빈 의자 기법, 혐오치료의 기법을 활용한다.", "⑤ 가족구도, 생활양식 분석의 기법을 활용하지 않는다."], "answer": 1, "expl": "아들러 집단상담은 생활양식 평가를 위해 집단원의 사회적 상황과 사회적 태도를 파악한다. ①은 REBT, ③은 열등감 탐색을 배제해 틀리고, ④ 빈 의자는 게슈탈트, 혐오치료는 행동주의이며, ⑤ 가족구도·생활양식 분석은 아들러의 핵심 기법이다."}, {"no": "18-35", "year": 2019, "exam": "2019", "qno": 10, "text": "말러(A. Mahler)의 집단상담 과정에서 집단의 과도기 단계 특징은?", "options": ["① 집단원간의 신뢰감 수준이 높은 편이다.", "② 집단참여에 적극적인 태도를 보인다.", "③ 집단원은 흔히 자신에 대한 초점을 회피하지 않는다.", "④ 집단원의 불안 수준은 낮은 편이다.", "⑤ 거기-그때(there and then)에 맞추어 이야기하는 경향이 있다."], "answer": 4, "expl": "과도기(전환)에는 불안과 방어가 높아 지금-여기의 자기 문제 대신 거기-그때(과거·외부 이야기)로 초점을 돌리는 경향이 있다. ①~④는 작업단계의 특징에 가깝다."}, {"no": "18-36", "year": 2019, "exam": "2019", "qno": 11, "text": "성적이 부진한 중학생들에게 학습능력 향상을 목적으로 체계화된 프로그램을 매주 1회 12주 진행되는 집단의 유형은?", "options": ["① 비구조화된 동질적 구성의 집중적 집단", "② 구조화된 동질적 구성의 집중적 집단", "③ 구조화된 동질적 구성의 분산적 집단", "④ 비구조화된 이질적 구성의 분산적 집단", "⑤ 구조화된 이질적 구성의 집중적 집단"], "answer": 2, "expl": "체계화된 프로그램(구조화), 성적 부진 중학생(동질적), 매주 1회 12주 진행(분산적)이므로 구조화된 동질적 구성의 분산적 집단이다."}, {"no": "18-37", "year": 2019, "exam": "2019", "qno": 12, "text": "다음과 관련 있는 집단상담의 치료적 요인은?\n- 고립감\n- 자신의 삶에 대한 책임\n- 타인으로부터 받을 수 있는 도움의 한계에 대한 자각", "options": ["① 실존적 요인", "② 일차 가족집단의 교정적 재현", "③ 희망 고취", "④ 직면", "⑤ 모험 시도"], "answer": 0, "expl": "고립감(실존적 고독), 삶에 대한 궁극적 책임, 타인의 도움에는 한계가 있다는 자각은 얄롬의 실존적 요인이다."}, {"no": "18-38", "year": 2019, "exam": "2019", "qno": 13, "text": "집단상담 초기단계에서 치료적 요소를 촉진하기 위한 방법으로 옳지 않은 것은?", "options": ["① 집단상담의 방향과 목표, 규범을 정한다.", "② 집단상담에 대한 책임이 집단원에게도 있음을 알려준다.", "③ 저항을 표출하는 집단원의 행동을 수용한다.", "④ 집단상담자의 자기개방은 적절하지 않다.", "⑤ 집단상담자가 자신의 감정을 표현하는 방법을 보여준다."], "answer": 3, "expl": "초기단계의 적절한 상담자 자기개방은 집단원에게 개방의 모델이 되어 신뢰 형성을 돕는다. 자기개방이 적절하지 않다는 ④가 틀리다."}, {"no": "18-39", "year": 2019, "exam": "2019", "qno": 14, "text": "집단상담자의 전문적 자질이 아닌 것은?", "options": ["① 집단 계획 및 운영 능력", "② 집단원으로서의 집단참여 경험", "③ 인간행동의 긍정적 변화에 대한 신념", "④ 인간발달에 대한 이해와 폭넓은 식견", "⑤ 상담이론 및 실제에 대한 지식과 이해"], "answer": 2, "expl": "인간행동의 긍정적 변화에 대한 신념은 인간적(인성적) 자질이다. 나머지는 지식·경험·운영 능력에 해당하는 전문적 자질이다."}, {"no": "18-40", "year": 2019, "exam": "2019", "qno": 15, "text": "집단상담자의 윤리적 행동으로 옳은 것을 모두 고른 것은?\nㄱ. 집단원의 개인정보를 집단전체가 공유할 수 있도록 집단에서 제공했다.\nㄴ. 집단원의 부당한 압력도 치료적 요인이므로 압력이 일어나는 분위기를 허용했다.\nㄷ. 개인적 기대가 집단 내에서 충족될 수 없을 것으로 판단되는 집단원에게 다른 상담자에게 상담을 받도록 제안했다.\nㄹ. 청소년을 집단에 의뢰한 담임교사가 상담 내용을 알고 싶어 해서 청소년의 동의를 받은 후 최소한의 정보를 제공했다.", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄷ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 1, "expl": "충족되기 어려운 기대를 가진 집단원에게 다른 전문가를 제안하는 것(ㄷ)과 동의를 받아 최소한의 정보만 제공하는 것(ㄹ)은 윤리적이다. 개인정보 공개(ㄱ)와 부당한 압력 허용(ㄴ)은 윤리 위반이다."}, {"no": "18-41", "year": 2019, "exam": "2019", "qno": 16, "text": "두 명의 상담자가 공동으로 진행하는 집단상담에 관한 설명으로 옳은 것은?", "options": ["① 집단활동 중에는 공동상담자 간의 상호작용을 자제한다.", "② 공동상담자 간의 경쟁관계는 생산적인 집단역동을 촉진한다.", "③ 공동상담자들은 집단회기 이외의 시간에 서로의 의견 차이를 논의한다.", "④ 형평성 차원에서 공동상담자들이 매 집단회기를 교대로 진행해야 한다.", "⑤ 공동상담자의 집단상담에 대한 이론적 관점이 상반될수록 집단에 도움이 된다."], "answer": 2, "expl": "공동상담자는 회기 밖에서 의견 차이를 충분히 논의해야 한다. 회기 중 상호작용 자제(①), 경쟁관계(②), 기계적 교대(④), 상반된 이론적 관점(⑤)은 바람직하지 않다."}, {"no": "18-42", "year": 2019, "exam": "2019", "qno": 17, "text": "집단규범에 관한 설명으로 옳지 않은 것은?", "options": ["① 집단에서 권장하는 행동과 같은 긍정적인 규범도 있다.", "② 개별 집단원의 권리보다 집단 전체의 이익이 더 우선되어야 한다.", "③ 집단상담자는 개입 행동을 통해 집단규범의 준거를 제시할 수 있다.", "④ 집단원들의 선입견에 의해 형성된 암묵적 규범은 집단에 부정적 영향을 미칠 수 있다.", "⑤ 집단상담자는 집단규범 형성을 촉진하기 위해 집단원들의 지금-여기에서의 자각을 독려한다."], "answer": 1, "expl": "집단규범은 집단원 개개인의 권리를 보호하는 범위 안에서 형성되어야 하며, 집단 전체의 이익을 이유로 개인의 권리를 침해할 수 없다."}, {"no": "18-43", "year": 2019, "exam": "2019", "qno": 18, "text": "집단상담자의 역할에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 집단원이 표출하는 저항을 집단역동에 도움이 되도록 활용한다.\nㄴ. 집단규범은 집단원들끼리 스스로 확립하므로 상담자의 관여를 자제한다.\nㄷ. 집단분위기 조성을 위해 집단원의 문제행동에 적극적으로 관여한다.\nㄹ. 비구조화 집단상담의 경우 상담자에게 특별한 역할이 요구되지 않는다.", "options": ["① ㄱ, ㄷ", "② ㄴ, ㄹ", "③ ㄱ, ㄴ, ㄷ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 0, "expl": "저항을 집단역동에 활용하는 것(ㄱ)과 분위기 조성을 위해 문제행동에 개입하는 것(ㄷ)은 옳다. 규범 형성에는 상담자도 관여해야 하고(ㄴ), 비구조화 집단에서도 상담자의 촉진적 역할이 필요하다(ㄹ)."}, {"no": "18-44", "year": 2019, "exam": "2019", "qno": 19, "text": "중ㆍ고등학교 장면에서 청소년 집단상담을 진행할 때 집단상담자가 고려할 사항으로 옳지 않은 것은?", "options": ["① 청소년의 자율성 증진을 위해 비구조화 집단상담이 더 효과적이다.", "② 청소년기에는 또래와의 상호작용이 중요하므로 집단 크기를 고려한다.", "③ 문화적 민감성을 토대로 청소년 하위문화를 이해하고 존중하는 태도를 보인다.", "④ 수업시간을 고려하여 집단참여가 가능한 학생들을 중심으로 집단원을 선발한다.", "⑤ 비자발적으로 의뢰된 청소년에게는 집단에 참여하지 않을 권리와 집단참여를 거부할 경우 수반되는 책임을 알려준다."], "answer": 0, "expl": "청소년은 모호한 상황에 부담을 느끼기 쉬워 일반적으로 구조화된 집단이 더 효과적이다. 비구조화 집단이 더 효과적이라는 ①이 틀리다."}, {"no": "18-45", "year": 2019, "exam": "2019", "qno": 20, "text": "다음 대화에서 집단상담자가 적용한 기술(ㄱ~ㄴ)을 순서대로 옳게 나열한 것은?\n영희: 지난 주말 친구들과 여행계획을 세웠는데, 친구들이 가자고 하는 곳과 다른 곳을 가고 싶었는데 막상 내 의견을 말하지 못했어요. 속상해요.\n집단상담자: 지난 번 진로방향을 의논할 때에도 부모님께 네 생각을 말하지 않았던 것 같은데…… 이번 행동과 지난 번 행동에서 너의 어떤 모습을 발견할 수 있을까? (ㄱ)\n영희: 음…… 친구들이 나를 이상하게 생각할까봐 내가 싫은 것을 제대로 얘기하지 못했어요. 친구들이랑 어울리지 못하면 학교에서 힘들어지거든요. 부모님께도 마찬가지였던 것 같구요. 부모님 뜻을 거스르면 안 될 것 같아서요.\n집단상담자: 자신의 생각이나 원하는 바를 솔직히 얘기하면 혹시나 주변사람들로부터 인정받지 못할까봐 두려워하고 있구나. (ㄴ)", "options": ["① 직면하기, 연결하기", "② 연결하기, 해석하기", "③ 반영하기, 자기개방하기", "④ 질문하기, 자기개방하기", "⑤ 해석하기, 직면하기"], "answer": 1, "expl": "(ㄱ)은 이번 행동과 지난번 행동을 이어 공통된 패턴을 보게 하는 연결하기, (ㄴ)은 행동 이면의 동기(인정받지 못할까 하는 두려움)를 설명해 주는 해석하기다."}, {"no": "18-46", "year": 2019, "exam": "2019", "qno": 21, "text": "집단상담구조화에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 집단의 모임 시간과 횟수에 대해 설명한다.\nㄴ. 집단원들이 생산적인 집단을 위한 행동규범을 창출하도록 촉진한다.\nㄷ. 적극적 참여, 위급상황시 연락방법, 집단원의 책임에 관한 내용이 포함된다.", "options": ["① ㄱ", "② ㄴ", "③ ㄱ, ㄴ", "④ ㄴ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ"], "answer": 4, "expl": "구조화에는 모임 시간·횟수 안내(ㄱ), 생산적인 행동규범 창출 촉진(ㄴ), 참여·위급 시 연락방법·집단원 책임 등 안내(ㄷ)가 모두 포함된다."}, {"no": "18-47", "year": 2019, "exam": "2019", "qno": 22, "text": "집단상담 평가과정을 순서대로 나열한 것은?", "options": ["① 정보수집 - 평가계획 수립 - 현상기술 - 현상설명 - 대안제시 - 재과정", "② 정보수집 - 현상설명 - 현상기술 - 평가계획 수립 - 재과정 - 대안제시", "③ 현상기술 - 평가계획 수립 - 정보수집 - 현상설명 - 대안제시 - 재과정", "④ 평가계획 수립 - 정보수집 - 현상기술 - 현상설명 - 대안제시 - 재과정", "⑤ 평가계획 수립 - 현상기술 - 정보수집 - 현상설명 - 재과정 - 대안제시"], "answer": 3, "expl": "평가는 평가계획 수립 → 정보수집 → 현상기술 → 현상설명 → 대안제시 → 재과정의 순서로 진행된다."}, {"no": "18-48", "year": 2019, "exam": "2019", "qno": 23, "text": "집단상담 평가에 관한 설명으로 옳지 않은 것은?", "options": ["① 평가계획은 집단계획단계에서 수립한다.", "② 집단목표를 관리하는 데 일차적인 목적을 둔다.", "③ 평가준거에 따라 진단평가, 형성평가, 총괄평가로 구분된다.", "④ 평가결과는 집단상담의 내용과 방법에 대한 수정 및 보완에 활용된다.", "⑤ 평가내용에는 집단의 분위기, 집단원의 변화 정도, 의사소통 형태가 포함된다."], "answer": 2, "expl": "진단평가·형성평가·총괄평가는 평가 '시점'에 따른 구분이다. 평가준거에 따른 구분은 상대평가·절대평가이므로 ③이 틀리다."}, {"no": "18-49", "year": 2019, "exam": "2019", "qno": 24, "text": "집단상담에서 개인의 행동을 제한해야 할 경우를 모두 고른 것은?\nㄱ. 질문만 계속할 때\nㄴ. 내면화 작업으로 침묵하고 있을 때\nㄷ. 다른 집단원의 개인적인 비밀을 캐내려고 할 때\nㄹ. 갈등이나 의견의 불일치를 표현할 때", "options": ["① ㄱ, ㄷ", "② ㄴ, ㄹ", "③ ㄱ, ㄴ, ㄷ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 0, "expl": "질문만 계속하는 경우(ㄱ)와 다른 집단원의 비밀을 캐내려는 경우(ㄷ)는 제한이 필요하다. 내면화 작업의 침묵(ㄴ)은 생산적 침묵이고, 갈등·의견 불일치 표현(ㄹ)은 다뤄야 할 집단 작업의 재료다."}, {"no": "18-50", "year": 2019, "exam": "2019", "qno": 25, "text": "문제행동을 하는 집단원에 대한 집단상담자의 대처 반응을 연결한 것으로 옳지 않은 것은?", "options": ["① 상처싸매기 하는 집단원 - 미해결 감정을 탐색해 보게 한다.", "② 충고하는 집단원 - 충고하는 행동의 동기를 탐색해 보게 한다.", "③ 침묵하는 집단원 - 표정이나 태도를 언급하면서 자연스럽게 집단참여를 유도한다.", "④ 의존하는 집단원 - 집단상담자 자신이 집단원의 의존행동을 조장하지 않았는지 탐색해 본다.", "⑤ 대화를 독점하는 집단원 - 다른 집단원들이 독점 집단원에 대해 불만을 표현하도록 허용하면서 집단원들끼리 해결할 때까지 기다린다."], "answer": 4, "expl": "대화를 독점하는 집단원은 상담자가 직접 개입해 차단하고 다른 집단원의 참여를 이끌어야 한다. 집단원끼리 해결할 때까지 기다리는 것은 적절하지 않다."}, {"no": "17-26", "year": 2018, "exam": "2018", "qno": 1, "text": "집단상담의 특징에 관한 설명으로 옳지 않은 것은?", "options": ["① 지지적인 분위기에서 집단원들은 새로운 행동을 시도해 볼 수 있다.", "② 집단상담자의 지시나 조언이 없어도 집단원들 간 깊은 사회적 교류경험이 가능하다.", "③ 집단은 사회의 축소판과 유사하므로 집단원들은 다양한 경험을 공유할 수 있다.", "④ 개인상담에 비해 집단상담은 상담자의 관여와 조절이 더 쉽고 깊어 질 수 있다.", "⑤ 문제해결과 목표달성은 집단원들 간의 상호작용과 집단상담자와의 상호작용을 통해 이루어진다."], "answer": 3, "expl": "집단상담은 여러 사람이 동시에 참여하므로 개인상담보다 상담자가 개별 집단원에게 관여하고 상황을 조절하기가 더 어렵다. ④가 틀리다."}, {"no": "17-27", "year": 2018, "exam": "2018", "qno": 2, "text": "집단상담자가 회기를 시작할 때 집단원의 참여를 활성화하기 위한 작업으로 옳지 않은 것은?", "options": ["① 지난 회기에서 다루었던 주요 내용을 언급하면서 이번 회기의 계획을 말해준다.", "② 이번 회기에서 나누고 싶은 이야기를 집단원들이 돌아가면서 한 두 문장 정도로 소개하도록 한다.", "③ 집단상담에 방해가 되지 않는 범위 내에서 집단의 주제와 관련 있는 뉴스나 날씨 등에 대해 간략히 언급한다.", "④ 긴급한 질문이나 대답을 요하는 문제가 있다면 시간을 할애해서 다룬다.", "⑤ 어떤 집단원의 관심사를 먼저 다룰 것인지 신속히 결정한다."], "answer": 4, "expl": "어떤 관심사를 먼저 다룰지는 집단원들의 준비도와 흐름을 살피며 함께 정해야 한다. 상담자가 신속히 혼자 결정하는 것은 참여 활성화에 맞지 않는다."}, {"no": "17-28", "year": 2018, "exam": "2018", "qno": 3, "text": "집단응집력에 문제가 있을 경우 나타나는 특징을 모두 고른 것은?\nㄱ. 비밀유지 원칙이 잘 지켜지지 않는다.\nㄴ. 집단원들이 솔직한 감정 표현과 반응하기를 꺼린다.\nㄷ. 집단원들이 집단상담 시간을 엄수한다.\nㄹ. 집단원들이 모험 시도를 꺼린다.", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄹ", "④ ㄱ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "응집력이 약하면 비밀유지가 잘 안 되고(ㄱ), 솔직한 감정 표현(ㄴ)과 모험 시도(ㄹ)를 꺼린다. 시간을 엄수하는 것(ㄷ)은 오히려 응집력이 높은 집단의 특징이다."}, {"no": "17-29", "year": 2018, "exam": "2018", "qno": 4, "text": "집단상담 과정에서 사용하는 피드백에 대한 설명 중 옳지 않은 것은?", "options": ["① 집단상담자의 피드백은 집단원들의 피드백보다 수준이 높기 때문에 집단원들이 더 쉽게 받아들인다.", "② 부정적인 피드백은 긍정적인 피드백 이후에 하는 것이 더 잘 받아들여진다.", "③ 피드백을 줄 때 가치판단을 하거나 변화를 강요해서는 안 된다.", "④ 집단에서 받는 피드백의 영향력은 집단의 발달과정과 관련이 있다.", "⑤ 부정적인 피드백을 주기 전에 집단원들의 자기노출 정도를 고려해야 한다."], "answer": 0, "expl": "집단에서는 상담자보다 동료 집단원의 피드백이 더 큰 영향력을 갖고 잘 수용되는 경우가 많다. 상담자 피드백이 수준이 높아 더 쉽게 받아들여진다는 ①이 틀리다."}, {"no": "17-30", "year": 2018, "exam": "2018", "qno": 5, "text": "집단상담의 한계점에 관한 설명으로 옳지 않은 것은?", "options": ["① 집단원이 다수이므로 비밀 유지에 어려움이 있다.", "② 개인에 대한 관심 정도가 약해질 수 있다.", "③ 모든 사람에게 집단상담이 효과적인 것은 아니다.", "④ 개인상담에 비해 경제적으로 비효율적이다.", "⑤ 집단 내 압력의 가능성이 있다."], "answer": 3, "expl": "집단상담은 한 명의 상담자가 여러 사람을 동시에 돕기 때문에 시간과 비용 면에서 경제적이다. ④가 틀리다."}, {"no": "17-31", "year": 2018, "exam": "2018", "qno": 6, "text": "집단은 초기(시작과 탐색), 중간(작업 또는 생산), 종결(통합)단계의 순서로 발달한다. 집단상담자의 과제를 발달단계별로 옳게 연결한 것은?", "options": ["① 구조화하기 - 문제행동에 대해 직면시키기 - 이별감정 다루기", "② 역기능적 행동패턴 탐색하기 - 목표 설정하기 - 집단원의 성장과 변화 평가하기", "③ 자기개방과 감정정화 시키기 - 생산적인 대안행동과 실행촉진하기 - 저항 표출하게 하기", "④ 안전에 대한 신뢰감 형성하기 - 배운 것 실행하게 하기 - 문제행동 직면시키기", "⑤ 저항다루기 - 구조화하기 - 목표 설정하기"], "answer": 0, "expl": "초기에는 구조화, 중간(작업)단계에는 문제행동 직면, 종결단계에는 이별감정 다루기가 각 단계의 대표 과제다."}, {"no": "17-32", "year": 2018, "exam": "2018", "qno": 7, "text": "집단상담 프로그램 구성과 진행을 위한 작업을 순서대로 나열한 것은?\nㄱ. 신청자 사전 면담\nㄴ. 요구도 조사\nㄷ. 사전 검사\nㄹ. 프로그램 계획안 작성\nㅁ. 집단원 선정", "options": ["① ㄱ - ㄴ - ㄷ - ㄹ - ㅁ", "② ㄱ - ㄷ - ㄴ - ㅁ - ㄹ", "③ ㄴ - ㄹ - ㄱ - ㅁ - ㄷ", "④ ㄴ - ㅁ - ㄱ - ㄹ - ㄷ", "⑤ ㄹ - ㅁ - ㄱ - ㄴ - ㄷ"], "answer": 2, "expl": "요구도 조사(ㄴ) → 프로그램 계획안 작성(ㄹ) → 신청자 사전 면담(ㄱ) → 집단원 선정(ㅁ) → 사전 검사(ㄷ) 순서로 진행한다."}, {"no": "17-33", "year": 2018, "exam": "2018", "qno": 8, "text": "다음의 요건을 모두 충족하는 집단은?\nㄱ. 자신에 대해 더 많은 것을 배우려는 사람들로 구성된다.\nㄴ. 대인간 의사소통을 증진하고자 한다.\nㄷ. 자신과 타인의 감정을 인식하고자 한다.\nㄹ. 생활방식의 변화를 도모하고자 한다.", "options": ["① 치료집단", "② 성장집단", "③ 과업집단", "④ 교육집단", "⑤ 처치집단"], "answer": 1, "expl": "자기에 대해 더 배우려는 사람들로 구성되어 의사소통 증진, 감정 인식, 생활방식 변화를 도모하는 집단은 성장집단이다."}, {"no": "17-34", "year": 2018, "exam": "2018", "qno": 9, "text": "로저스(C. Rogers)가 제안한 참만남 집단과정에 해당하는 것을 모두 고른 것은?\nㄱ. 측정 가능한 목표설정\nㄴ. 부정적 감정의 표현\nㄷ. 긍정적 참회\nㄹ. 직면\nㅁ. 가면의 파괴", "options": ["① ㄱ, ㄴ, ㄷ", "② ㄱ, ㄷ, ㄹ", "③ ㄴ, ㄷ, ㅁ", "④ ㄴ, ㄹ, ㅁ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 3, "expl": "부정적 감정 표현, 직면, 가면의 파괴는 로저스의 참만남 집단 과정에 포함된다. 측정 가능한 목표설정은 행동주의, 긍정적 참회는 15단계에 없는 항목이다."}, {"no": "17-35", "year": 2018, "exam": "2018", "qno": 10, "text": "다음 이론에 근거한 집단상담은?\n이 이론에서 해석은 중요한 핵심기법 중 하나이다. 지금-여기에서 하는 행동의 이면에 깔린 동기를 다루고 해석을 가설적으로 제시한다. 삶의 이력에 대한 정보를 수집하고 생활양식을 분석한다.", "options": ["① 정신분석 집단상담", "② 아들러식 집단상담", "③ 실존주의 집단상담", "④ 게슈탈트 집단상담", "⑤ 인간중심 집단상담"], "answer": 1, "expl": "행동 이면의 동기를 가설적으로 해석하고, 삶의 이력을 수집해 생활양식을 분석하는 것은 아들러 개인심리학 집단상담의 특징이다."}, {"no": "17-36", "year": 2018, "exam": "2018", "qno": 11, "text": "행동주의 집단상담에 관한 설명으로 옳은 것은?", "options": ["① 긍정적 행동 강화를 위해 토큰경제법을 활용한다.", "② 문제행동 분석 및 관리가 상담관계 보다 우선시 된다.", "③ 목표하는 행동을 단번에 강화함으로써 행동을 조형한다.", "④ 집단상담자는 집단규범의 구성과 제시에 직접 개입하지 않는다.", "⑤ 초기단계에서는 추상적인 삶의 가치를 포함하는 내용으로 행동계약을 한다."], "answer": 0, "expl": "토큰경제는 행동주의의 대표적 강화 기법이다. 행동주의도 상담관계를 중시하며(②), 조형은 단계적 강화이고(③), 규범 제시에 개입하며(④), 행동계약은 구체적 행동으로 맺는다(⑤)."}, {"no": "17-37", "year": 2018, "exam": "2018", "qno": 12, "text": "다음은 어느 이론에 근거한 집단상담자의 진술인가?\n자신의 여러 자아상태를 이해하는 것은 커다란 변화를 가져다 줄 것입니다. 저는 여러분에게 어버이, 어른, 어린이 자아상태에 대해 가르쳐 드릴 것이고, 그 다음에 우리는 삶에서 이것을 어떻게 적용할 것인가에 대해 나눠 볼 것입니다. 제가 이렇게 자아상태에 대해 설명한 것처럼 여러분이 자아상태의 갈등을 경험하면서, 그것들이 당신의 중요한 부분이기를 희망합니다.", "options": ["① 해결중심", "② 교류분석", "③ 현실치료", "④ 게슈탈트", "⑤ 인지행동"], "answer": 1, "expl": "어버이(P)·어른(A)·어린이(C) 자아상태를 가르치고 삶에 적용하게 하는 진술은 교류분석 집단상담자의 구조분석 안내다."}, {"no": "17-38", "year": 2018, "exam": "2018", "qno": 13, "text": "집단상담자의 자질과 특성에 관한 설명으로 옳지 않은 것은?", "options": ["① 개방성: 자신의 경험을 말하며 집단원에게 공감적 이해를 표현한다.", "② 용기: 상담자가 진실한 모습으로 집단원과의 상호작용을 감수한다.", "③ 타인의 복지에 대한 관심: 집단원의 문제를 주도적으로 해결하려고 적극 개입한다.", "④ 유머: 집단원에게 웃음을 주는 말이나 행동을 함으로써 문제를 새로운 각도에서 조망해 볼 수 있도록 한다.", "⑤ 창의성: 집단에서 야기되는 문제를 다룰 때 독창적인 방법과 기술을 활용한다."], "answer": 2, "expl": "타인의 복지에 대한 관심은 집단원이 스스로 성장하도록 돕는 태도이지, 상담자가 문제를 주도적으로 해결해 주는 것이 아니다."}, {"no": "17-39", "year": 2018, "exam": "2018", "qno": 14, "text": "촉진하기에 해당하는 것을 모두 고른 것은?\nㄱ. 갈등과 논쟁은 집단 진행에 방해가 되므로 피하도록 한다.\nㄴ. 생산적인 상호작용이 될 수 있도록 안전하고 수용적인 분위기를 만든다.\nㄷ. 집단원들이 서로 직접 말하도록 독려하여 집단상담자에게 덜 의존하게 한다.\nㄹ. 집단원이 자신의 개인적인 문제를 탐색하거나 새로운 행동을 시도할 때 지지한다.", "options": ["① ㄱ, ㄷ", "② ㄴ, ㄹ", "③ ㄱ, ㄷ, ㄹ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 3, "expl": "안전하고 수용적인 분위기(ㄴ), 집단원 간 직접 소통 독려(ㄷ), 새로운 시도에 대한 지지(ㄹ)가 촉진하기다. 갈등과 논쟁은 피할 것이 아니라 생산적으로 다뤄야 한다(ㄱ)."}, {"no": "17-40", "year": 2018, "exam": "2018", "qno": 15, "text": "다음 사례에서 집단상담자가 한 기법은?\n집단원: 저는 공부를 잘하고 싶어도 잘할 수 있는 여건이 아니에요. 언니와 함께 방을 쓰고 있어서 공부에 집중할 수도 없고 방해가 되니까요. 엄마는 언니와 비교해서 나를 무시하곤 해요. 언니는 공부를 잘 하거든요.\n집단상담자: 공부를 잘하는 언니와 방을 함께 쓴다는 것이 네가 공부를 못하게 되는 이유는 아닌 것 같구나.", "options": ["① 직면하기", "② 해석하기", "③ 공감하기", "④ 명료화하기", "⑤ 연결짓기"], "answer": 0, "expl": "언니와 방을 함께 쓰는 환경을 이유로 들지만 그것이 공부를 못하는 진짜 이유가 아니라는 불일치를 짚어주고 있으므로 직면하기다."}, {"no": "17-41", "year": 2018, "exam": "2018", "qno": 16, "text": "침묵하는 집단원(A)에 대한 집단상담자의 작업으로 옳은 것을 모두 고른 것은?\nㄱ. 회기 마지막에 집단에서 경험한 내용을 나누는 시간에 A의 참여를 독려한다.\nㄴ. 다른 집단원이 말할 때 A가 보인 비언어적 반응을 관찰하여 관심을 표현한다.\nㄷ. 침묵의 의미가 무엇인지 탐색하게 한다.\nㄹ. 집단원 고유의 표현 방식이 있는지를 알아본다.", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄱ, ㄷ, ㄹ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 4, "expl": "참여 독려(ㄱ), 비언어적 반응 관찰과 관심 표현(ㄴ), 침묵의 의미 탐색(ㄷ), 고유한 표현 방식 확인(ㄹ) 모두 침묵하는 집단원에게 적절한 작업이다."}, {"no": "17-42", "year": 2018, "exam": "2018", "qno": 17, "text": "집단원의 문제행동에 관한 집단상담자의 작업으로 옳지 않은 것은?", "options": ["① 자주 질문하는 집단원: 질문하는 이유와 계기를 살펴보게 한다.", "② 조언하는 집단원: 조언하고자 하는 자신의 동기를 살펴보게 한다.", "③ 독점하는 집단원: 다른 집단원에게 편안함을 주므로 계속 집단을 이끌어 가게 한다.", "④ 사실적 이야기를 늘어놓는 집단원: 사실적 이야기와 관련된 감정을 현재형으로 표현하게 한다.", "⑤ 의존하는 집단원: 의존하는 자신의 태도를 인식하게 한다."], "answer": 2, "expl": "대화를 독점하는 집단원은 다른 집단원의 참여 기회를 빼앗으므로 상담자가 개입해 제한하고 독점의 의미를 다뤄야 한다. 계속 이끌어 가게 하는 ③은 틀리다."}, {"no": "17-43", "year": 2018, "exam": "2018", "qno": 18, "text": "( )에 들어갈 알맞은 집단상담자의 작업은?\n(    )은(는) 집단상담자가 집단원들이 새로운 행동을 학습하고 생산적인 집단을 위한 규준을 창출하도록 하며, 집단원들의 성장을 촉진하기 위한 틀을 마련하는 것이다.", "options": ["① 직면", "② 진단", "③ 피드백", "④ 구조화", "⑤ 행동형성"], "answer": 3, "expl": "새로운 행동 학습과 생산적인 규준 창출을 위한 틀을 마련하는 작업은 구조화다."}, {"no": "17-44", "year": 2018, "exam": "2018", "qno": 19, "text": "집단상담 진행 시 고려사항으로 옳은 것을 모두 고른 것은?\nㄱ. 집단상담 장소 중앙에 가구를 두는 것은 비언어적 의사소통에 방해를 줄 수 있다.\nㄴ. 집단상담의 특성상 상호작용 촉진을 위해 10명 이상으로만 집단원을 구성하여야 한다.\nㄷ. 특정 욕구를 가진 대상을 집단원으로 하는 경우 동질 집단으로 구성하는 것이 효과적이다.\nㄹ. 응집력을 갖도록 하기 위해서는 개방집단으로 진행하는 것이 효과적이다.", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄷ", "③ ㄴ, ㄹ", "④ ㄱ, ㄴ, ㄷ", "⑤ ㄴ, ㄷ, ㄹ"], "answer": 1, "expl": "가구 배치(ㄱ)와 동질 집단 구성(ㄷ)은 옳다. 집단 크기는 목적·대상에 따라 달라지고 10명 이상만 고집할 필요가 없으며(ㄴ), 응집력은 폐쇄집단에서 더 잘 형성된다(ㄹ)."}, {"no": "17-45", "year": 2018, "exam": "2018", "qno": 20, "text": "집단원 선정에 관한 설명으로 옳지 않은 것은?", "options": ["① 집단상담의 목적에 부합하는 욕구를 가진 사람을 선정한다.", "② 집단상담 진행에 방해를 초래할 가능성이 있는 사람을 집단원으로 받아 들여야 할 것인지 고려한다.", "③ 개별 면담을 통한 선정은 시간할애에 어려움이 있으나 효과적인 방법이 될 수 있다.", "④ 집단상담자와의 이중관계 여부를 파악한다.", "⑤ 집단원 선정을 위해서는 투사검사가 필수적이다."], "answer": 4, "expl": "집단원 선정에는 면담, 질문지 등이 쓰이며 투사검사는 필수가 아니다."}, {"no": "17-46", "year": 2018, "exam": "2018", "qno": 21, "text": "집단상담 평가에 대해 옳은 것을 모두 고른 것은?\nㄱ. 집단원은 집단상담자에 대한 평가자로 참여하지 않는다.\nㄴ. 사전 평가는 집단 과정과 역동을 평가하는 것이다.\nㄷ. 집단원에 대한 평가는 집단원의 태도, 문제행동, 집단에서의 역할 등이 포함된다.\nㄹ. 면접, 관찰, 검사 등의 방법을 통해 정보를 수집하여 평가한다.", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄷ, ㄹ", "④ ㄱ, ㄴ, ㄷ", "⑤ ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "집단원 평가 내용(ㄷ)과 면접·관찰·검사를 통한 정보 수집(ㄹ)은 옳다. 집단원도 상담자를 평가하는 주체가 될 수 있고(ㄱ), 사전 평가는 집단원의 시작 상태를 측정하는 것이지 과정·역동 평가가 아니다(ㄴ)."}, {"no": "17-47", "year": 2018, "exam": "2018", "qno": 22, "text": "청소년 집단상담의 이점으로 옳지 않은 것은?", "options": ["① 청소년기 자기중심적 사고에 도전하게 한다.", "② 사회기술을 연습할 수 있는 장을 마련해 준다.", "③ 안전한 환경에서 자유와 독립성을 시도할 수 있게 한다.", "④ 또래와의 차이점을 발견하여 우월감을 갖게 한다.", "⑤ 또래와 함께 참여하면서 성인 상담자의 권위에서 느끼는 불안감이 감소된다."], "answer": 3, "expl": "청소년 집단상담의 이점은 또래와의 공통점·보편성을 경험하는 데 있다. 차이점을 발견해 우월감을 갖게 한다는 것은 이점이 아니다."}, {"no": "17-48", "year": 2018, "exam": "2018", "qno": 23, "text": "현실치료 집단상담에서 사용하는 기법이 아닌 것은?", "options": ["① 질문", "② 유머", "③ 역설적 기법", "④ 직면", "⑤ 꿈해석"], "answer": 4, "expl": "질문, 유머, 역설적 기법, 직면은 현실치료 기법이다. 꿈 해석은 정신분석(또는 게슈탈트의 꿈 작업)의 기법이다."}, {"no": "17-49", "year": 2018, "exam": "2018", "qno": 24, "text": "집단상담의 사전 동의에 포함되어야 할 내용으로 옳지 않은 것은?", "options": ["① 비밀유지 및 비밀유지의 예외사항", "② 집단상담 성과에 대한 보장", "③ 집단상담자의 이론적 배경", "④ 특정 집단의 운영을 위해 요구되는 집단상담자의 자격요건", "⑤ 집단상담의 잠재적 유익과 위험성에 대한 설명"], "answer": 1, "expl": "사전 동의에는 비밀유지와 예외, 상담자 이론·자격, 잠재적 유익과 위험이 포함된다. 집단상담의 성과는 보장할 수 없으므로 '성과 보장'은 포함되면 안 된다."}, {"no": "17-50", "year": 2018, "exam": "2018", "qno": 25, "text": "청소년 집단상담에서 비밀유지와 관련된 내용으로 옳지 않은 것은?", "options": ["① 비밀유지에 대해 교육한다.", "② 집단과정 중에 비밀유지가 관심사가 되면 회기 중에 이 문제를 다루는 것이 바람직하다.", "③ 비밀유지와 관련된 다문화적 관점을 존중해야 한다.", "④ 초등학생 집단원인 경우 부모나 후견인에게 비밀유지의 중요성을 알려주고 협조를 구한다.", "⑤ 아동학대가 의심되어도 비밀유지의 원칙은 지켜야 한다."], "answer": 4, "expl": "아동학대가 의심되면 비밀보장의 예외에 해당해 신고 의무가 있다. 비밀유지 원칙을 지켜야 한다는 ⑤가 틀리다."}, {"no": "16-26", "year": 2017, "exam": "2017", "qno": 1, "text": "집단규범에 관한 설명으로 옳지 않은 것은?", "options": ["① 집단의 초기 단계에 형성되도록 한다.", "② 집단상담자는 집단규범 형성에 영향을 준다.", "③ 집단원들의 선입견에 의해 형성된 암묵적 규범은 집단에 부정적인 영향을 미칠 수 있다.", "④ 명확하게 제시될수록 집단목표 달성에 도움이 된다.", "⑤ 집단 초기에 설정한 규범은 종결까지 변경하지 않는다."], "answer": 4, "expl": "집단규범은 고정된 것이 아니라 집단의 발달과 필요에 따라 수정될 수 있다. 초기 규범을 종결까지 변경하지 않는다는 ⑤가 틀리다."}, {"no": "16-27", "year": 2017, "exam": "2017", "qno": 2, "text": "집단상담 종결기의 특징이 나타나는 내담자 반응을 모두 고른 것은?\nㄱ. \"솔직히 여기서 무엇을 말해야 할지 모르겠어요.\"\nㄴ. \"집단원들을 더 이상 못 보게 된다고 생각하니 너무 아쉬워요.\"\nㄷ. \"제 문제에 대한 집단원들의 충고가 많은 도움이 되었어요.\"\nㄹ. \"앞으로 수업시간에 기회가 있으면 꼭 질문이나 발표를 하려고요.\"\nㅁ. \"제가 무슨 말을 해도 평가하려고 하는 것 같아서 말하기가 부담스러워요.\" ", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄴ, ㄷ, ㄹ", "④ ㄴ, ㄷ, ㅁ", "⑤ ㄴ, ㄷ, ㄹ, ㅁ"], "answer": 2, "expl": "이별의 아쉬움(ㄴ), 집단 경험의 정리(ㄷ), 일상으로의 적용 다짐(ㄹ)은 종결기 반응이다. 무엇을 말할지 모르는 막막함(ㄱ)과 평가받는 듯한 부담감(ㅁ)은 초기단계 반응이다."}, {"no": "16-28", "year": 2017, "exam": "2017", "qno": 3, "text": "2명의 상담자가 공동으로 집단상담을 운영할 때 옳지 않은 것은?", "options": ["① 공동지도자 간 서로 존중하고 신뢰하는 관계를 형성한다.", "② 공동지도자들이 집단회기를 교대로 이끈다.", "③ 공동지도자들은 서로의 관점과 의견 차이를 논의하기 위한 시간을 갖는다.", "④ 공동지도자 간의 불일치가 집단 안에서 건설적으로 해결된다면 집단원들에게 모범이 된다.", "⑤ 한 지도자가 문제행동을 보이는 집단원에게 주의를 기울이는 동안 다른 지도자는 나머지 집단원들의 반응에 주의를 기울인다."], "answer": 1, "expl": "공동지도자는 매 회기 함께 참여해 역할을 나누어 협력한다. 회기를 교대로 이끄는 방식은 공동지도의 장점을 살리지 못한다."}, {"no": "16-29", "year": 2017, "exam": "2017", "qno": 4, "text": "집단상담 과정에서 '지금-여기'에 초점을 둠으로써 얻을 수 있는 이점을 모두 고른 것은?\nㄱ. 경험하고 있는 것을 표현할 수 있는 기회를 제공한다.\nㄴ. 집단원 간 상호작용의 정서적 강도를 높일 수 있다.\nㄷ. 집단에서 일어나는 일에 대한 집단원들의 책임을 자각하게 한다.\nㄹ. 집단 밖에서 어떤 일이 일어났는지 자세히 알 수 있다.", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄷ", "④ ㄱ, ㄴ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "지금-여기에 초점을 두면 경험을 표현할 기회(ㄱ), 상호작용의 정서적 강도(ㄴ), 집단 내 일에 대한 책임 자각(ㄷ)이 높아진다. 집단 밖 일을 자세히 아는 것(ㄹ)은 거기-그때 초점이다."}, {"no": "16-30", "year": 2017, "exam": "2017", "qno": 5, "text": "집단상담 발달단계에 따른 상담자 역할을 순서대로 나열한 것은?\nㄱ. 집단을 구조화하고 집단원들 간 신뢰감을 형성한다.\nㄴ. 분리감·상실감 등의 복잡한 감정을 다루고 집단에서 배운 것을 정리한다.\nㄷ. 격려와 직면을 통해 집단원의 자기개방에 따른 불안, 방어, 상담자에 대한 도전 등을 다룬다.\nㄹ. 집단원의 자기탐색의 깊이와 강도를 심화시키고 변화에 책임의식을 갖게 한다.", "options": ["① ㄱ – ㄷ – ㄹ – ㄴ", "② ㄱ – ㄹ – ㄴ – ㄷ", "③ ㄱ – ㄹ – ㄷ – ㄴ", "④ ㄴ – ㄷ – ㄱ – ㄹ", "⑤ ㄷ – ㄹ – ㄴ – ㄱ"], "answer": 0, "expl": "구조화·신뢰 형성(초기, ㄱ) → 불안·방어·도전 다루기(전환, ㄷ) → 자기탐색 심화·변화 책임(작업, ㄹ) → 분리감 다루기·정리(종결, ㄴ)의 순서다."}, {"no": "16-31", "year": 2017, "exam": "2017", "qno": 6, "text": "비자발적인 집단원에 대한 상담자의 개입으로 옳지 않은 것은?", "options": ["① 적극적인 참여의 중요성을 설명한다.", "② 침묵할 자유와 권리가 있음을 알려준다.", "③ 집단에 억지로 참여하게 된 것에 대한 솔직한 감정을 표현할 수 있도록 한다.", "④ 기대 이하의 수준으로 집단에 참여한 경우 집단상담을 받은 것으로 인정하지 않을 수 있음을 설명한다.", "⑤ 학교폭력 가해학생이 법적 명령에 의해 집단에 출석할 때, 학교장의 요구가 있더라도 상담결과에 대한 비밀이 보장됨을 알린다."], "answer": 4, "expl": "법적 명령으로 참여한 경우 관련 기관에 결과를 보고해야 할 수 있으므로, 비밀이 무조건 보장된다고 알리는 것은 옳지 않다. 처음부터 비밀보장의 한계를 정확히 안내해야 한다."}, {"no": "16-32", "year": 2017, "exam": "2017", "qno": 7, "text": "다음은 스트레스 감소를 위한 이야기치료 집단상담에 관한 내용이다. 상담자의 개입방법을 옳게 나열한 것은?(순서대로 ㄱ, ㄴ, ㄷ, ㄹ)\nㄱ: 스트레스에 지배당하지 않았던 순간 또는 스트레스를 이겨낸 순간이 있었는지 발견하도록 한다.\nㄴ: 스트레스 상황에 대해 자세히 이야기하도록 하고 공감을 표현한다.\nㄷ: 스트레스를 극복할 수 있는 자신만의 새로운 이야기를 발견하도록 한다.\nㄹ: 스트레스를 찰흙으로 형상화하고, 그것에 이름을 붙임으로써 자신과 문제를 분리하도록 한다.", "options": ["① 독특한 결과 찾기, 대안적 이야기 형성, 문제 이야기 경청, 문제의 외재화", "② 문제 이야기 경청, 문제의 외재화, 대안적 이야기 형성, 독특한 결과 찾기", "③ 문제의 외재화, 대안적 이야기 형성, 문제 이야기 경청, 독특한 결과 찾기", "④ 독특한 결과 찾기, 문제 이야기 경청, 대안적 이야기 형성, 문제의 외재화", "⑤ 문제의 외재화, 문제 이야기 경청, 대안적 이야기 형성, 독특한 결과 찾기"], "answer": 3, "expl": "ㄱ은 문제에 지배당하지 않았던 예외를 찾는 독특한 결과, ㄴ은 문제 이야기 경청, ㄷ은 대안적 이야기 형성, ㄹ은 문제에 이름을 붙여 분리하는 문제의 외재화다."}, {"no": "16-33", "year": 2017, "exam": "2017", "qno": 8, "text": "다문화 가정 청소년을 대상으로 집단상담을 운영할 때 상담자의 태도로 옳지 않은 것은?", "options": ["① 다른 인종, 민족 집단에 대한 자신의 고정관념과 편견을 검토하고 교정한다.", "② 집단원들이 다문화에 관심을 표현하지 않아도 문화적 차이를 고려하여 집단을 운영한다.", "③ 다문화 집단의 문화적 유산 및 역사적 배경에 대한 지식을 습득한다.", "④ 문화적으로 적절한 기법을 사용한다.", "⑤ 집단원의 행동은 인종, 문화와 관련성이 없음을 인식한다."], "answer": 4, "expl": "다문화 상담자는 집단원의 행동이 인종·문화와 관련될 수 있음을 인식해야 한다. 관련성이 없다고 보는 ⑤는 문화적 민감성이 부족한 태도다."}, {"no": "16-34", "year": 2017, "exam": "2017", "qno": 9, "text": "청소년 집단상담에서 비밀유지 원칙을 위반한 집단원이 있을 경우 상담자의 대처 방법으로 옳은 것은?", "options": ["① 어떻게 비밀유지 원칙을 위반하게 되었는지 문제 집단원의 주변인들을 면담한다.", "② 문제 집단원의 퇴출을 결정할 때 비밀유지 위반의 고의성은 고려하지 않는다.", "③ 문제 집단원의 퇴출을 결정할 때 집단원들의 의견은 고려하지 않는다.", "④ 문제 집단원이 잔류하게 될 때 다른 집단원들이 비난하거나 공격하는 상황이 발생하는지 주의깊게 관찰한다.", "⑤ 문제 집단원을 퇴출하기로 한 경우, 그가 퇴출당하는 것에 대해 느끼는 부정적인 감정을 탐색하지 않는다."], "answer": 3, "expl": "문제 집단원이 잔류할 경우 다른 집단원의 비난·공격이 생기지 않는지 주의 깊게 살펴야 한다. 주변인 면담(①)은 또 다른 비밀 침해이고, 고의성(②)과 집단원 의견(③)을 고려해야 하며, 퇴출 시 감정도 다뤄야 한다(⑤)."}, {"no": "16-35", "year": 2017, "exam": "2017", "qno": 10, "text": "인터넷 중독 청소년을 위한 현실치료 집단상담에서 우볼딩(R. Wubbolding)의 행동변화 작업을 순서대로 나열한 것은?\nㄱ. 인터넷 사용 행동에 내재된 자신의 근본적인 욕구를 인식한다.\nㄴ. 자신의 인터넷 사용 행동의 결과가 유익한지 점검하고, 올바른 욕구 충족 방법은 적절한 인터넷 사용을 통해 이루지는 것임을 이해한다.\nㄷ. 인터넷 사용 행동을 탐색하고, 인터넷을 사용하는 것은 자신의 선택이고 자신이 통제할 수 있는 것임을 이해한다.\nㄹ. 현실적으로 받아들여질 수 있고 타인에게 폐를 끼치지 않는 올바른 인터넷 사용 계획을 수립한다.", "options": ["① ㄱ – ㄴ – ㄷ – ㄹ", "② ㄱ – ㄷ – ㄴ – ㄹ", "③ ㄴ – ㄱ – ㄹ – ㄷ", "④ ㄷ – ㄱ – ㄴ – ㄹ", "⑤ ㄷ – ㄱ – ㄹ – ㄴ"], "answer": 1, "expl": "우볼딩의 WDEP 순서에 따라 욕구(W) 인식(ㄱ) → 현재 행동(D) 탐색(ㄷ) → 행동의 평가(E)(ㄴ) → 계획(P) 수립(ㄹ)으로 진행한다."}, {"no": "16-36", "year": 2017, "exam": "2017", "qno": 11, "text": "여고생들을 위한 성장집단에서 상담자가 사용한 기법은?\n영희: 저는 꿈이 없어요. 하지만 꿈이 무엇인지 아는 것보다는 일단 공부를 잘하는 것이 중요하다고 생각해요. 공부를 못하면 꿈도 이룰 수 없으니까요.\n숙미: 말도 안 돼. 꿈이 없는데 공부만 잘 하는 게 무슨 소용이 있어? 원하는 꿈이 학교 성적과 상관이 없는 경우도 있잖아.\n상담자: 잠깐만. 선생님이 말을 해도 될까? 우리는 무엇이 더 중요하고 옳은가보다는 서로의 말을 경청하고 생각의 다름을 인정하는 것이 중요할 것 같아. 다시 영희의 이야기로 돌아가 보자.", "options": ["① 차단하기", "② 연결하기", "③ 직면하기", "④ 해석하기", "⑤ 유도하기"], "answer": 0, "expl": "두 집단원의 논쟁이 비생산적으로 흐르자 상담자가 '잠깐만'으로 끊고 방향을 돌리고 있으므로 차단하기다."}, {"no": "16-37", "year": 2017, "exam": "2017", "qno": 12, "text": "합리적 정서행동(REBT) 집단상담에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 상담자는 교사의 역할, 집단원은 학습자의 역할을 한다.\nㄴ. 가르치기, 제안하기, 과제주기 등의 기법이 활용된다.\nㄷ. 집단원의 과거와 현재, 미래 행동에 초점을 두고, 인지·정서·행동을 모두 다루기 때문에 치료가 복잡하다.\nㄹ. 집단원의 잘못된 사고를 명료화하고 이를 비판적으로 평가하여 합리적인 신념으로 대체하도록 돕는다.", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄷ", "③ ㄱ, ㄴ, ㄹ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "교사-학습자 관계(ㄱ), 가르치기·제안·과제(ㄴ), 잘못된 사고의 명료화와 합리적 신념으로 대체(ㄹ)는 REBT 내용이다. REBT는 현재의 신념에 초점을 두며 비교적 단기·간결한 치료다(ㄷ)."}, {"no": "16-38", "year": 2017, "exam": "2017", "qno": 13, "text": "다음 사례에서 적용한 상담기법은?\n집단상담자: 햇님은 집단에 참여한 모든 친구들에게 친절하고, 다른 사람들을 위해 계속 뭔가를 하고 있는 것으로 보입니다. 이제 햇님이 다른 집단원들에게 뭔가를 해달라고 요청하는 작업을 해보겠습니까?\n햇님: 저에게 익숙하지 않은 일이지만, 한번 해보겠습니다.", "options": ["① 반전기법", "② 바꾸어말하기", "③ 직면하기", "④ 빈의자기법", "⑤ 마술상점기법"], "answer": 0, "expl": "늘 남을 위해 해주던 햇님에게 반대로 도움을 요청해 보게 하는 것은 평소 행동과 반대되는 행동을 해보게 하는 게슈탈트의 반전(반대로 하기) 기법이다."}, {"no": "16-39", "year": 2017, "exam": "2017", "qno": 14, "text": "집단상담의 치료적 요인에 관한 설명으로 옳지 않은 것은?", "options": ["① 청소년들에게는 자신에 대한 다른 사람의 피드백을 경험하는 대인관계 학습이 중요한 치료적 요인이다.", "② 치료적 요인에 의한 변화경험은 집단상담자, 집단원, 집단 활동 등의 다양한 상호작용의 결과로 발생한다.", "③ 집단상담자는 집단 운영을 계획할 때 집단의 치료적 요인을 인식해야 한다.", "④ 얄롬(I. Yalom)은 모험시도, 마법 등을 치료적 요인으로 제시하였다.", "⑤ 집단원 개개인은 서로 다른 치료적 요인에 의해 도움을 받을 수 있다."], "answer": 3, "expl": "모험시도, 마법 등은 얄롬이 제시한 11가지 치료적 요인에 없다. 얄롬의 요인은 희망, 보편성, 정보전달, 이타심, 1차 가족 교정적 재현, 사회화 기술, 모방행동, 대인관계 학습, 응집력, 정화, 실존적 요인이다."}, {"no": "16-40", "year": 2017, "exam": "2017", "qno": 15, "text": "청소년이 집단상담에 참여할 때의 이점으로 옳지 않은 것은?", "options": ["① 또래들 간 상호작용을 관찰하며 자기주장 등 새로운 사회적 기술을 학습할 수 있다.", "② 삶에서 어려운 경험을 한 것을 인식하고 자신이 특별히 힘든 사람이라는 생각을 강화할 수 있다.", "③ 외부적 위협을 느끼지 않으면서 현실적 문제 상황에 대한 자기 나름대로의 적응 및 대처방안을 체득할 수 있다.", "④ 성인 집단상담자와의 힘의 균형을 경험하면서 성인과의 효과적인 상호작용 기술을 학습할 수 있다.", "⑤ 또래와의 상호 교류 능력이 개발되어 청소년기의 자기중심적인 특성에서 벗어날 수 있다."], "answer": 1, "expl": "집단상담은 자신만 특별히 힘든 것이 아님을 깨닫는 보편성을 경험하게 한다. 자신이 특별히 힘든 사람이라는 생각을 강화한다는 ②는 이점이 아니다."}, {"no": "16-41", "year": 2017, "exam": "2017", "qno": 16, "text": "집단상담의 윤리적 규범에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 윤리적 규범은 상담자가 책임 있는 의사결정을 하는 데 기준이 된다.\nㄴ. 상담자는 집단역동, 집단과정, 집단촉진기술에 대한 훈련을 받아야 한다.\nㄷ. 상담자는 자신이 지도하는 집단에서 자신의 문제를 해결하고자 노력해야 한다.\nㄹ. 상담자의 민감성 혹은 전문성 부족은 윤리적 문제를 야기할 수 있다.\nㅁ. 상담자는 집단경험이 집단원들의 삶에 미칠 수 있는 부정적 영향도 알려 주어야 한다.", "options": ["① ㄱ, ㄷ", "② ㄴ, ㄹ, ㅁ", "③ ㄱ, ㄴ, ㄹ, ㅁ", "④ ㄴ, ㄷ, ㄹ, ㅁ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"], "answer": 2, "expl": "윤리적 의사결정의 기준(ㄱ), 전문 훈련(ㄴ), 민감성·전문성 부족의 위험(ㄹ), 부정적 영향 고지(ㅁ)는 옳다. 상담자가 자신의 문제를 집단에서 해결하려는 것(ㄷ)은 집단원을 위한 시간을 침해하는 비윤리적 행동이다."}, {"no": "16-42", "year": 2017, "exam": "2017", "qno": 17, "text": "과정분석(processing)에 관한 설명으로 옳은 것은?", "options": ["① 구조화 집단에서는 과정분석이 필요 없다.", "② 과정분석은 초심자가 쉽게 배울 수 있는 기술이다.", "③ 초점유지, 개인화는 과정분석의 방법이 아니다.", "④ 집단원은 다른 집단원이 말한 내용을 기억하고 있어야 한다.", "⑤ 집단회기에서 경험한 사고, 감정, 대인관계의 패턴 등에 관하여 성찰한 내용을 서로 공유하는 활동이다."], "answer": 4, "expl": "과정분석은 회기에서 경험한 사고·감정·대인관계 패턴을 돌아보고 나누는 활동이다. 구조화 집단에도 필요하며 숙련이 요구되는 기술이다."}, {"no": "16-43", "year": 2017, "exam": "2017", "qno": 18, "text": "집단상담 평가에 관한 설명으로 옳은 것은?", "options": ["① 평가의 일차적인 목적은 목표 관리이다.", "② 집단 밖에서 이루어지는 비공식적인 평가를 권장한다.", "③ 종결단계에서는 양적 평가만 사용한다.", "④ 녹화와 같은 행동관찰 평가는 비밀스럽게 진행한다.", "⑤ 집단원들의 상호 평가에서 부정적인 내용은 배제한다."], "answer": 0, "expl": "집단상담 평가의 일차적 목적은 집단 목표의 달성 정도를 관리하는 것이다. 비공식 외부 평가(②), 양적 평가만 사용(③), 몰래 녹화(④), 부정적 내용 배제(⑤)는 틀리다."}, {"no": "16-44", "year": 2017, "exam": "2017", "qno": 19, "text": "학교집단상담 계획서에 포함되어야 할 내용으로 옳지 않은 것은?", "options": ["① 학부모의 인적사항", "② 기대효과와 평가", "③ 집단원의 선발방법", "④ 집단 프로그램 활동", "⑤ 집단상담의 필요성과 목적"], "answer": 0, "expl": "학교 집단상담 계획서에는 필요성과 목적, 선발방법, 프로그램 활동, 기대효과와 평가 등이 들어가며 학부모 인적사항은 포함 대상이 아니다."}, {"no": "16-45", "year": 2017, "exam": "2017", "qno": 20, "text": "구조화된 집단상담 초기에 상담자가 해야 할 일을 모두 고른 것은?\nㄱ. 집단원들이 집단을 지휘하도록 둔다.\nㄴ. 집단의 목표를 확인하고 명료화한다.\nㄷ. 부정적인 문제에 집단의 초점을 둔다.\nㄹ. 집단에서 함께 할 활동에 대하여 알려준다.", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄷ", "③ ㄴ, ㄹ", "④ ㄱ, ㄴ, ㄹ", "⑤ ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "구조화 집단 초기에는 목표 확인과 명료화(ㄴ), 활동 안내(ㄹ)가 필요하다. 집단원에게 지휘를 맡기거나(ㄱ) 부정적 문제에 초점을 두는 것(ㄷ)은 초기 과제가 아니다."}, {"no": "16-46", "year": 2017, "exam": "2017", "qno": 21, "text": "정신분석적 집단상담에 관한 설명으로 옳지 않은 것은?", "options": ["① 부적응 행동들을 줄이기 위해서 훈습과정을 거친다.", "② 관념이나 느낌, 환상 등을 자유롭게 표현하도록 하는 기법들을 사용한다.", "③ '지금과 여기'보다 '거기와 그때'에 더 주의를 기울인다.", "④ 부모와의 수직적 차원의 전이와 형제를 포함한 대인관계의 수평적 차원의 전이를 모두 다룬다.", "⑤ 집단상담자는 자기개방을 지양하고 권위적이고 객관적인 태도를 취한다."], "answer": 4, "expl": "정신분석 집단상담자도 필요에 따라 자기개방을 하며, 권위적이기보다 집단원이 전이를 투사할 수 있도록 중립적 태도를 유지한다. ⑤가 틀리다."}, {"no": "16-47", "year": 2017, "exam": "2017", "qno": 22, "text": "아들러(A. Adler)의 개인심리 집단상담에 관한 설명으로 옳지 않은 것은?", "options": ["① 포괄적 평가에 기초하여 아동기 역동을 탐색한다.", "② 가족구도, 생활양식 분석 등이 주 치료기법이다.", "③ 열등감 자각과 우월성 추구에 초점을 맞춘다.", "④ 고립되고 자기중심적인 사람은 집단원으로 선발하지 않는다.", "⑤ 집단원이 가지고 있는 부적절한 사적 논리를 파악하여 변화시킨다."], "answer": 3, "expl": "아들러는 사회적 관심 발달을 중시하므로 고립되고 자기중심적인 사람도 오히려 집단에서 도움을 받을 수 있다고 본다. 선발하지 않는다는 ④가 틀리다."}, {"no": "16-48", "year": 2017, "exam": "2017", "qno": 23, "text": "실존주의 집단상담에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 상담자는 집단원들이 내면의 목소리를 경청하고 주관적 경험에 주의를 기울이도록 격려한다.\nㄴ. 집단원의 주관적 세계에 대한 이해를 돕기 위해 상호관계성의 탐색을 보류한다.\nㄷ. 불안을 제거하고 삶을 더 쉽고 안전하게 만드는 것이 목표이다.\nㄹ. 침묵은 중요한 치료적 개입방법이다.", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄹ", "③ ㄴ, ㄷ", "④ ㄱ, ㄴ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 1, "expl": "내면 목소리 경청 격려(ㄱ)와 치료적 개입으로서의 침묵(ㄹ)은 옳다. 실존주의는 상호관계성 탐색을 중시하며(ㄴ), 불안을 제거하기보다 직면하고 의미를 찾도록 돕는다(ㄷ)."}, {"no": "16-49", "year": 2017, "exam": "2017", "qno": 24, "text": "집단원의 문제행동에 대한 상담자의 대처로 옳지 않은 것을 모두 고른 것은?\nㄱ. 여러 명의 집단원들이 만성적으로 지각하거나 결석하는 경우 집단원들 간의 상호작용에 좀 더 초점을 맞춘다.\nㄴ. 대화를 독점하는 집단원에게 모든 집단원들이 돌아가면서 좌절된 심정을 피드백 하도록 한다.\nㄷ. 습관적으로 불평을 하는 집단원에게는 개별면담을 통해 이유를 알아보고 생산적인 집단이 될 수 있도록 협조를 구한다.\nㄹ. 지속적으로 의존적 자세를 보이는 집단원이 도움을 요청하는 행동을 보일 때 적극적으로 도와준다.", "options": ["① ㄱ, ㄷ", "② ㄴ, ㄹ", "③ ㄱ, ㄴ, ㄹ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "만성적 지각·결석은 집단 전체의 문제로 다루고(ㄱ), 독점자에게 모든 집단원이 돌아가며 좌절을 피드백하게 하면 공격이 될 수 있으며(ㄴ), 의존적 집단원을 적극 도와주면 의존이 강화된다(ㄹ). 습관적 불평에 대한 개별면담(ㄷ)은 적절하다."}, {"no": "16-50", "year": 2017, "exam": "2017", "qno": 25, "text": "코리(G. Corey)가 주장한 유능한 집단 지도자의 개인적 특성에 관한 설명으로 옳지 않은 것은?", "options": ["① '개인적인 힘'은 자신이 타인에게 미치는 영향력을 인식하며, 집단원들의 역량을 강화시키는 것이다.", "② '용기'는 상담자라는 역할 뒤에 숨지 않고, 실수를 인정하며 자신의 통찰과 신념에 따라 행동하는 것이다.", "③ '집단과정에 대한 신뢰'는 집단의 치료적 힘을 믿고 집단 내에서 발생하는 갈등을 조정하기 위해 노력하는 것이다.", "④ '유머감각'은 비판에 대해 효과적이고 비공격적인 형식으로 반응하는 것이다.", "⑤ '함께 함'은 자신의 감정을 자각하고 표현하며, 집단원들과 마음을 함께 나누는 것이다."], "answer": 3, "expl": "코리가 말한 유머감각은 자신과 상황을 지나치게 심각하게 보지 않고 웃음을 활용할 수 있는 능력이다. 비판에 효과적·비공격적으로 반응하는 것은 '비방어적 태도'에 해당한다."}, {"no": "15-26", "year": 2016, "exam": "2016-2", "qno": 1, "text": "비구조화 집단에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 감수성 훈련, T집단이 해당된다.\nㄴ. 폭넓고 깊은 상호작용이 이루어질 수 있다.\nㄷ. 구조화집단보다 지도자의 전문성이 더욱 요구된다.\nㄹ. 비구조화가 중요하기에 지도자가 어떤 계획을 세울 필요는 없다.", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄷ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "감수성 훈련·T집단은 비구조화 집단이며(ㄱ), 폭넓고 깊은 상호작용이 가능하고(ㄴ), 정해진 틀이 없어 지도자의 전문성이 더 요구된다(ㄷ). 비구조화 집단도 목적·운영에 대한 계획은 필요하다(ㄹ)."}, {"no": "15-27", "year": 2016, "exam": "2016-2", "qno": 2, "text": "성장 집단상담에 관한 설명으로 옳지 않은 것은?", "options": ["① 비교적 정상범위의 적응 수준을 가진 사람을 대상으로 한다.", "② 인원은 8-12명 정도가 적당하나, 대상자 특성에 따라 달라질 수 있다.", "③ 집단원 간의 역동적 상호작용을 통한 변화와 성장을 지향한다.", "④ 내용이나 정보 전달에 초점을 두고 지도자가 책임과 주도성을 갖고 진행한다.", "⑤ 지도자와 집단원이 정기적으로 만나 상호 수용적 분위기에서 진행한다."], "answer": 3, "expl": "성장집단은 집단원 간 상호작용을 통해 성장하는 집단이다. 정보 전달에 초점을 두고 지도자가 주도하는 것은 교육집단의 특징이다."}, {"no": "15-28", "year": 2016, "exam": "2016-2", "qno": 3, "text": "집단상담의 치료적 요인에 관한 설명으로 옳지 않은 것은?", "options": ["① 다른 집단원에게 도움을 주는 이타성은 치료적 요인이다.", "② 자기이해에 기반한 통찰력은 청소년에게 가장 도움이 되는 치료적 요인이다.", "③ 자신에 대한 다른 사람의 지각을 듣는 피드백 경험은 중요한 치료적 요인이다.", "④ 특정 경험의 의미를 설명, 해석, 명료화하는 인지적 요소는 치료적 요인으로 작용한다.", "⑤ 타인을 통해 받을 수 있는 지지와 도움에 한계가 있고 고통은 피할 수 없음을 인식하는 것은 치료적 요인이 될 수 있다."], "answer": 1, "expl": "얄롬의 연구에서 청소년에게 특히 도움이 되는 요인으로는 대인관계 학습, 응집력, 정화 등이 꼽힌다. 자기이해의 통찰을 '가장' 도움이 되는 요인으로 단정한 ②가 틀리다."}, {"no": "15-29", "year": 2016, "exam": "2016-2", "qno": 4, "text": "행동으로 모범을 보이거나 설명을 통해 돕는 것을 집단상담자의 가장 중요한 역할로 제시한 참만남집단 모형은?", "options": ["① 스톨러(Stoller) 모형", "② 얄롬(Yalom) 모형", "③ 하르트만(Hartman) 모형", "④ 슈츠(Schutz) 모형", "⑤ 로저스(Rogers) 모형"], "answer": 0, "expl": "스톨러(Stoller) 모형은 상담자가 행동으로 모범을 보이거나 설명해 주는 역할을 가장 중요하게 본다."}, {"no": "15-30", "year": 2016, "exam": "2016-2", "qno": 5, "text": "다음의 기법이나 개념이 강조되는 집단상담 접근은?\n- 알지 못함의 자세\n- 상담 이전의 변화 확인\n- 문제 삼지 않는 것 다루지 않기", "options": ["① 게슈탈트 집단상담", "② 교류분석 집단상담", "③ 개인심리 집단상담", "④ 심리극적 집단상담", "⑤ 해결중심 집단상담"], "answer": 4, "expl": "알지 못함의 자세, 상담 전 변화 확인, '고장 나지 않았으면 고치지 마라'는 해결중심 집단상담의 핵심 원리다."}, {"no": "15-31", "year": 2016, "exam": "2016-2", "qno": 6, "text": "집단상담 과정에서 윤리적으로 문제가 될 수 있는 내용이 아닌 것은?", "options": ["① 적합한 상담자 의뢰가 어려워 자신의 학생에게 고지된 동의를 받고 상담 기록을 하면서 자문, 지도감독을 받으며 진행했다.", "② 집단원이 매회 가져오는 꽃이나 케이크를 작은 정성으로 여겨 받았다.", "③ 개인의 비밀을 카드에 익명으로 쓰게 한 후, 무작위로 뽑아 발표하면서 누구의 비밀인지 알게 되었다.", "④ 미진한 성과를 얻은 집단원을 상담 종결 후 다른 상담자에게 의뢰했으나, 이를 거부한 집단원에게 상담 받을 것을 재차 요구했다.", "⑤ 법정 전염병에 걸린 집단원이 편안하게 집단에 참여하도록 이에 대한 비밀을 유지하였다."], "answer": 0, "expl": "적합한 의뢰처가 없을 때 동의를 받고 기록과 자문·수퍼비전을 병행하며 진행하는 것은 윤리적으로 보완된 조치다. ②는 선물 수수, ③은 비밀 노출, ④는 의뢰 강요, ⑤는 공중보건상 비밀보장의 예외를 무시한 것이다."}, {"no": "15-32", "year": 2016, "exam": "2016-2", "qno": 7, "text": "다음은 어떤 초점화(focusing) 개입인가?\n- 정희가 자신의 이야기를 끝낼 때까지 계속 진행할까요?\n- 새로운 이야기를 하기 전에 이 주제를 마무리해 봅시다.\n- 동호가 더 할 얘기가 있는 것 같아요. 좀 더 들어 볼까요?", "options": ["① 초점 유지", "② 초점 확립", "③ 초점 이동", "④ 초점 심화", "⑤ 초점 일반화"], "answer": 0, "expl": "현재 다루고 있는 이야기나 주제를 계속 이어가도록 하는 개입이므로 초점 유지다."}, {"no": "15-33", "year": 2016, "exam": "2016-2", "qno": 8, "text": "정신분석 집단상담에 관한 설명으로 옳지 않은 것은?", "options": ["① 전이와 저항에 주의를 기울이며 해석을 통해 집단원의 통찰을 돕는다.", "② 전이 분석이 주로 이루어지므로 집단은 비슷한 특성을 지닌 사람들로 구성하는 것이 좋다.", "③ 집단원들이 다른 집단원의 문제를 듣고 반응하면서 보조 혹은 공동상담자 역할을 수행하기도 한다.", "④ 슬랩손(S. Slavson)은 집단상담자의 기능으로 지도, 자극, 확충, 해석 기능을 제시했다.", "⑤ 개인분석과 달리 대인관계 양상을 분석한 후 개인의 내적 심리과정을 분석한다."], "answer": 1, "expl": "정신분석 집단은 다양한 전이 반응이 일어나도록 서로 다른 특성의 사람들(이질집단)로 구성하는 것이 좋다. ②가 틀리다."}, {"no": "15-34", "year": 2016, "exam": "2016-2", "qno": 9, "text": "집단상담자의 자질을 인성적 특성과 전문적 특성으로 구분할 때, 전문적 특성을 모두 고른 것은?\nㄱ. 개방성\nㄴ. 개인상담 진행 경험\nㄷ. 긍정적 변화에 대한 믿음\nㄹ. 상담이론에 대한 지식과 이해\nㅁ. 인간에 대한 폭넓은 지식과 경험", "options": ["① ㄱ, ㄴ", "② ㄹ, ㅁ", "③ ㄱ, ㄷ, ㅁ", "④ ㄴ, ㄹ, ㅁ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"], "answer": 3, "expl": "개인상담 진행 경험(ㄴ), 상담이론 지식(ㄹ), 인간에 대한 폭넓은 지식과 경험(ㅁ)이 전문적 특성이다. 개방성(ㄱ)과 긍정적 변화에 대한 믿음(ㄷ)은 인성적 특성이다."}, {"no": "15-35", "year": 2016, "exam": "2016-2", "qno": 10, "text": "청소년 집단상담의 계획, 실시, 평가에 관한 설명으로 옳은 것은?", "options": ["① 집단 계획서는 사전검사 실시 후 완성한다.", "② 효과의 극대화를 위해 회기 당 활동을 최대한 많이 구성한다.", "③ 집단 계획 절차에서 가장 먼저 하는 것은 부모나 보호자의 승인을 받는 것이다.", "④ 평가의 객관성을 위해 집단평가는 심리검사 등을 통한 수치화된 정보로만 이루어져야 한다.", "⑤ 집단 진행을 효율적으로 하기 위해 집단의 규모, 장소, 모임 시간과 빈도 등에 대해 구체적으로 계획한다."], "answer": 4, "expl": "집단 규모, 장소, 시간, 빈도를 구체적으로 계획하는 것이 효율적 진행에 필요하다. 계획서는 사전검사 전에 작성하고(①), 활동은 적정량으로(②), 요구 파악이 먼저이며(③), 평가는 질적 자료도 활용한다(④)."}, {"no": "15-36", "year": 2016, "exam": "2016-2", "qno": 11, "text": "다음의 집단상담 기법에 관한 설명으로 옳은 것은?\n- \"철수가 방금 한 말은 윤지가 지난주에 했던 말처럼 들리네.\"\n- \"은지가 엄마 잔소리 때문에 갈등이 있는 것처럼 석희가 아버지와 갈등을 겪는 것도 아버지 잔소리 때문이구나.\" ", "options": ["① 개인상담과 집단상담에서 모두 자주 사용한다.", "② 집단원 간의 차이점을 드러낼 때 사용한다.", "③ 집단의 상호작용과 응집력을 증가시키는 효과가 있다.", "④ 모호하거나 모순된 진술을 드러내는 직면 효과가 있다.", "⑤ 현상이나 문제에 대한 상담자의 관점이나 의견을 드러낸다."], "answer": 2, "expl": "집단원의 말과 경험을 서로 이어주는 연결하기로, 상호작용과 응집력을 높인다. 개인상담에선 쓰기 어렵고, 차이점보다 공통점을 드러낸다."}, {"no": "15-37", "year": 2016, "exam": "2016-2", "qno": 12, "text": "효율적이고 현장 적용성이 높은 청소년 집단상담의 특성으로 옳은 것을 모두 고른 것은?\nㄱ. 행동중심 활동의 활용\nㄴ. 발달단계에 적합한 관심과 욕구 다루기\nㄷ. 청소년 자율성을 존중한 비구조화 집단 활용\nㄹ. 특정 문제나 주제를 공유하는 대상으로 집단 구성", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄴ, ㄹ", "③ ㄱ, ㄷ, ㄹ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 1, "expl": "행동중심 활동(ㄱ), 발달단계에 맞는 관심 다루기(ㄴ), 공통 주제를 가진 대상 구성(ㄹ)이 효율적이다. 청소년에게는 비구조화보다 구조화 집단이 더 현장 적용성이 높다(ㄷ)."}, {"no": "15-38", "year": 2016, "exam": "2016-2", "qno": 13, "text": "집단 상담에서 침묵 상황에 대한 효과적 개입으로 옳지 않은 것은?", "options": ["① 회기 초기에 오랜 침묵을 허용하는 것은 지도력 발휘가 안된 것이다.", "② 생산적으로 여겨지는 침묵 상황에서 말하려는 집단원에게 기다리라고 제지할 수 있다.", "③ 말하고 싶으나 기회를 잡지 못하는 집단원에게 말할 기회를 준다.", "④ 짝지어 말하기나 돌아가면서 말하기 등의 구조화 개입으로 침묵하는 집단원의 참여를 이끈다.", "⑤ 대리학습이나 경험이 되므로 침묵하는 집단원이 집단 내내 말하지 않더라도 그대로 놔둔다."], "answer": 4, "expl": "침묵하는 집단원이 집단 내내 말하지 않도록 그대로 두는 것은 참여를 포기하는 것이다. 비언어적 단서 언급, 구조화된 활동 등으로 참여를 이끌어야 한다."}, {"no": "15-39", "year": 2016, "exam": "2016-2", "qno": 14, "text": "게슈탈트 집단상담에서 다루는 저항의 유형과 표현 양상의 연결이 옳지 않은 것은?", "options": ["① 융합(confluence): 자신의 의견을 말하거나 자신을 표현하는 것을 어려워한다.", "② 반전(retroflection): 집단 초기 정서 표현이나 참여를 주저한다.", "③ 내사(introjection): 상담자 개입이나 규칙에 의문을 제기하지 않는다.", "④ 투사(projection): 집단 통제 경향을 보이는 집단원이 자신이 아니라 다른 집단원이 그렇다고 주장한다.", "⑤ 편향(deflection): 다른 집단원이 자신과 동일한 생각과 감정을 경험한다고 생각하며, 특정 집단원을 향한 강한 정서를 경험한다."], "answer": 4, "expl": "편향은 유머, 화제 전환, 질문 등으로 접촉을 피하는 것이다. 다른 사람이 나와 같은 생각·감정을 가진다고 여기는 것은 융합에 가깝다."}, {"no": "15-40", "year": 2016, "exam": "2016-2", "qno": 15, "text": "현실치료 집단상담에 관한 설명으로 옳은 것은?", "options": ["① 집단원의 바람이나 욕구 달성에서 3R은 책임감(Responsibility), 현실성(Reality), 합리성(Rationality)을 뜻한다.", "② 전 행동(total behavior) 변화는 사고-감정-생리-행동 순으로 개입할 때 용이하다.", "③ 지각이 행동을 통제한다는 통제이론에 기초한다.", "④ 역설적 기법을 통해 집단원은 행동에 대한 통제와 선택 가능성을 자각할 수 있다.", "⑤ 집단원의 현재 행동에 대한 논의를 장려하고, 비효과적 행동의 해명 기회를 제공한다."], "answer": 3, "expl": "역설적 기법은 문제 행동을 의도적으로 해보게 해 행동을 통제하고 선택할 수 있음을 자각시킨다. 3R은 책임·현실·옳고 그름(Right)이고(①), 행동·사고가 더 통제하기 쉬우며(②), 선택이론은 행동이 지각을 통제한다고 보고(③), 변명은 받아들이지 않는다(⑤)."}, {"no": "15-41", "year": 2016, "exam": "2016-2", "qno": 16, "text": "효율적인 집단 구성에 관한 설명으로 옳지 않은 것은?", "options": ["① 심리치료집단은 성격 구조 재구성이 목적이므로 상이한 진단을 받은 이질집단 구성이 유용하다.", "② 심리교육집단은 특정 주제에 초점을 둔 구조화된 집단으로 진행할 때 유용하다.", "③ 성장집단은 성장 지향이 목적이므로 이질집단 구성과 비구조화된 회기가 유용하다.", "④ 지지집단은 정서적 지지가 목적이므로 동질집단 구성이 유용하다.", "⑤ 자조집단은 상호 지지가 목적이므로 특정 주제를 가진 동질집단 구성이 유용하다."], "answer": 0, "expl": "심리치료집단도 비슷한 문제를 가진 사람들끼리 구성하는 것이 효과적이며, 상이한 진단의 이질집단이 유용하다는 일반화는 옳지 않다."}, {"no": "15-42", "year": 2016, "exam": "2016-2", "qno": 17, "text": "집단상담 초기 단계에서 집단상담자의 역할로 옳은 것을 모두 고른 것은?\nㄱ. 집단의 기본 규칙과 규범을 설정한다.\nㄴ. 집단의 역할 모델이 될 필요가 있다.\nㄷ. 집단원의 불안과 두려움 경감을 위해 구조화된 활동을 제공할 수 있다.\nㄹ. 목표 설정에서 집단원의 숨겨진 목표를 다루는 것은 저항을 유발하므로 다루지 않는다.", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄷ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 2, "expl": "초기에는 규칙과 규범 설정(ㄱ), 역할 모델(ㄴ), 불안 경감을 위한 구조화 활동(ㄷ)이 필요하다. 숨겨진 목표도 다뤄야 집단원이 진짜 목표에 접근할 수 있다(ㄹ)."}, {"no": "15-43", "year": 2016, "exam": "2016-2", "qno": 18, "text": "중도 탈락 집단원이 발생하는 경우 개입으로 옳지 않은 것은?", "options": ["① 떠나려는 집단원에게 남으라는 압박이 가해질 경우, 이를 저지한다.", "② 법정 명령으로 참여한 경우 그만두는 결정에 따른 결과와 후속 조치에 대해 설명한다.", "③ 그만두는 이유를 묻는 것은 압력이 될 수 있으므로 지양한다.", "④ 남겨진 집단원들이 경험할 수 있는 사고와 감정을 탐색한다.", "⑤ 떠나려는 의사를 존중하면서 신중히 고려할 시간을 갖도록 권유한다."], "answer": 2, "expl": "그만두려는 이유를 묻고 함께 탐색하는 것은 존중과 이해의 과정이다. 이유를 묻는 것 자체를 지양하라는 ③이 틀리다."}, {"no": "15-44", "year": 2016, "exam": "2016-2", "qno": 19, "text": "청소년 집단상담에 관한 설명으로 옳지 않은 것은?", "options": ["① 청소년 언어와 문화에 대한 이해와 감수성이 필요하다.", "② 상담자의 사생활 관련 질문을 할 경우 집단 규칙을 벗어나므로 주의를 준다.", "③ 비자발적으로 참여한 경우 개별 면담을 통해 참여에 대한 감정이나 생각을 탐색한다.", "④ 집단원들이 회기 밖에서 관계를 맺는 것이 집단 역동에 미치는 영향에 대해 논의한다.", "⑤ 비협조적인 경우 과거 상담 경험 등을 탐색한다."], "answer": 1, "expl": "청소년이 상담자의 사생활을 묻는 것은 관계를 탐색하는 자연스러운 행동일 수 있으므로 규칙 위반으로 주의를 주기보다 그 의도를 다루는 것이 바람직하다."}, {"no": "15-45", "year": 2016, "exam": "2016-2", "qno": 20, "text": "집단상담에서 효과적이지 않은 집단원의 행동을 모두 고른 것은?\nㄱ. 충고하기\nㄴ. 참여 독점하기\nㄷ. 구원자 자처하기\nㄹ. 다른 집단원의 기분 맞추기", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄹ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 4, "expl": "충고하기, 참여 독점하기, 구원자 자처하기, 다른 집단원 기분 맞추기는 모두 집단 작업을 방해하는 비효과적 행동이다."}, {"no": "15-46", "year": 2016, "exam": "2016-2", "qno": 21, "text": "집단상담의 작업단계에 관한 설명으로 옳지 않은 것은?", "options": ["① 자발적 자기개방이 증가한다.", "② 집단원의 불안이 감소하면서 비방어적으로 상호작용하므로 갈등은 나타나지 않는다.", "③ 지금-여기에 초점을 두고 원활하게 소통이 이루어진다.", "④ 집단 신뢰와 결속력이 높아져 실험적 행동도 시도한다.", "⑤ 상담자에 대한 전이로 인해 집단원의 도전 행동이 나타날 수 있다."], "answer": 1, "expl": "작업단계에서도 갈등은 나타날 수 있으며, 높은 신뢰 속에서 갈등을 솔직하게 다룰 수 있다는 점이 특징이다. 갈등이 나타나지 않는다는 ②가 틀리다."}, {"no": "15-47", "year": 2016, "exam": "2016-2", "qno": 22, "text": "종결단계에서 이루어지는 상담자 피드백으로 유용하지 않은 것을 모두 고른 것은?\nㄱ. \"진영 씨는 정말 괜찮은 사람이에요.\"\nㄴ. \"앞으로 성현 씨가 하시는 모든 일이 잘 될 거예요.\"\nㄷ. \"미영 씨의 솔직한 피드백은 다른 사람에겐 상처가 될 수 있으니 하지 않는 게 좋겠어요.\"\nㄹ. \"소영 씨가 모든 걸 견뎌내는 점이 대단하면서도, 너무 참아서 가까운 사람과 어려움을 겪는 건 아닐까 싶어요.\" ", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄷ, ㄹ", "④ ㄱ, ㄴ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 3, "expl": "막연한 칭찬(ㄱ), 근거 없는 낙관(ㄴ), 솔직한 피드백 억제(ㄷ)는 유용하지 않다. ㄹ은 강점과 성장 과제를 구체적으로 함께 전한 유용한 피드백이다."}, {"no": "15-48", "year": 2016, "exam": "2016-2", "qno": 23, "text": "집단상담에서 비밀유지에 관한 설명으로 옳은 것은?", "options": ["① 비밀유지 한계를 공지하여 집단원이 자기 개방 수위를 결정하게 한다.", "② 자신의 집단 경험을 집단 밖에서 공유하는 과정에서 다른 집단원이 말한 내용을 노출하는 것은 허용된다.", "③ 집단 작업에 비밀유지가 필수이므로 어떤 경우라도 집단 내용이 외부로 노출되어서는 안 된다.", "④ 미성년자의 경우 부모와의 협력이 중요하므로, 작업 내용을 부모와 정기적으로 공유한다.", "⑤ 집단원의 비밀유지 의무는 강제할 수 없으므로, 상담자에게만 적용된다."], "answer": 0, "expl": "비밀유지의 한계를 미리 알려 집단원이 개방 수준을 스스로 결정하게 하는 것이 옳다. 다른 사람 내용 노출(②), 절대적 비밀(③), 부모와 정기 공유(④), 집단원 의무 면제(⑤)는 틀리다."}, {"no": "15-49", "year": 2016, "exam": "2016-2", "qno": 24, "text": "종결단계의 집단상담자 과제에 관한 설명으로 옳지 않은 것은?", "options": ["① 종결에 대한 감정을 탐색하고 다룬다.", "② 종결 시점을 알리며 마무리 못한 과제를 다룰 기회를 준다.", "③ 집단원의 달성하지 못한 목표에 대한 언급은 실패감을 줄 수 있으므로 지양한다.", "④ 집단에서 배운 내용을 일상생활에 적용하도록 돕는다.", "⑤ 필요시 상담 종결 후 추수 모임을 제공한다."], "answer": 2, "expl": "종결단계에서는 달성하지 못한 목표도 함께 점검하고 앞으로의 과제로 연결해야 한다. 실패감을 이유로 언급을 피하는 ③은 틀리다."}, {"no": "15-50", "year": 2016, "exam": "2016-2", "qno": 25, "text": "아들러(A. Adler)의 개인심리 집단상담에 관한 설명으로 옳지 않은 것을 모두 고른 것은?\nㄱ. 집단원의 사회적 상황과 사회에 대한 태도를 파악한다.\nㄴ. 인간을 사회결정적 존재로 보고, 사회적으로 유용한 생활양식 형성을 촉진한다.\nㄷ. 열등감의 근원 혹은 관리 전략 탐색보다 우월성 추구 목표에 초점을 두어 개입한다.\nㄹ. 사회적 관심이 집단 작업에 중요하므로, 자기중심성과 소외감이 높은 개인은 집단보다 개인상담을 권유한다.", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄹ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 3, "expl": "사회적 상황 파악(ㄱ)은 옳다. 아들러는 인간을 사회적·목적론적 존재로 보지만 사회결정론자가 아니며(ㄴ), 열등감 탐색을 중시하고(ㄷ), 자기중심적이고 소외된 사람도 집단을 통해 사회적 관심을 키울 수 있다고 본다(ㄹ)."}, {"no": "14-31", "year": 2016, "exam": "2016-1", "qno": 1, "text": "집단유형과 특성에 관한 설명으로 옳지 않은 것은?", "options": ["① 집단지도는 정보제공 및 전달을 목적으로 한다.", "② 집단상담은 완벽한 사회장면을 제공함으로써 대인관계 기술을 습득하도록 한다.", "③ 집단상담은 개인의 성장과 변화를 목적으로 한다.", "④ 집단치료는 심각한 신경증적 갈등을 경험하는 집단원을 주요 대상으로 한다.", "⑤ 집단상담은 집단원 간의 상호작용을 통해 집단원의 감정 및 행동양식을 탐색한다."], "answer": 1, "expl": "집단상담은 현실과 유사한 '축소된 사회'를 제공하는 것이지 완벽한 사회장면을 제공하는 것은 아니다. ②가 틀리다."}, {"no": "14-32", "year": 2016, "exam": "2016-1", "qno": 2, "text": "개인상담과 비교하여 집단상담이 더 적합한 경우를 모두 고른 것은?\nㄱ. 문제가 위급하고 원인과 해결방법이 복잡한 경우\nㄴ. 타인에 대한 배려와 존중하는 태도를 습득할 필요가 있는 경우\nㄷ. 자기의 관심사나 문제에 관해 다른 사람들의 반응과 조언이 필요한 경우\nㄹ. 타인의 주목과 인정을 강박적으로 요구하는 경우", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄷ", "③ ㄴ, ㄷ", "④ ㄴ, ㄹ", "⑤ ㄷ, ㄹ"], "answer": 2, "expl": "배려·존중하는 태도 습득(ㄴ)과 타인의 반응·조언이 필요한 경우(ㄷ)는 집단상담이 더 적합하다. 위급하고 복잡한 문제(ㄱ)와 주목·인정을 강박적으로 요구하는 경우(ㄹ)는 개인상담이 더 적합하다."}, {"no": "14-33", "year": 2016, "exam": "2016-1", "qno": 3, "text": "집단응집력에 관한 설명으로 옳지 않은 것은?", "options": ["① 의사소통의 양과 질에 영향을 미친다.", "② 집단만족도에 영향을 미친다.", "③ 집단원의 참석률에 영향을 미친다.", "④ 집단의 지지와 수용이 집단응집력에 영향을 미친다.", "⑤ 집단원 간의 부정적 감정표현은 응집력과는 관계가 없다."], "answer": 4, "expl": "부정적 감정을 안전하게 표현하고 다룰 수 있다는 것도 응집력과 깊은 관련이 있다. 관계가 없다는 ⑤가 틀리다."}, {"no": "14-34", "year": 2016, "exam": "2016-1", "qno": 4, "text": "정화(카타르시스)에 관한 설명으로 옳지 않은 것은?", "options": ["① 감정표출과 관련된 감정을 다룬다.", "② 감정표출 후 관련된 인지를 다룬다.", "③ 감정표출은 신체적 증상으로 나타날 수 있다.", "④ 감정표출의 치료적 효과는 집단원의 문화적 배경에 따라 다르다.", "⑤ 집단에서의 감정표출 경험을 일상생활에서 그대로 적용해 보도록 권유한다."], "answer": 4, "expl": "집단에서의 감정표출은 안전한 환경에서 가능했던 것이므로 일상에 그대로 옮기면 오해와 갈등이 생길 수 있다. 상황에 맞게 적용하도록 도와야 한다."}, {"no": "14-35", "year": 2016, "exam": "2016-1", "qno": 5, "text": "집단상담자의 초기단계 과제에 관한 설명으로 옳지 않은 것은?", "options": ["① 집단구조화가 필요할 경우 집단원에게 집단목표와 진행절차를 설명한다.", "② 집단원이 개인적 목표를 설정하도록 협력하여 돕는다.", "③ 집단 참여에 대한 불안과 두려움을 수용하고 공감한다.", "④ 집단원과 갈등하는 사람의 특성에 대해 집단원이 자세히 이야기하도록 한다.", "⑤ 집단상담자는 집단규범을 명시적 혹은 암시적으로 제시한다."], "answer": 3, "expl": "초기단계에서는 지금-여기 집단 안에서의 감정에 초점을 둔다. 집단 밖 갈등 대상의 특성을 자세히 이야기하게 하는 것은 거기-그때로 초점을 흐린다."}, {"no": "14-36", "year": 2016, "exam": "2016-1", "qno": 6, "text": "집단상담의 종결단계에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 집단상담에서의 변화를 집단 밖 환경에 적용할 수 있도록 구체적인 행동계획을 발전시킨다.\nㄴ. 집단 이후에도 집단원들과 계속 만남을 유지하도록 하여 분리 감정을 느끼지 않도록 배려한다.\nㄷ. 집단 경험을 되돌아보는 것은 집단상담에서의 '지금-여기'를 강조하는 것과 맞지 않으므로 피한다.\nㄹ. 미해결된 문제에 대한 감정을 표현한다.", "options": ["① ㄱ, ㄷ", "② ㄱ, ㄹ", "③ ㄴ, ㄷ", "④ ㄴ, ㄹ", "⑤ ㄷ, ㄹ"], "answer": 1, "expl": "변화를 일상에 적용하는 행동계획(ㄱ)과 미해결 문제에 대한 감정 표현(ㄹ)은 종결단계 과제다. 분리 감정은 피하지 말고 다뤄야 하며(ㄴ), 집단 경험을 돌아보는 것은 종결의 핵심이다(ㄷ)."}, {"no": "14-37", "year": 2016, "exam": "2016-1", "qno": 7, "text": "작업단계에서 치료적 요소를 촉진하기 위한 방법으로 옳지 않은 것은?", "options": ["① 침묵에 대한 무조건적 수용", "② 집단원의 새로운 행동에 대한 수용", "③ 낙담한 집단원에 대한 격려", "④ 집단상담자의 자기개방에 대한 모델링", "⑤ 집단원의 모순적 행동에 대한 직면"], "answer": 0, "expl": "작업단계에서도 침묵의 의미는 탐색해야 하며, 무조건적으로 수용하는 것은 치료적 요소 촉진 방법이 아니다."}, {"no": "14-38", "year": 2016, "exam": "2016-1", "qno": 8, "text": "정신분석적 집단상담에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 집단원의 성장과 발달을 저해하는 신경증적 갈등을 경감시켜서 집단원의 인격적 성숙을 도모한다.\nㄴ. 집단원이 집단상담자를 아버지 혹은 어머니로 보고 부정적 감정을 나타내지 않도록 라포(rapport) 형성에 주력한다.\nㄷ. 집단원의 의사소통이나 상호작용이 한 영역에 고착되었을 때 이를 확장시키기 위하여 의식적 자아와 무의식적 자아를 관련짓는 역할을 한다.\nㄹ. 집단원의 자유연상이 논리적 맥락에서 벗어나지 않도록 한다.", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄷ", "③ ㄴ, ㄷ", "④ ㄴ, ㄹ", "⑤ ㄷ, ㄹ"], "answer": 1, "expl": "신경증적 갈등을 경감해 인격적 성숙을 돕고(ㄱ), 고착된 의사소통을 의식-무의식의 연결로 확장한다(ㄷ). 전이 감정은 표현하게 하여 분석하며(ㄴ), 자유연상은 논리적 맥락에 얽매이지 않게 한다(ㄹ)."}, {"no": "14-39", "year": 2016, "exam": "2016-1", "qno": 9, "text": "로저스(C. Rogers)의 인간중심 집단에서 치료적 요소에 관한 설명으로 옳지 않은 것은?", "options": ["① 잠재력에 대한 신뢰", "② 수용적 분위기 형성", "③ 주관적 경험세계에 대한 민감성", "④ 자신의 감정이나 태도에 대한 진솔함", "⑤ 자기비밀에 대한 무조건적 개방"], "answer": 4, "expl": "로저스는 자기개방을 존중하지만 비밀을 무조건적으로 개방할 것을 요구하지 않는다. 개방 여부와 수준은 집단원의 선택이다."}, {"no": "14-40", "year": 2016, "exam": "2016-1", "qno": 10, "text": "행동주의 집단상담에 관한 설명으로 옳은 것은?", "options": ["① 바람직한 행동 습득을 위해 역할연습과 숙제를 활용한다.", "② 초기에 추상적인 삶의 가치를 포함하는 내용으로 행동계약한다.", "③ 목표하는 행동을 단번에 강화함으로써 행동을 조형(shaping)한다.", "④ 문제행동 분석 및 관리에 초점을 두며 상담관계 형성을 중요하게 생각하지 않는다.", "⑤ 집단원이 집단규범을 스스로 깨닫도록 조력한다."], "answer": 0, "expl": "행동주의는 바람직한 행동 습득을 위해 역할연습과 숙제를 활용한다. 계약은 구체적 행동으로(②), 조형은 단계적으로(③), 상담관계도 중시하며(④), 규범은 상담자가 직접 제시·강화한다(⑤)."}, {"no": "14-41", "year": 2016, "exam": "2016-1", "qno": 11, "text": "합리적 정서행동(REBT) 집단상담에 관한 설명으로 옳지 않은 것은?", "options": ["① 집단원의 부정적 행동을 유발시킨 사건에 대해 체계적으로 분석하고 변화시킨다.", "② 역할연습과 자기주장과 같은 기법을 사용하고 이를 숙제로 내준다.", "③ 집단원의 대화 중에서 당위적 언어를 찾아내도록 하여 비합리적 생각과 합리적 생각을 구별하도록 가르친다.", "④ 집단원의 비합리적 신념을 능동적이고 지시적으로 도전하여 논박한다.", "⑤ 두려움 때문에 하지 못하던 행동을 해봄으로써 자신의 생각이 비합리적이었음을 깨닫도록 한다."], "answer": 0, "expl": "REBT는 사건(A)이 아니라 그 사건에 대한 비합리적 신념(B)을 분석하고 논박한다. 사건을 분석해 변화시킨다는 ①이 틀리다."}, {"no": "14-42", "year": 2016, "exam": "2016-1", "qno": 12, "text": "교류분석 집단상담에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 자아상태 오염을 제거하도록 노력한다.\nㄴ. 생활 장면의 요구에 따라 모든 자아상태를 고르게 활용할 수 있는 능력을 개발한다.\nㄷ. 부적절한 생활각본(life script)을 버리고 생산적인 생활각본을 지니도록 돕는다.\nㄹ. 구체적인 목표를 계약형태로 문서화한다.", "options": ["① ㄱ", "② ㄱ, ㄷ", "③ ㄴ, ㄹ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 4, "expl": "자아상태 오염 제거(ㄱ), 모든 자아상태의 유연한 활용(ㄴ), 생산적 생활각본으로의 재결단(ㄷ), 계약의 문서화(ㄹ) 모두 교류분석 집단상담의 내용이다."}, {"no": "14-43", "year": 2016, "exam": "2016-1", "qno": 13, "text": "게슈탈트 집단상담에 관한 설명으로 옳지 않은 것은?", "options": ["① 인간생활을 형태의 점진적 형성과 소멸의 과정으로 본다.", "② 집단원의 행동을 다른 사람과의 상호작용의 결과로 보고 다른 집단원의 행동을 모델로 삼아 변화하도록 한다.", "③ 집단 내에서의 활동과 상호작용이 집단상담자에 의해 주도적으로 진행된다.", "④ 지금-여기, 접촉 등이 주요 개념이다.", "⑤ 뜨거운 자리, 순회하기 등의 기법을 사용한다."], "answer": 1, "expl": "게슈탈트는 다른 집단원을 모델로 삼아 행동을 바꾸게 하는 접근이 아니라, 자신의 지금-여기 경험을 알아차리도록 돕는다. 모델링은 행동주의적 요소다."}, {"no": "14-44", "year": 2016, "exam": "2016-1", "qno": 14, "text": "현실치료 집단상담에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 집단원은 특정한 욕구의 충족을 위해 환경을 통제할 수 있다.\nㄴ. 객관적인 사실보다 욕구의 맥락에서 세계를 지각하는 것에 초점을 둔다.\nㄷ. 집단원이 경험하는 정서는 외부에 의해 통제되는 것이 아니라 스스로의 선택에 의한 것이다.\nㄹ. 인간에 대한 결정론적인 입장을 취한다.", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄹ", "③ ㄷ, ㄹ", "④ ㄱ, ㄴ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 3, "expl": "현실치료는 환경 통제를 통한 욕구 충족(ㄱ), 욕구 맥락에서의 지각(ㄴ), 정서도 선택이라는 관점(ㄷ)을 가진다. 선택이론은 결정론이 아니라 인간의 선택과 책임을 강조한다(ㄹ)."}, {"no": "14-45", "year": 2016, "exam": "2016-1", "qno": 15, "text": "다음 설명에 해당하는 집단상담 이론은?\n- 집단원을 사회적, 목적 지향적 존재로 본다.\n- 집단상담자의 주요역할은 집단원에게 용기를 주는 것이다.\n- 사회적 관심과 생활양식을 다룬다.", "options": ["① 실존주의 집단상담", "② 게슈탈트 집단상담", "③ 교류분석 집단상담", "④ 인간중심 집단상담", "⑤ 개인심리학 집단상담"], "answer": 4, "expl": "사회적·목적지향적 인간관, 격려(용기 주기), 사회적 관심과 생활양식은 아들러 개인심리학 집단상담의 특징이다."}, {"no": "14-46", "year": 2016, "exam": "2016-1", "qno": 16, "text": "집단상담자의 태도 및 자질에 관한 설명으로 옳지 않은 것은?", "options": ["① 자신의 강점과 약점에 대해 수용한다.", "② 집단원의 복지에 대해 관심을 갖는다.", "③ 심리적 에너지를 보충하기 위해 노력한다.", "④ 검증되지 않은 기법과 운영방식을 집단에서 실험한다.", "⑤ 집단원의 다양한 문화적 가치에 대해 수용적 태도를 취한다."], "answer": 3, "expl": "검증되지 않은 기법을 집단원에게 실험하는 것은 윤리적으로 문제가 된다. 훈련받고 검증된 방법을 사용해야 한다."}, {"no": "14-47", "year": 2016, "exam": "2016-1", "qno": 17, "text": "집단상담자의 기술 적용에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 집단상담자의 비언어적 메시지는 신뢰로운 분위기를 방해하므로 피한다.\nㄴ. 집단원에 대한 충분한 이해를 바탕으로 심층적 공감 반응을 한다.\nㄷ. 집단상담자가 집단과정 중에 자기개방을 하는 것은 스트레스를 해소할 수 있으므로 유익하다.\nㄹ. 집단원의 준비도를 고려하여 직면한다.", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄷ", "③ ㄴ, ㄷ", "④ ㄴ, ㄹ", "⑤ ㄱ, ㄴ, ㄹ"], "answer": 3, "expl": "심층적 공감(ㄴ)과 준비도를 고려한 직면(ㄹ)은 옳다. 비언어적 메시지는 신뢰 형성에 중요하며(ㄱ), 자기개방은 상담자 스트레스 해소가 아니라 집단원을 위해 해야 한다(ㄷ)."}, {"no": "14-48", "year": 2016, "exam": "2016-1", "qno": 18, "text": "다음 설명에 해당하는 기법은?\n- 공통의 관심사를 공유함으로써 집단응집력을 촉진한다.\n- 연계성에 주목하며 집단원 간의 상호작용을 촉진한다.\n- 집단원의 말과 행동을 다른 집단원의 관심사나 공통점과 관련짓는다.", "options": ["① 해석하기", "② 연결하기", "③ 반영하기", "④ 명료화하기", "⑤ 재구조화하기"], "answer": 1, "expl": "집단원의 말과 행동을 다른 집단원의 관심사·공통점과 이어 상호작용과 응집력을 촉진하는 것은 연결하기다."}, {"no": "14-49", "year": 2016, "exam": "2016-1", "qno": 19, "text": "다음 사례에서 적용한 상담기법은?\n햇살: 집단의 친구들이 나를 좋아하지 않는 것 같아요. 나는 친하게 지내고 싶은데 다가갈 수가 없었어요. 그래서 집단에서 혼자인 것 같은 기분이 들어요.\n집단상담자: 너는 친구와 친하게 지내고 싶다고 하는데 오늘 집단에서 달님과 별님이 다가갔을 때 너는 적극적으로 다가가지 않고 달님과 별님을 피하는 행동을 하더구나.", "options": ["① 해석하기", "② 직면하기", "③ 반영하기", "④ 명료화하기", "⑤ 역전이 현상다루기"], "answer": 1, "expl": "친하게 지내고 싶다는 말과 실제로 다가온 친구를 피하는 행동 사이의 불일치를 짚어주고 있으므로 직면하기다."}, {"no": "14-50", "year": 2016, "exam": "2016-1", "qno": 20, "text": "청소년 집단상담을 준비할 때 고려사항으로 옳은 것은?", "options": ["① 초등학생인 경우 한 회기에 90분 이상 진행될 수 있도록 준비한다.", "② 고등학생 집단상담을 할 때 집단원의 참여 동기와 욕구에 대한 조사보다는 보호자의 기대에 대한 조사를 우선해야 한다.", "③ 집단상담 진행과 관련한 상담자의 정보를 제공하여야 한다.", "④ 집단원간 친밀감 형성을 위해 사전면접은 집단으로 실시하여야만 한다.", "⑤ 심각한 정서장애를 가진 학생을 집단상담에 참여하도록 권유한다."], "answer": 2, "expl": "집단상담 진행과 관련된 상담자의 정보(자격, 이론적 배경 등)는 제공해야 한다. 초등학생은 짧은 회기(①), 집단원 요구 우선(②), 사전면접은 개별로도 가능(④), 심각한 정서장애는 개별치료 우선(⑤)이다."}, {"no": "14-51", "year": 2016, "exam": "2016-1", "qno": 21, "text": "침묵에 대한 집단상담자의 대처 행동으로 옳지 않은 것은?", "options": ["① 집단원이 내면화 작업으로 침묵한다면, 적극적인 참여를 요구하기보다는 집단 중에 함께 나누고 싶은 마음을 전한다.", "② 회기 초기에 비생산적일 수 있다고 생각되는 침묵이 지속되면 집단상담자는 집단원의 적극적인 반응을 유도하여야 한다.", "③ 침묵의 의미가 무엇인지 탐색해 볼 수 있는 기회를 제공한다.", "④ 매회기마다 활동을 사용하여 침묵이 발생하지 않도록 한다.", "⑤ 집단원이 집단에 대한 신뢰감이 생기지 않아 침묵하는 경우, 자발적으로 참여할 때까지 기다린다."], "answer": 3, "expl": "매 회기 활동으로 침묵 자체를 막는 것은 침묵이 가진 의미를 다룰 기회를 없앤다. 침묵도 집단 과정의 일부로 다뤄야 한다."}, {"no": "14-52", "year": 2016, "exam": "2016-1", "qno": 22, "text": "문제 상황에 대한 집단상담자의 대처행동으로 옳지 않은 것은?", "options": ["① 충고하는 집단원에게 자신의 충고행동 동기를 탐색해 보게 한다.", "② 자신의 이야기를 사실 중심으로 하면 그 사실과 관련된 자신의 감정을 표현하도록 한다.", "③ 주지화의 내용은 정서적인 면과 연결짓지 않는다.", "④ 독점하는 집단원에게 자신의 모습을 볼 수 있도록 피드백 한다.", "⑤ 상처 싸매기를 하는 집단원에게는 미해결 감정이 있는지 살펴보게 한다."], "answer": 2, "expl": "주지화하는 집단원은 이야기의 정서적인 면과 연결하도록 도와야 한다. 정서와 연결 짓지 않는다는 ③이 틀리다."}, {"no": "14-53", "year": 2016, "exam": "2016-1", "qno": 23, "text": "집단원의 권리로 옳지 않은 것은?", "options": ["① 집단에 참여할 권리", "② 집단을 이탈할 권리", "③ 솔직하게 개방할 권리", "④ 개인정보를 보호받을 권리", "⑤ 집단에 관한 정보를 안내 받을 권리"], "answer": 2, "expl": "집단원에게는 개방하지 않을 권리가 있으며, 솔직하게 개방하는 것은 권리라기보다 자발적 선택이다. 개방을 강요받지 않을 권리가 보장되어야 한다."}, {"no": "14-54", "year": 2016, "exam": "2016-1", "qno": 24, "text": "청소년의 특성을 고려한 집단상담으로 옳지 않은 것은?", "options": ["① 청소년들은 모호한 집단상황에 부담을 느끼므로 회기 내용을 구체화하여 진행하는 것이 좋다.", "② 청소년은 또래의 영향을 많이 받기 때문에 집단원의 피드백을 적극 활용한다.", "③ 개방적 집단의 경우 응집성 형성과 발달에 유익하다.", "④ 일반적으로 구조적 집단상담은 역동적인 활동을 많이 하므로 활동적인 청소년에게 좋다.", "⑤ 진로와 학습을 주제로 하는 집단상담에서는 교육이나 지도 형태로 진행하는 것이 좋다."], "answer": 2, "expl": "개방집단은 구성원이 계속 바뀌어 응집성 형성과 발달에 불리하다. 응집성에 유익한 것은 폐쇄집단이다."}, {"no": "14-55", "year": 2016, "exam": "2016-1", "qno": 25, "text": "집단상담을 평가하는 방법을 모두 고른 것은?\nㄱ. 관찰\nㄴ. 집단 내 공개토의\nㄷ. 측정도구 사용\nㄹ. 면접", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄱ, ㄷ, ㄹ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 4, "expl": "관찰, 집단 내 공개토의, 측정도구, 면접 모두 집단상담 평가 방법이다."}, {"no": "14-56", "year": 2016, "exam": "2016-1", "qno": 26, "text": "청소년 집단상담에 관한 내용으로 옳지 않은 것은?", "options": ["① 게임이나 활동을 가능한 활용하지 않는다.", "② 남성과 여성의 공동상담자 형태는 집단원에게 성역할 모델을 제공한다.", "③ 비자발적인 집단원은 집단에 대한 불편감을 가지고 있으므로 그 감정을 나눌 수 있는 기회를 갖도록 돕는다.", "④ 연령이 낮을수록 부모나 보호자에게 집단의 목적과 진행과정, 절차 등에 대해 알려 주어야 한다.", "⑤ 일반적으로 청소년 집단상담은 성인 집단상담에 비해 집단상담자의 적극적인 역할과 자세가 요구된다."], "answer": 0, "expl": "청소년 집단상담에서는 흥미와 참여를 위해 게임과 활동을 적극 활용한다. 가능한 활용하지 않는다는 ①이 틀리다."}, {"no": "14-57", "year": 2016, "exam": "2016-1", "qno": 27, "text": "청소년 집단상담의 특징으로 옳은 것을 모두 고른 것은?\nㄱ. 비구조화 형태보다 구조화 혹은 반구조화 형태를 더 많이 활용한다.\nㄴ. 청소년은 일방적인 지시에 거부감을 가지므로 직면보다는 공감적 이해와 수용, 지지를 많이 하는 것이 더 효과적이다.\nㄷ. 여러 회기의 내용을 장시간 집중적으로 진행하는 것이 효과적이다.\nㄹ. 비자발적인 청소년을 대상으로 집단상담을 할 때 집단상담자는 권위적인 태도로 진행하여야 한다.", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄷ", "④ ㄱ, ㄴ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 0, "expl": "구조화·반구조화 활용(ㄱ)과 공감·수용·지지 중심(ㄴ)은 옳다. 청소년은 집중 시간이 짧아 장시간 진행이 비효과적이며(ㄷ), 비자발적 청소년에게 권위적 태도는 저항을 키운다(ㄹ)."}, {"no": "14-58", "year": 2016, "exam": "2016-1", "qno": 28, "text": "집단상담자의 윤리적 지침으로 옳은 것은?", "options": ["① 동료의 부당한 압력도 치료적 요인이므로 압력이 일어나는 분위기를 허용한다.", "② 집단상담자는 기법 사용 훈련을 받지 않았어도 집단원에게 도움이 되는 기술이라면 적극 활용해야 한다.", "③ 특정 집단원의 욕구가 집단 내에서 충족될 수 없다면 집단원에게 다른 전문적 의뢰를 제안해야 한다.", "④ 집단원의 개인정보는 집단원이 공유할 수 있도록 제공해야 한다.", "⑤ 기관 의뢰 집단상담을 진행할 때, 집단 진행과 관련된 기관의 정책과 윤리지침을 집단원에게 알려서는 안 된다."], "answer": 2, "expl": "집단 안에서 충족되기 어려운 욕구를 가진 집단원에게는 다른 전문적 도움을 제안해야 한다. 부당한 압력 허용(①), 훈련 없는 기법(②), 개인정보 공유(④), 기관 정책 비고지(⑤)는 비윤리적이다."}, {"no": "14-59", "year": 2016, "exam": "2016-1", "qno": 29, "text": "집단상담자의 지도성에 관한 설명으로 옳지 않은 것은?", "options": ["① 집단원의 자율성에 대한 요구를 고려하여 집단을 운영한다.", "② 달성해야 할 과업이 많을 때 일반적으로 집단상담자의 주도성을 높이는 것이 좋다.", "③ 집단의 크기가 클 때 일반적으로 집단상담자의 주도성을 높이는 것이 좋다.", "④ 집단상담 기간이 짧을 때 일반적으로 집단상담자의 주도성을 높이는 것이 좋다.", "⑤ 집단상담자의 운영 방식에 대한 집단원의 불만은 집단과정 중에 다루지 않는다."], "answer": 4, "expl": "상담자의 운영 방식에 대한 불만도 집단 과정에서 다뤄야 할 중요한 자료다. 다루지 않는다는 ⑤가 틀리다."}, {"no": "14-60", "year": 2016, "exam": "2016-1", "qno": 30, "text": "피드백 기법을 사용할 때 효과적인 지침으로 옳지 않은 것은?", "options": ["① 집단원이 준비가 되었을 때 한다.", "② 변화 가능한 것에 대해 한다.", "③ 구체적으로 한다.", "④ 부정적인 행동에 대해서는 비판적으로 해야 한다.", "⑤ 집단원이 행동한 직후에 한다."], "answer": 3, "expl": "피드백은 비판이 아니라 구체적이고 기술적인 방식으로 해야 한다. 부정적 행동에 대해서도 비판적으로 하면 방어를 불러온다."}, {"no": "13-31", "year": 2015, "exam": "2015", "qno": 1, "text": "행동주의 집단상담 기법만을 모두 고른 것은?\nㄱ. 시범보이기\nㄴ. 자기주장훈련\nㄷ. 뜨거운 자리\nㄹ. 책임지기\nㅁ. 홍수법", "options": ["① ㄱ, ㄴ, ㄷ", "② ㄱ, ㄴ, ㅁ", "③ ㄱ, ㄷ, ㄹ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄴ, ㄹ, ㅁ"], "answer": 1, "expl": "시범보이기(모델링), 자기주장훈련, 홍수법은 행동주의 기법이다. 뜨거운 자리와 책임지기는 게슈탈트 기법이다."}, {"no": "13-32", "year": 2015, "exam": "2015", "qno": 2, "text": "컨버그(Kernberg)와 코헛(Kohut)이 경계선 성격장애나 자기애성 성격장애를 가진 사람들을 대상으로 집단상담의 기틀을 마련한 이론적 접근은?", "options": ["① 대상관계", "② 교류분석", "③ 행동주의", "④ 인본주의", "⑤ 실존주의"], "answer": 0, "expl": "컨버그와 코헛은 대상관계 이론과 자기심리학의 대표 학자로, 경계선·자기애성 성격장애를 가진 사람들을 위한 집단상담의 기틀을 마련했다."}, {"no": "13-33", "year": 2015, "exam": "2015", "qno": 3, "text": "로저스(Rogers)가 제안한 참만남 집단과정 15단계에 해당하는 것을 모두 고른 것은?\nㄱ. 긍정적 참회\nㄴ. 부정적 감정의 표현\nㄷ. 공감의 극대화\nㄹ. 가면의 파괴\nㅁ. 직면", "options": ["① ㄱ, ㄴ, ㄷ", "② ㄱ, ㄷ, ㄹ", "③ ㄴ, ㄷ, ㅁ", "④ ㄴ, ㄹ, ㅁ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 3, "expl": "부정적 감정의 표현, 가면의 파괴, 직면은 로저스의 참만남 집단 15단계에 포함된다. 긍정적 참회나 공감의 극대화는 15단계 항목이 아니다."}, {"no": "13-34", "year": 2015, "exam": "2015", "qno": 4, "text": "교류분석(TA) 집단상담에 관한 설명으로 옳지 않은 것은?", "options": ["① 게임분석은 게임에 나타나는 집단원의 강점을 위계별로 구분하도록 돕는다.", "② 구조분석은 문화적 적응을 돕는다.", "③ 생활각본은 생의 초기부터 외적 사건들에 대한 해석을 기초로 형성된다.", "④ 교류분석은 집단원이 독특한 존재로 자율성을 성취하도록 돕는다.", "⑤ 교류분석은 상호존중의 생활태도를 강조한다."], "answer": 0, "expl": "게임분석은 게임 속에 숨겨진 이면교류와 그로 인한 결과(라켓 감정 등)를 분석해 게임을 그만두도록 돕는 것이다. 강점을 위계별로 구분한다는 ①은 틀리다."}, {"no": "13-35", "year": 2015, "exam": "2015", "qno": 5, "text": "다음의 활동은 무엇을 위한 것인가?\n상담자: 상점에 들어가 본인의 문제들이 들어 있는 상자들을 상상하고, 열고 싶은 상자를 열어 관찰한 후, 한 발짝 물러서서 자신의 반응을 자각해 보세요. (잠시 후) 여러분들의 느낌과 감정을 잘 살펴보시고, 평소에 그런 감정을 느끼는 비슷한 상황을 떠올려 보세요. 그런 감정을 일으키는 생각이 무엇인지를 기록한 후 발표하는 시간을 갖겠습니다.", "options": ["① 인지적 집중", "② 체계적 둔감화", "③ 논박", "④ 카타르시스", "⑤ 조형"], "answer": 0, "expl": "문제 상자를 상상해 관찰하고, 감정을 일으키는 생각을 찾아 기록하게 하는 활동은 감정 이면의 생각에 주의를 집중하게 하는 인지적 집중을 위한 것이다."}, {"no": "13-36", "year": 2015, "exam": "2015", "qno": 6, "text": "현실치료 집단상담에서 청소년의 전행동(total behavior) 중 통제하기 쉬운 것부터 순서대로 나열한 것은?", "options": ["① 생리반응-감정-사고-행동", "② 사고-행동-감정-생리반응", "③ 감정-사고-생리반응-행동", "④ 사고-행동-생리반응-감정", "⑤ 행동-사고-감정-생리반응"], "answer": 4, "expl": "글래서는 전행동 중 행동하기가 가장 통제하기 쉽고, 다음이 생각하기이며, 느끼기와 생리반응은 직접 통제하기 어렵다고 보았다."}, {"no": "13-37", "year": 2015, "exam": "2015", "qno": 7, "text": "아들러(Adler)의 개인심리학적 집단상담에서 집단원이 사용하는 자기 보호성향(safeguarding tendency) 기제에 관한 설명으로 옳지 않은 것은?", "options": ["① 사회적 상황에서 무의식적으로 작동한다.", "② 변명은 집단원의 보호성향 중 하나이다.", "③ 철회는 집단원의 보호성향 중 하나이다.", "④ 공격성은 집단원의 보호성향 중 하나이다.", "⑤ 자존감을 지키기 위해 작동한다."], "answer": 0, "expl": "아들러는 무의식보다 개인의 목적과 사적 논리를 중시하는 목적론적 입장이다. 보호성향은 열등감에서 자존감을 지키기 위해 선택된 전략으로 이해되므로, 무의식적으로 작동한다는 ①이 정답으로 처리되었다."}, {"no": "13-38", "year": 2015, "exam": "2015", "qno": 8, "text": "게슈탈트 집단상담 기법과 그 내용으로 옳지 않은 것은?", "options": ["① 신체활동 과장하기: 신체언어로 보내는 미묘한 신호와 단서를 잘 지각한다.", "② 순회하기: 집단원들이 돌아가면서 평소에 표현하지 않았던 것을 이야기한다.", "③ 환상대화법: 내적 분열과 궁극적인 성격을 통합하여 자각한다.", "④ 연결조성법: 미해결된 상황을 현재 상황과 통합하여 인식한다.", "⑤ 꿈작업: 꿈의 내용을 기억하고 그것이 마치 지금 일어난 것처럼 재현한다."], "answer": 3, "expl": "미해결된 상황을 현재와 통합해 인식하게 하는 것은 연결조성법이 아니라 미해결 과제를 지금-여기로 가져와 다루는 작업(빈 의자 등)에 해당한다. 기법과 내용의 연결이 맞지 않는다."}, {"no": "13-39", "year": 2015, "exam": "2015", "qno": 9, "text": "집단상담을 위한 심리극에서 일반적으로 필요로 하지 않는 요소는?", "options": ["① 연출자", "② 작가", "③ 주인공", "④ 보조자아", "⑤ 관객"], "answer": 1, "expl": "심리극의 기본 요소는 연출자(주연출자), 주인공, 보조자아, 관객, 무대다. 대본을 쓰는 작가는 필요하지 않다. 즉흥적으로 진행되기 때문이다."}, {"no": "13-40", "year": 2015, "exam": "2015", "qno": 10, "text": "자신과 타인에게 모두 알려진 부분을 넓혀 인간관계의 효율성을 증진시키기 위해 '남이 모르는 나'를 탐구하게 하는 활동은 무엇에 근거한 것인가?", "options": ["① 영(Young)의 관계효율", "② 프리맥(Premack)의 원리", "③ 조하리(Johari)의 창", "④ 펄스(Perls)의 실존교류", "⑤ 모레노(Moreno)의 공감확대"], "answer": 2, "expl": "조하리의 창은 공개된 나, 눈먼 나(남은 아는데 나는 모르는 나), 숨겨진 나, 미지의 나로 구분하며, 피드백과 자기개방으로 공개된 영역을 넓혀 관계 효율성을 높인다."}, {"no": "13-41", "year": 2015, "exam": "2015", "qno": 11, "text": "집단상담 회기 계획에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 중후반 회기보다 초반 회기에는 집단지도자가 개입할 일이 적다.\nㄴ. 한 회기동안 너무 많은 활동을 계획하여 집단원들이 충분히 생각할 시간이 적어지면 안 된다.\nㄷ. 집단의 특성을 이해하고 에너지 수준을 고려하여 회기당 활동을 계획한다.\nㄹ. 과제를 수행하지 않거나 결석한 집단원을 위한 계획도 수립한다.\nㅁ. 회기를 계획할 때 초반, 중반, 후반의 회기들 간의 차이를 염두에 둘 필요는 없다.", "options": ["① ㄱ, ㄴ, ㄷ", "② ㄱ, ㄷ, ㅁ", "③ ㄴ, ㄷ, ㄹ", "④ ㄱ, ㄴ, ㄷ, ㄹ", "⑤ ㄴ, ㄷ, ㄹ, ㅁ"], "answer": 2, "expl": "활동량 조절(ㄴ), 집단 특성과 에너지 수준 고려(ㄷ), 결석자 대비 계획(ㄹ)은 옳다. 초반 회기는 구조화 등으로 지도자 개입이 많으며(ㄱ), 회기 단계별 차이를 고려해야 한다(ㅁ)."}, {"no": "13-42", "year": 2015, "exam": "2015", "qno": 12, "text": "청소년 집단상담에서 집단원의 행동을 제한해야 할 때가 아닌 것은?", "options": ["① 갈등이나 의견의 불일치를 공공연하게 표현할 때", "② 지나치게 질문만 계속할 때", "③ 제 삼자를 험담할 때", "④ 집단 외부의 이야기를 길게 늘어놓을 때", "⑤ 다른 집단원의 사적인 비밀을 캐내려고 할 때"], "answer": 0, "expl": "갈등이나 의견 불일치를 공공연하게 표현하는 것은 다뤄야 할 집단 작업의 재료이므로 제한 대상이 아니다."}, {"no": "13-43", "year": 2015, "exam": "2015", "qno": 13, "text": "집단상담에서 다음과 같은 기법을 사용하는 가장 중요한 목적은 무엇인가?\n청소년들에게 이제부터 삶이 이틀 밖에 남지 않았다고 상상하게 한 후, 자신은 어디서 무엇을 하고 있을지를 생각하게 하였다. 어디에서 누구와 무엇을 하고 있을 것인가를 구체적으로 기록하게 하고, 전체 집단원이 모여서 자신이 쓴 것을 소리 내어 크게 읽은 후 자신이 이루고 싶은 것들에 대하여 서로 이야기하고 경험을 나누게 하였다.", "options": ["① 불치병 극복", "② 감사 느낌 획득", "③ 계획성 획득", "④ 가치관 명료화", "⑤ 갈등 해소"], "answer": 3, "expl": "삶이 이틀 남았다고 상상해 자신이 진정 원하는 것을 찾게 하는 활동은 무엇이 중요한지 깨닫게 하는 가치관 명료화를 위한 것이다."}, {"no": "13-44", "year": 2015, "exam": "2015", "qno": 14, "text": "집단원 선발에 관한 설명으로 적절하지 않은 것은?", "options": ["① 집단에 따라서는 선발이 불필요하거나 별로 이익이 되지 않을 수 있다.", "② 선발이 불가능할 경우도 있다.", "③ 인구사회학적 요인이나 심리평가 결과를 바탕으로 선발해도 된다.", "④ 집단상담을 시작하여 몇 회기 지난 후에도 선발이 가능하다.", "⑤ 교사나 병원 직원과 같은 의뢰원에 의한 선발은 지양한다."], "answer": 4, "expl": "교사나 병원 직원 같은 의뢰원에 의한 선발도 실제로 자주 이루어지며 유용할 수 있다. 의뢰원에 의한 선발을 지양한다는 ⑤가 적절하지 않다."}, {"no": "13-45", "year": 2015, "exam": "2015", "qno": 15, "text": "젠킨스(Jenkins)의 집단에 대한 평가 내용을 모두 고른 것은?\nㄱ. 목표지향적 방향성\nㄴ. 집단 활동의 성취 수준\nㄷ. 집단의 특이 수준\nㄹ. 집단 자원의 활용 수준\nㅁ. 집단 활동의 개선책", "options": ["① ㄱ, ㄴ, ㄷ", "② ㄴ, ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄹ, ㅁ", "④ ㄱ, ㄷ, ㄹ, ㅁ", "⑤ ㄴ, ㄷ, ㄹ, ㅁ"], "answer": 2, "expl": "젠킨스는 목표지향적 방향성, 집단 활동의 성취 수준, 집단 자원의 활용 수준, 집단 활동의 개선책을 집단 평가 내용으로 제시했다. '집단의 특이 수준'은 포함되지 않는다."}, {"no": "13-46", "year": 2015, "exam": "2015", "qno": 16, "text": "집단상담의 특징에 관한 설명으로 옳지 않은 것은?", "options": ["① 사회의 축소판인 집단에서 참여자들은 유사하고 다양한 경험을 공유할 수 있다.", "② 참여자와 집단리더의 상호작용을 통한 문제해결과 목표달성이 강조된다.", "③ 참여자들은 지지적인 분위기 속에서 새로운 행동을 시도해 볼 수 있다.", "④ 집단리더의 지시나 조언 없이도 참여자들 간에 깊은 사회적 교류 경험을 가질 수 있다.", "⑤ 개인상담에 비해 참여자의 관여와 조절이 쉽고 더 깊어질 수 있다."], "answer": 4, "expl": "집단상담은 여러 사람이 함께해 개인상담보다 참여자에 대한 관여와 조절이 어렵다. 쉽고 깊어질 수 있다는 ⑤가 틀리다."}, {"no": "13-47", "year": 2015, "exam": "2015", "qno": 17, "text": "다음과 같은 특성을 지닌 집단에 관한 설명으로 옳지 않은 것은?\n- 또래와 어울리면서 의사소통, 팀워크 등과 같은 사회적 기술을 익히는 것이 집단의 목적일 경우 적합\n- 결원이 생기면 새로운 집단원이 들어올 수 있음\n- 비교적 장기적으로 운영하는 데 적합", "options": ["① 집단원이 다양한 사람들과 어울릴 기회가 늘어난다.", "② 일상생활의 인간관계 모습을 덜 반영한다.", "③ 집단 응집력이 결여될 수 있다.", "④ 집단 참여 오리엔테이션이 중요하다.", "⑤ 한 회기나 제한된 시간 내에 다루기 어려운 문제탐색은 피하는 것이 좋다."], "answer": 1, "expl": "결원 시 새 집단원이 들어오는 개방집단은 다양한 사람이 오가 실제 일상생활의 인간관계를 더 잘 반영한다. 덜 반영한다는 ②가 틀리다."}, {"no": "13-48", "year": 2015, "exam": "2015", "qno": 18, "text": "집단상담자의 역할을 모두 고른 것은?\nㄱ. 집단목표 및 세부계획 수립\nㄴ. 집단규범의 설정\nㄷ. 집단 흐름의 통제\nㄹ. 집단원 보호하기\nㅁ. 집단원의 모델 되기", "options": ["① ㄱ, ㄴ, ㄷ", "② ㄱ, ㄴ, ㄹ", "③ ㄱ, ㄷ, ㄹ, ㅁ", "④ ㄴ, ㄷ, ㄹ, ㅁ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"], "answer": 4, "expl": "목표·계획 수립, 규범 설정, 흐름 통제, 집단원 보호, 모델 되기 모두 집단상담자의 역할이다."}, {"no": "13-49", "year": 2015, "exam": "2015", "qno": 19, "text": "다음은 어떤 집단에 관한 설명인가?\n- 교칙 수정을 위해 교사나 학생들이 모여서 협의하는 집단\n- 학교폭력 예방 및 대책을 위해 학교상담위원들이 모여 협의하는 집단\n- 지적 능력 결여 학생의 특수학교 전학 여부 결정을 위해 관련 전문가들이 모여 협의하는 집단", "options": ["① 치료집단", "② 성장집단", "③ 과업집단", "④ 교육집단", "⑤ 지지집단"], "answer": 2, "expl": "교칙 수정, 학교폭력 대책, 전학 여부 결정처럼 특정 과업 달성을 위해 협의하는 집단은 과업집단이다."}, {"no": "13-50", "year": 2015, "exam": "2015", "qno": 20, "text": "집단지도자가 집단의 목적, 규정, 한계 등에 관하여 언급하는 것으로 집단의 틀(frame)을 잡아주는 기법은?", "options": ["① 조형화", "② 보편화", "③ 구조화", "④ 반영화", "⑤ 명료화"], "answer": 2, "expl": "집단의 목적, 규정, 한계 등을 안내해 집단의 틀을 잡아주는 기법은 구조화다."}, {"no": "13-51", "year": 2015, "exam": "2015", "qno": 21, "text": "집단의 치료적 요인과 그에 관한 설명으로 옳지 않은 것은?", "options": ["① 대인관계 입력: 자신이 다른 사람에게 어떻게 지각되는 지에 대해 알게 되는 것", "② 정보공유: 삶에 대한 유익한 정보 습득", "③ 정화: 억압된 감정 표현", "④ 실존적 요인: 삶의 안정성에 대한 인식", "⑤ 일차 가족집단의 교정적 재현: 초기 아동기와 유사한 역동체험을 통한 학습"], "answer": 3, "expl": "실존적 요인은 삶이 불공평하고 고통과 죽음은 피할 수 없으며, 궁극적 책임은 자신에게 있다는 삶의 한계·불안정성을 인식하는 것이다. '삶의 안정성'이 아니다."}, {"no": "13-52", "year": 2015, "exam": "2015", "qno": 22, "text": "집단의 전환(과도) 단계에서 집단지도자의 역할로 적절하지 않은 것은?", "options": ["① 저항을 감지하고 다루기", "② 집단 규범형성 증진하기", "③ 집단원의 불안, 방어, 갈등 등을 다루기", "④ 갈등약화를 위해서 해석, 직면 피하기", "⑤ 집단원의 이해와 책임감 촉진하기"], "answer": 3, "expl": "전환단계에서는 저항과 갈등을 피하지 않고 적절한 해석과 직면으로 다뤄야 한다. 해석·직면을 피한다는 ④가 적절하지 않다."}, {"no": "13-53", "year": 2015, "exam": "2015", "qno": 23, "text": "청소년 집단상담에서 쓰기 활동, 신체 활동, 미술 활동, 읽기 활동, 피드백 활동 등 다양한 활동을 사용하는 목적을 모두 고른 것은?\nㄱ. 편안한 참여를 촉진하기\nㄴ. 상호작용을 생성하고 집단에 초점두기\nㄷ. 초점두기를 변경하기\nㄹ. 초점두기를 심화하기\nㅁ. 경험적 학습기회를 제공하기", "options": ["① ㄱ, ㄴ, ㄷ", "② ㄱ, ㄴ, ㅁ", "③ ㄱ, ㄷ, ㄹ, ㅁ", "④ ㄴ, ㄷ, ㄹ, ㅁ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"], "answer": 4, "expl": "다양한 활동은 편안한 참여 촉진, 상호작용 생성과 초점두기, 초점 변경과 심화, 경험적 학습기회 제공 모두를 위해 사용된다."}, {"no": "13-54", "year": 2015, "exam": "2015", "qno": 24, "text": "집단상담 중 대화를 독점하는 집단원에 대한 상담자의 이해와 대처로 적절하지 않은 것은?", "options": ["① 대화 독점을 허용한 다른 집단원들이 이를 직접 집단에서 다루도록 개입한다.", "② 대화 독점을 통해 얻고자 하는 점과 관련된 역동을 탐색한다.", "③ 집단원들이 독점 집단원에 대한 불만이나 좌절감을 표현하면서 해결할 때까지 기다린다.", "④ 대화 독점은 일종의 강박적인 불안감의 표현으로 자신을 은폐하기 위한 시도로 볼 수 있다.", "⑤ 상담자가 직접 개입하여 다른 집단원들이 대화에 적극 참여하도록 격려한다."], "answer": 2, "expl": "대화를 독점하는 집단원에 대해 상담자는 직접 개입해야 하며, 다른 집단원들이 해결할 때까지 기다리는 것은 적절하지 않다."}, {"no": "13-55", "year": 2015, "exam": "2015", "qno": 25, "text": "집단상담자의 전문성 개발에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 인간의 발달단계에 따른 다양한 측면의 이해와 조망 관련 지식과 경험이 필요하다.\nㄴ. 집단 개입할 때 필요한 다양한 상담이론 관련 지식과 이해를 갖추는 것이 필요하다.\nㄷ. 집단원으로의 참여, 수련지도자와 함께 하는 참여 학습, 직접 집단을 계획·운영하는 경험이 필요하다.\nㄹ. 유능한 집단상담자가 되는 데는 개인상담 경험이 없어도 집단상담 경험이 있으면 된다.", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄴ, ㄷ", "③ ㄱ, ㄴ, ㄹ", "④ ㄱ, ㄷ, ㄹ", "⑤ ㄴ, ㄷ, ㄹ"], "answer": 1, "expl": "발달 이해(ㄱ), 상담이론 지식(ㄴ), 집단 참여·운영 경험(ㄷ)이 필요하다. 유능한 집단상담자에게는 개인상담 경험도 중요하다(ㄹ)."}, {"no": "13-56", "year": 2015, "exam": "2015", "qno": 26, "text": "집단상담 관련 윤리로 옳은 것을 모두 고른 것은?\nㄱ. 청소년의 부모가 집단상담의 내용을 알고 싶어 해서 학생에게 허락 받은 후 최소한의 정보를 제공했다.\nㄴ. 청소년을 지도하는 교직원이 교육과 지도를 위해서 집단 참여학생의 상담내용을 알고 싶어 해서 부모와 학생에게 허락받은 후 최소한의 정보를 제공했다.\nㄷ. 집단에 참여한 학생의 부모가 집단 참여로 인한 자녀의 변화에 감사의 표시로 20만원 상당의 오페라 공연 티켓을 주어 받았다.\nㄹ. 얼굴이 자주 붓고 팔에 멍이 난 아이에게 비밀보장의 예외를 알려주고 부모학대를 학교당국에 신고하려하자 아이가 지금은 집단상담보다 가족이 우선이라고 해서 집단상담에 전념하였다.", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄷ", "③ ㄱ, ㄴ, ㄹ", "④ ㄱ, ㄷ, ㄹ", "⑤ ㄴ, ㄷ, ㄹ"], "answer": 0, "expl": "학생 허락 후 최소 정보 제공(ㄱ), 부모·학생 허락 후 교직원에게 최소 정보 제공(ㄴ)은 윤리적이다. 고가의 선물 수수(ㄷ)와 학대 신고 미이행(ㄹ)은 비윤리적이다."}, {"no": "13-57", "year": 2015, "exam": "2015", "qno": 27, "text": "청소년 집단상담 마무리 단계에서의 목적이나 활동으로 적절하지 않은 것은?", "options": ["① 장점 세례", "② 추웠던 기억 나누기", "③ 갈등해소와 통합", "④ 피드백 주기", "⑤ 묘비명 쓰기"], "answer": 1, "expl": "마무리 단계에서는 장점 세례, 피드백, 갈등 해소와 통합, 묘비명 쓰기처럼 정리·통합하는 활동이 적절하다. 힘들었던(추웠던) 기억을 새로 꺼내 나누는 것은 새로운 문제를 여는 활동이라 마무리에 적절하지 않은 것으로 처리되었다."}, {"no": "13-58", "year": 2015, "exam": "2015", "qno": 28, "text": "집단상담의 평가에 관한 설명으로 옳지 않은 것은?", "options": ["① 종결단계에서 평가를 계획하여 실시한다.", "② 평가대상에 따라 집단원 평가, 집단상담자 평가, 집단상담 프로그램 평가, 집단상담 기관 평가 등이 있다.", "③ 양적 평가와 질적 평가로 이루어질 수 있다.", "④ 일차적 목적은 목표관리를 위한 것이다.", "⑤ 평가결과는 집단상담의 계획, 유지, 보완, 수정, 폐기 여부에 반영된다."], "answer": 0, "expl": "평가 계획은 종결단계가 아니라 집단을 계획하는 단계에서 세워야 한다."}, {"no": "13-59", "year": 2015, "exam": "2015", "qno": 29, "text": "청소년 집단상담을 실시하기 위하여 준비하는 과정이 순서대로 바르게 제시된 것은?\nㄱ. 집단상담 계획서 작성\nㄴ. 집단원 모집광고\nㄷ. 대상집단 요구 파악\nㄹ. 사전 집단면접\nㅁ. 집단원 선정\nㅂ. 부모나 보호자 승인\nㅅ. 사전 검사", "options": ["① ㄱ - ㄴ - ㄷ - ㄹ - ㅁ - ㅂ - ㅅ", "② ㄱ - ㄴ - ㅁ - ㄹ - ㄷ - ㅅ - ㅂ", "③ ㄱ - ㄴ - ㅅ - ㄹ - ㄷ - ㅁ - ㅂ", "④ ㄷ - ㄱ - ㄴ - ㄹ - ㅂ - ㅅ - ㅁ", "⑤ ㄷ - ㄱ - ㄴ - ㅂ - ㄹ - ㅁ - ㅅ"], "answer": 4, "expl": "대상집단 요구 파악(ㄷ) → 계획서 작성(ㄱ) → 모집광고(ㄴ) → 부모·보호자 승인(ㅂ) → 사전 집단면접(ㄹ) → 집단원 선정(ㅁ) → 사전 검사(ㅅ) 순서다."}, {"no": "13-60", "year": 2015, "exam": "2015", "qno": 30, "text": "청소년 집단상담에서 지도자 역할을 하려는 집단원의 이해와 이에 대한 상담자 개입에 관한 설명으로 적절하지 않은 것은?", "options": ["① 지도자처럼 질문, 정보탐색, 조언함으로써 자신이 집단에서 취약해지는 것을 방어하려는 반응이 될 수 있다.", "② 그런 역할을 하려는 집단원은 집단에 참여한 자신의 일차적 문제를 다룰 기회를 상실할 수 있다.", "③ 지도자를 돕는 역할이 될 수 있음으로 잘 수용해서 적절히 활용하는 것이 좋다.", "④ 그런 행동은 다른 집단원이 싫어하는 경향이 있고 집단의 진전을 방해할 수 있다.", "⑤ 그런 행동을 하는 동기를 살펴볼 질문을 하면서 집단에서 자신의 목표 달성을 위해 어떤 역할을 할지 결정하게 한다."], "answer": 2, "expl": "지도자 역할을 하려는 행동은 자기 문제를 드러내지 않으려는 방어일 수 있고 집단 진전을 방해하므로, 그대로 수용·활용하기보다 그 동기를 탐색하도록 개입해야 한다."}, {"no": "12-31", "year": 2014, "exam": "2014", "qno": 1, "text": "다른 집단원들도 자신과 비슷한 환경이나 문제를 가지고 있다는 것을 깨달음으로써 불필요한 방어를 줄이고 상담작업을 촉진하게 하는 치료적 요인은?", "options": ["① 보편성", "② 응집력", "③ 실존적 요인", "④ 희망의 주입", "⑤ 동일시"], "answer": 0, "expl": "다른 사람도 나와 비슷한 문제를 가지고 있다는 깨달음은 보편성으로, 고립감을 줄이고 방어를 낮춰 작업을 촉진한다."}, {"no": "12-32", "year": 2014, "exam": "2014", "qno": 2, "text": "수줍음이 많은 학생들에게 자기표현 증진을 목적으로 매주 1회 12주 진행되며, 매 회기마다 계획된 활동들로 프로그램이 구성된 집단상담 유형은?", "options": ["① 비구조화된 동질적 구성의 자기 성장집단", "② 구조화된 동질적 구성의 집중적 집단", "③ 구조화된 동질적 구성의 분산적 집단", "④ 비구조화된 이질적 구성의 분산적 집단", "⑤ 구조화된 이질적 구성의 집중적 집단"], "answer": 2, "expl": "매 회기 계획된 활동(구조화), 수줍음이 많은 학생들(동질적), 매주 1회 12주(분산적)이므로 구조화된 동질적 구성의 분산적 집단이다."}, {"no": "12-33", "year": 2014, "exam": "2014", "qno": 3, "text": "2인의 공동상담자가 진행하는 집단상담에 관한 설명으로 옳지 않은 것은?", "options": ["① 한 상담자가 개입활동에 주력할 때, 다른 상담자는 집단원 관찰에 주의를 기울일 수 있다.", "② 공동상담자의 인간적 성향과 이론적 배경이 상반될수록 집단에 도움이 된다.", "③ 남성 상담자와 여성 상담자일 때 그 역할이 보완적이어서 집단에 도움이 된다.", "④ 정신역동적 집단에서 한 상담자의 역전이 반응을 다른 상담자가 점검할 수 있어 도움이 된다.", "⑤ 상담회기 전후에 공동상담자 간 토의하는 시간을 갖는 것이 도움이 된다."], "answer": 1, "expl": "공동상담자는 이론적 배경과 성향이 너무 상반되면 갈등과 혼란이 생기므로 서로 조화를 이룰 수 있어야 한다."}, {"no": "12-34", "year": 2014, "exam": "2014", "qno": 4, "text": "한 내담자가 개인상담과 집단상담을 동시에 참여하게 되는 상담모델에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 한 상담자에게 개인상담을 받고 다른 상담자에게 집단상담을 받는 것을 병행(combined)상담이라 한다.\nㄴ. 심한 성격적 문제를 갖고 있을 때 연합(conjoint)상담이 단독상담보다 효과적일 가능성이 크다.\nㄷ. 아동기에 성폭행을 당했거나 수치심과 관련된 문제가 있는 내담자의 경우 정신역동적 연합상담이 단독상담보다 효과적일 가능성이 크다.\nㄹ. 병행상담과 연합상담 모두 단독상담보다 중도탈락자가 발생하는 비율이 낮다.", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄷ, ㄹ", "④ ㄱ, ㄴ, ㄷ", "⑤ ㄴ, ㄷ, ㄹ"], "answer": 4, "expl": "같은 상담자에게 개인상담과 집단상담을 함께 받는 것이 병행(combined)상담이고, 서로 다른 상담자에게 받는 것이 연합(conjoint)상담이므로 ㄱ은 틀리다. ㄴ·ㄷ·ㄹ은 옳다."}, {"no": "12-35", "year": 2014, "exam": "2014", "qno": 5, "text": "교류분석 집단상담 기법을 모두 고른 것은?\nㄱ. 재구조화(restructuring)\nㄴ. 재결정(redecision)\nㄷ. 각본(script)분석\nㄹ. 가족구도(family constellation)분석\nㅁ. 자극통제(stimulus control)\nㅂ. 게임(game)분석", "options": ["① ㄱ, ㄷ, ㄹ", "② ㄴ, ㄷ, ㅂ", "③ ㄷ, ㄹ, ㅂ", "④ ㄴ, ㄷ, ㄹ, ㅂ", "⑤ ㄴ, ㄷ, ㄹ, ㅁ, ㅂ"], "answer": 1, "expl": "재결정(재결단), 각본분석, 게임분석은 교류분석 기법이다. 재구조화와 자극통제는 인지행동·행동주의, 가족구도분석은 아들러 기법이다."}, {"no": "12-36", "year": 2014, "exam": "2014", "qno": 6, "text": "게슈탈트 집단상담의 주요개념 및 기법을 모두 고른 것은?\nㄱ. 미결과제\nㄴ. 신경증의 층\nㄷ. 주장훈련\nㄹ. 지금-여기의 자각\nㅁ. 빈의자 기법\nㅂ. 전이의 해석", "options": ["① ㄱ, ㄴ, ㄷ, ㄹ", "② ㄱ, ㄴ, ㄹ, ㅁ", "③ ㄴ, ㄹ, ㅁ, ㅂ", "④ ㄷ, ㄹ, ㅁ, ㅂ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"], "answer": 1, "expl": "미결과제, 신경증의 층, 지금-여기의 자각, 빈의자 기법은 게슈탈트의 개념·기법이다. 주장훈련은 행동주의, 전이의 해석은 정신분석이다."}, {"no": "12-37", "year": 2014, "exam": "2014", "qno": 7, "text": "개인상담과 비교하였을 때 집단상담이 갖는 특징을 모두 고른 것은?\nㄱ. 다양한 성격의 사람들을 만나므로 학습의 기회가 많을 수 있다.\nㄴ. 집단원의 공통적 피드백이 제공되므로 청소년의 경우 보다 효과적일 수 있다.\nㄷ. 집단상담 과정에서 얻은 통찰에 기초한 대안적 행동을 그 집단에서 직접 시도해 볼 수 있다.\nㄹ. 상담성과를 개관한 연구에서 집단상담은 개인상담 못지않게 효과적인 것으로 나타났다.", "options": ["① ㄱ, ㄷ", "② ㄴ, ㄷ", "③ ㄱ, ㄴ, ㄷ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 4, "expl": "다양한 사람을 통한 학습(ㄱ), 공통 피드백의 효과(ㄴ), 대안 행동의 즉각적 시도(ㄷ), 개인상담 못지않은 효과(ㄹ) 모두 집단상담의 특징이다."}, {"no": "12-38", "year": 2014, "exam": "2014", "qno": 8, "text": "대인간 상호작용을 중시하는 집단상담에서 집단원들이 얻게 되는 통찰에 해당되는 것을 모두 고른 것은?\nㄱ. 다른 사람들에게 자신이 어떻게 비춰지는지에 대한 객관적 시각을 얻게 된다.\nㄴ. 자신의 대인관계 패턴을 이해하게 된다.\nㄷ. 자신이 다른 사람들에게 왜 그런 행동을 하는지 그 동기에 대해 이해하게 된다.", "options": ["① ㄱ", "② ㄴ", "③ ㄱ, ㄴ", "④ ㄴ, ㄷ", "⑤ ㄱ, ㄴ, ㄷ"], "answer": 4, "expl": "대인관계 중심 집단에서는 타인에게 비치는 자신의 모습(ㄱ), 대인관계 패턴(ㄴ), 행동의 동기(ㄷ)에 대한 통찰을 모두 얻을 수 있다."}, {"no": "12-39", "year": 2014, "exam": "2014", "qno": 9, "text": "정신역동적 비구조화 집단상담에서 관찰되는 아래 현상은?\n- A집단원이 자신과 관계없다고 생각하는 자신의 특성 일부를 B집단원이 가지고 있다고 믿게 되었다.\n- A집단원과 B집단원은 집단에서 상호작용하였다.\n- 이에 따라 B집단원은 A집단원이 예상하는 행동을 하게 되어 집단원간 갈등이 유발되었다.", "options": ["① 역전이", "② 분열-우울 위상", "③ 투사적 동일시", "④ 탈자기중심화", "⑤ 역할전환"], "answer": 2, "expl": "자신이 부인하는 특성을 상대에게 투사하고, 상호작용 속에서 상대가 실제로 그렇게 행동하도록 만드는 것은 투사적 동일시다."}, {"no": "12-40", "year": 2014, "exam": "2014", "qno": 10, "text": "상호작용 중심적 집단에서 집단원의 중도 탈락 이유로 옳은 것을 모두 고른 것은?\nㄱ. 친밀감의 영역에서 심각한 내적 갈등이 있을 때\nㄴ. 정서적 전염에 대한 두려움이 있을 때\nㄷ. 집단의 발달과정에 비추어 이른 자기개방이 이루어졌을 때\nㄹ. 상담과정과 집단원의 역할에 대하여 부적절한 오리엔테이션이 이루어졌을 때", "options": ["① ㄱ, ㄴ", "② ㄷ, ㄹ", "③ ㄱ, ㄴ, ㄷ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 4, "expl": "친밀감 영역의 갈등(ㄱ), 정서적 전염에 대한 두려움(ㄴ), 너무 이른 자기개방(ㄷ), 부적절한 오리엔테이션(ㄹ) 모두 얄롬이 제시한 중도 탈락 이유다."}, {"no": "12-41", "year": 2014, "exam": "2014", "qno": 11, "text": "응집력이 높은 집단에서 관찰되는 집단원의 특징으로 옳지 않은 것은?", "options": ["① 다른 집단원들에게 영향을 주기 위해 더 열심히 노력한다.", "② 더 많은 자기 개방을 한다.", "③ 집단 규범을 잘 지키고, 집단 규범 일탈자에게 압력을 가한다.", "④ 부정적 감정은 거의 표현하지 않는다.", "⑤ 한 명의 집단원이 중도 탈락했을 때, 집단의 붕괴에 대하여 덜 민감하게 반응한다."], "answer": 3, "expl": "응집력이 높은 집단에서는 신뢰를 바탕으로 부정적 감정도 솔직하게 표현한다. 부정적 감정을 거의 표현하지 않는다는 ④가 틀리다."}, {"no": "12-42", "year": 2014, "exam": "2014", "qno": 12, "text": "비구조화 집단상담에서 신뢰 대 불신, 참여의 주저, 의미의 추구, 의존이 주된 관심사가 되는 발달단계는?", "options": ["① 계획단계", "② 초기단계", "③ 전환단계", "④ 작업단계", "⑤ 종결단계"], "answer": 1, "expl": "신뢰 대 불신, 참여의 주저, 의미 추구, 상담자에 대한 의존은 집단의 초기단계 주된 관심사다."}, {"no": "12-43", "year": 2014, "exam": "2014", "qno": 13, "text": "집단원이 집단상담 중 경험한 아래 현상이 의미하는 개념은?\n- 강렬한 긍정적 정서를 표현했는데, 이것은 그(녀)에게는 드문 일이다.\n- 조롱, 거부, 휘말림 등 두려워하는 끔찍한 일이 일어나지 않았다.\n- 전에 알지 못했던 자기의 부분을 회복했고, 그리하여 새로운 방식으로 타인과 관계할 수 있었다.", "options": ["① 정화", "② 치료요인으로서 실존적 요인", "③ 교정적 정서 체험", "④ 탈감각화", "⑤ 집단에서 사회적 강화"], "answer": 2, "expl": "두려워하던 감정을 표현했는데 우려한 일이 일어나지 않고 새로운 방식으로 관계하게 된 경험은 교정적 정서 체험이다."}, {"no": "12-44", "year": 2014, "exam": "2014", "qno": 14, "text": "성장집단에서 집단규범 형성을 위한 상담자 역할에 해당하는 것을 모두 고른 것은?\nㄱ. 자기 개방의 격려\nㄴ. 솔직한 표현의 격려\nㄷ. 비생산적인 행동에 대한 개입\nㄹ. 지금-여기 자각의 촉진", "options": ["① ㄱ, ㄴ", "② ㄴ, ㄷ", "③ ㄷ, ㄹ", "④ ㄱ, ㄴ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 4, "expl": "자기개방 격려, 솔직한 표현 격려, 비생산적 행동에 대한 개입, 지금-여기 자각 촉진 모두 규범 형성을 위한 상담자 역할이다."}, {"no": "12-45", "year": 2014, "exam": "2014", "qno": 15, "text": "상담자 반응에 해당하는 것으로 보기 중 옳은 것을 모두 고른 것은?\n<상담자 반응>\n비구조화 집단상담의 초기 단계에 집단원이 \"침묵이 계속되니까 괜스레 침이 마르고 긴장되네요\"라고 이야기 하였다. 이에 상담자가 빙그레 미소를 짓고 잠시 후 \"조금 전 침묵이 이어질 때 00님이 심정을 이야기해 주어서 집단이 활기를 띠게 되고, 무엇보다 00님이 선뜻 용기를 내어 다소간 긴장되는 심정을 이야기해 주어서, 우리 집단에서 하고자 하는 것을 잘 보여준 것 같아 반갑고 흐뭇합니다.\"라고 반응하였다.\n<보기>\nㄱ. 지금-여기의 활성화\nㄴ. 사회적 강화\nㄷ. 규범의 수립\nㄹ. 모델링의 제시", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄹ", "③ ㄴ, ㄷ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 4, "expl": "상담자의 반응은 지금-여기의 경험을 활성화하고, 개방한 행동을 칭찬(사회적 강화)하며, 개방의 규범을 세우고, 미소와 반응으로 모델링을 보여준다. 네 가지 모두 해당한다."}, {"no": "12-46", "year": 2014, "exam": "2014", "qno": 16, "text": "초보 집단상담자가 실시하기에 상대적으로 용이한 집단상담의 형태는?", "options": ["① 구조적, 폐쇄적, 동질적 집단상담", "② 구조적, 개방적, 이질적 집단상담", "③ 개방적, 분산적, 이질적 집단상담", "④ 비구조적, 개방적, 이질적 집단상담", "⑤ 비구조적, 폐쇄적, 분산적 집단상담"], "answer": 0, "expl": "초보 상담자에게는 계획된 활동이 있는 구조적, 구성원이 고정된 폐쇄적, 비슷한 특성의 동질적 집단이 상대적으로 진행하기 쉽다."}, {"no": "12-47", "year": 2014, "exam": "2014", "qno": 17, "text": "집단상담 평가에 관한 설명으로 옳지 않은 것은?", "options": ["① 매회기마다 실시하여야만 한다.", "② 평가의 일차적인 목적은 목표 관리이다.", "③ 평가의 주체는 집단상담자이며 대상은 집단원이다.", "④ 평가 내용에는 집단의 분위기, 응집성, 의사소통 형태, 인간관계 형태 등이 포함된다.", "⑤ 평가의 주체와 대상이 다르다는 것은 상담자와 집단원이 동반체제가 되어 집단상담을 진행해야 함을 의미한다."], "answer": 0, "expl": "평가는 필요한 시점에 계획적으로 실시하는 것이며, 매 회기마다 반드시 실시해야 하는 것은 아니다."}, {"no": "12-48", "year": 2014, "exam": "2014", "qno": 18, "text": "집단상담 계획을 위한 진행과정을 순서대로 나열한 것은?\nㄱ. 사전 면담\nㄴ. 욕구 파악\nㄷ. 사전 검사\nㄹ. 계획안 작성\nㅁ. 집단원 선정", "options": ["① ㄱ - ㄴ - ㄷ - ㄹ - ㅁ", "② ㄱ - ㄷ - ㄴ - ㅁ - ㄹ", "③ ㄴ - ㄹ - ㄱ - ㅁ - ㄷ", "④ ㄹ - ㅁ - ㄱ - ㄴ - ㄷ", "⑤ ㄴ - ㅁ - ㄱ - ㄹ - ㄷ"], "answer": 2, "expl": "욕구 파악(ㄴ) → 계획안 작성(ㄹ) → 사전 면담(ㄱ) → 집단원 선정(ㅁ) → 사전 검사(ㄷ) 순서다."}, {"no": "12-49", "year": 2014, "exam": "2014", "qno": 19, "text": "집단상담자의 역할에 관한 설명으로 옳은 것은?", "options": ["① 비구조적 집단상담에서는 상담자에게 요구되는 역할은 없다.", "② 집단원의 저항이 있을 경우 저항이 집단에 도움이 되도록 활용할 수 있다.", "③ 집단의 규범은 집단원에 의해서 형성하여야 하므로 상담자가 관여하지 않아야 한다.", "④ 공동상담자와 함께 진행할 때는 서로 합의하여 매회기 상담자를 정하여 그 역할을 수행하는 것이 좋다.", "⑤ 독점하는 집단원이 있을 경우 상호작용을 촉진시킬 수 있도록 그의 능력을 적극 장려하고 활용한다."], "answer": 1, "expl": "집단원의 저항은 집단 역동을 이해하고 작업하는 데 도움이 되도록 활용할 수 있다. ①·③은 상담자 역할을 부정하고, ④는 공동상담의 장점을 살리지 못하며, ⑤ 독점은 제한해야 한다."}, {"no": "12-50", "year": 2014, "exam": "2014", "qno": 20, "text": "집단상담의 윤리와 규범에 관한 설명으로 옳지 않은 것은?", "options": ["① 집단상담 중에는 때로 집단원에게 익숙한 사회적 규범과 다른 행동을 요구하기도 한다.", "② 규범이 명확할수록 집단상담 진행에 도움이 된다.", "③ 집단원의 권리보다는 집단의 권리가 존중되어야 한다.", "④ 집단에서 권장하는 행동 등과 같은 긍정적인 규범도 있다.", "⑤ 집단상담의 궁극적인 요구는 집단원의 변화에 초점을 두어야 한다."], "answer": 2, "expl": "집단에서도 집단원 개개인의 권리가 우선적으로 존중되어야 한다. 집단의 권리를 집단원의 권리보다 앞세우는 ③이 틀리다."}, {"no": "12-51", "year": 2014, "exam": "2014", "qno": 21, "text": "비자발적인 청소년의 참여 동기를 촉진시키는 방법으로 옳지 않은 것은?", "options": ["① 집단원이 수용받는 경험을 하게 한다.", "② 집단을 거부할 권리나 비밀유지 등을 고지한다.", "③ 집단에 대한 자신의 마음을 표현할 수 있는 시간을 충분히 가지게 한다.", "④ 상담자는 진실하게 대하고 집단원의 욕구와 특성에 맞는 흥미롭고 창의적인 활동을 계획한다.", "⑤ 명령이나 강제로 참여하게 된 집단원에게는 상담 내용과 목표에 대해 알려 주지 않는 것이 참여도를 높인다."], "answer": 4, "expl": "명령이나 강제로 참여한 집단원에게도 상담 내용과 목표를 알려야 참여 동기가 생긴다. 알려 주지 않는 것은 사전동의 원칙에도 어긋난다."}, {"no": "12-52", "year": 2014, "exam": "2014", "qno": 22, "text": "청소년 집단상담을 계획할 때 고려해야 할 기본사항으로 옳지 않은 것을 모두 고른 것은?\nㄱ. 청소년은 또래와의 상호관계가 중요하므로 중학생으로 집단을 구성할 경우에는 15명 이상으로 진행하는 것이 바람직하다.\nㄴ. 청소년은 특성상 끈기가 부족하므로 집단상담 한 회기 지속시간은 50분 미만으로 하여야 한다.\nㄷ. 청소년 집단상담은 구조적 집단상담의 형태로 진행하는 것이 더 효과적이다.\nㄹ. 집단원을 선발할 때 청소년의 호소문제와 특성뿐 아니라 가족관계도 반드시 파악하여야 한다.", "options": ["① ㄱ, ㄴ", "② ㄱ, ㄴ, ㄹ", "③ ㄱ, ㄷ, ㄹ", "④ ㄴ, ㄷ, ㄹ", "⑤ ㄱ, ㄴ, ㄷ, ㄹ"], "answer": 1, "expl": "중학생 집단은 보통 8~10명 내외가 적당하고(ㄱ), 회기 시간은 연령·특성에 따라 조절하며 50분 미만으로 정해야 하는 것은 아니고(ㄴ), 가족관계를 반드시 파악해야 하는 것도 아니다(ㄹ). 구조적 집단이 더 효과적이라는 ㄷ만 옳다."}, {"no": "12-53", "year": 2014, "exam": "2014", "qno": 23, "text": "다음 대화에서 집단상담자가 적용한 기술은?\n집단원: 주말에 친구들과 시내에 갔었어요. 패스트 푸드점에 갔는데 내가 원하는 것을 먹자고 주장할 수가 없었어요.\n집단상담자: 지난번 학원을 선택하는 과정에서도 부모님께 너의 생각을 말하지 않았던 것 같은데 이번 행동과 지난번 행동에서 너의 어떤 모습을 볼 수 있을까?", "options": ["① 재진술하기", "② 직면하기", "③ 연결짓기", "④ 저항의 처리", "⑤ 의존성 처리"], "answer": 2, "expl": "이번 행동과 지난번 행동을 이어 자기주장을 하지 못하는 공통 패턴을 보게 하는 연결짓기다."}, {"no": "12-54", "year": 2014, "exam": "2014", "qno": 24, "text": "종결회기에서 심층적인 문제를 노출하는 집단원에 관한 상담자의 반응으로 옳지 않은 것은?", "options": ["① 집단원이 합의하면 시간을 가지고 다룰 수 있다.", "② 심층 문제를 다루지 못한 미진한 마음을 표출하게 한다.", "③ 개인상담으로 진행될 수 있도록 권하고 실행할 수 있는 용기를 준다.", "④ 다른 집단원을 설득해서라도 그 문제를 다루어야 한다.", "⑤ 종결회기여서 충분히 다룰 수 없음을 이해시키고 집단원의 행동을 제한한다."], "answer": 3, "expl": "종결회기에 새로 노출된 심층 문제를 다른 집단원을 설득해서까지 다루는 것은 적절하지 않다. 개인상담으로 연계하는 등 대안을 찾아야 한다."}, {"no": "12-55", "year": 2014, "exam": "2014", "qno": 25, "text": "상담기술에 관한 설명으로 바르게 연결한 것은?\nㄱ. 집단원이 말한 내용을 좀 더 구체적으로 인식하도록 반사해준다.\nㄴ. 문제의 밑바닥에 깔려있는 혼돈되고 갈등적인 것을 명확히 알도록 해준다.\nㄷ. 집단원의 말이나 행동에 새로운 의미를 부여하여 새로운 인식의 틀을 제공한다.", "options": ["① ㄱ - 반영, ㄴ - 해석, ㄷ - 직면", "② ㄱ - 반영, ㄴ - 명료화, ㄷ - 해석", "③ ㄱ - 구체화, ㄴ - 반영, ㄷ - 해석", "④ ㄱ - 반영, ㄴ - 명료화, ㄷ - 직면", "⑤ ㄱ - 구체화, ㄴ - 해석, ㄷ - 직면"], "answer": 1, "expl": "ㄱ은 말한 내용을 되비춰 주는 반영, ㄴ은 혼란스러운 function formatQText(text){
  const lines = String(text).split('\n');
  if(lines.length <= 1){
    return '<div class="qtext-line">' + text + '</div>';
  }
  const first = lines[0];
  const rest = lines.slice(1);
  let html = '<div class="qtext-line">' + first + '</div>';
  html += '<div class="stmt-box">' + rest.map(function(l){return '<div class="stmt-line">'+l+'</div>';}).join('') + '</div>';
  return html;
}

let currentYear = 'all';

let answeredMap = {};

function selectOption(qIdx, optIdx){
  if(answeredMap[qIdx] !== undefined) return;
  answeredMap[qIdx] = optIdx;
  renderQuestions();
}

function setYear(y){
  currentYear = y;
  renderPills();
  renderQuestions();
}

function renderPills(){
  const exams = [...new Set(QUESTIONS.map(q => q.exam))];
  const pillsEl = document.getElementById('yearPills');
  let html = `<button class="pill ${currentYear==='all'?'active':''}" onclick="setYear('all')">전체</button>`;
  exams.forEach(y => {
    html += `<button class="pill ${currentYear===y?'active':''}" onclick="setYear('${y}')">${y}</button>`;
  });
  pillsEl.innerHTML = html;
}

function renderQuestions(){
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  const list = currentYear === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.exam === currentYear);
  list.forEach((q) => {
    const qIdx = QUESTIONS.indexOf(q);
    const picked = answeredMap[qIdx];
    const isAnswered = picked !== undefined;
    const isVoid = q.answer < 0;
    const isCorrect = isAnswered && !isVoid && picked === q.answer;

    const card = document.createElement('div');
    card.className = 'card';
    let optsHtml = '';
    q.options.forEach((opt, i) => {
      let cls = 'opt-btn';
      if(isAnswered){
        if(isVoid && i === picked) cls += ' neutral-picked';
        if(!isVoid && i === q.answer) cls += ' correct-reveal';
        if(!isVoid && i === picked && picked !== q.answer) cls += ' wrong-picked';
      }
      const disabled = isAnswered ? 'disabled' : '';
      optsHtml += `<button class="${cls}" ${disabled} onclick="selectOption(${qIdx},${i})">${opt}</button>`;
    });
    const expl = q.expl ? `<div class="explain">${q.expl}</div>` : '';
    let markHtml = '';
    if(isAnswered){
      if(isVoid){
        markHtml = `<div class="feedback-mark">📌 전항 정답 처리된 문항입니다</div>`;
      } else if(isCorrect){
        markHtml = `<div class="feedback-mark">✅ 정답입니다!</div>`;
      } else {
        markHtml = `<div class="feedback-mark wrong">❌ 오답입니다. 정답은 ${q.answer+1}번입니다.</div>`;
      }
    }
    card.innerHTML = `
      <div class="qnum">문제${q.qno}</div>
      <div class="qtext">${formatQText(q.text)}</div>
      <div class="options">${optsHtml}</div>
      <div class="feedback${isAnswered ? ' open' : ''}">
        ${markHtml}
        ${expl}
      </div>
    `;
    area.appendChild(card);
  });
}

function render(){
  const years = [...new Set(QUESTIONS.map(q => q.year))];
  document.getElementById('metaLine').textContent =
    `${years.length}개년 · 총 ${QUESTIONS.length}문항`;
  renderPills();
  renderQuestions();
}

render();
</script>
</body>
</html>
